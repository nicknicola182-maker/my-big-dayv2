body{font-family:'Outfit','Segoe UI',system-ui,sans-serif;background:#F2E8E4;color:var(--ink);line-height:1.45}
#app{height:100%}
#phone{max-width:440px;margin:0 auto;height:100%;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,0,0,.08)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:84px}
h1,h2,h3{font-weight:600}
h1{font-size:22px}h2{font-family:'Gloock',serif;font-weight:400;font-size:21px}h3{font-size:14.5px}
.small{font-size:12.5px;color:var(--muted)}
.center{text-align:center}
.script{font-family:'Nothing',cursive;color:var(--rose);font-size:22px}
button{font-family:inherit;border:none;cursor:pointer;background:none;font-size:14px;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blush-deep)}
.btn{display:block;width:100%;padding:14px;border-radius:16px;background:var(--ink);color:#fff;font-size:15px;font-weight:700;text-align:center;letter-spacing:.01em}
.btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn.rose,.btn.glam{background:var(--grad);box-shadow:0 6px 18px rgba(201,88,122,.35)}
.btn:disabled{opacity:.35;box-shadow:none}
.chip{display:inline-block;padding:8px 15px;border-radius:22px;background:#fff;border:1.5px solid var(--line);font-size:13.5px;margin:0 6px 9px 0}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 16px 12px;box-shadow:0 1px 3px rgba(180,120,140,.06)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:20px;text-transform:uppercase}
.b-green{background:var(--green-bg);color:var(--green)} .b-amber{background:var(--amber-bg);color:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)} .b-purple{background:var(--purple-bg);color:var(--purple)}
.b-grey{background:#F1EAE7;color:var(--muted)}
/* ---------- landing ---------- */
#landing{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#FBEAEE 0%,#F6DDE2 40%,#F8E3CF 100%);background-size:140% 140%;animation:breathe 12s ease-in-out infinite}
@keyframes breathe{0%,100%{background-position:0% 0%}50%{background-position:100% 100%}}
.land-inner{position:relative;z-index:3;text-align:center;padding:0 34px;max-width:420px}
.land-title{font-family:'Gloock',serif;font-weight:400;font-size:44px;line-height:1.08;margin:6px 0 16px;color:#3A2530}
.land-sub{font-size:15px;color:#7A5F6B;margin-bottom:30px;line-height:1.55}
.land-foot{margin-top:22px;font-size:12px;color:#A98995;letter-spacing:.06em}
.btn.glam{position:relative;overflow:hidden}
#landing .btn.glam{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 18px rgba(201,88,122,.35)}50%{box-shadow:0 6px 30px rgba(201,88,122,.6)}}
.petal{position:absolute;top:-30px;width:15px;height:19px;z-index:1;opacity:.8;
  background:linear-gradient(135deg,#F5C4D2,#E79BB3);border-radius:76% 24% 60% 40%/55% 45% 74% 26%;
  animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-4vh) translateX(0) rotate(0deg)}25%{transform:translateY(24vh) translateX(26px) rotate(95deg)}50%{transform:translateY(50vh) translateX(-14px) rotate(190deg)}75%{transform:translateY(76vh) translateX(20px) rotate(280deg)}100%{transform:translateY(106vh) translateX(-8px) rotate(370deg)}}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#F3D9A4;z-index:2;opacity:0;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.9;transform:scale(1.15)}}
/* ---------- onboarding ---------- */
#ob{position:relative;height:100%;background:var(--paper);z-index:50;display:flex;flex-direction:column;max-width:440px;margin:0 auto}
#ob .prog{height:5px;background:var(--line);margin:0 20px;border-radius:3px;overflow:hidden}
#ob .prog i{display:block;height:100%;background:var(--grad);transition:width .3s;border-radius:3px}
#ob .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:14px 22px;display:flex;flex-direction:column}
.qwrap{margin:auto 0;padding:12px 0 20px;width:100%}
#ob .qtitle{font-family:'Gloock',serif;font-weight:400;font-size:27px;line-height:1.15;margin-bottom:8px}
#ob .qsub{color:var(--muted);font-size:14.5px;margin-bottom:22px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 17px;margin-bottom:10px;font-size:15px;font-weight:600;transition:border-color .12s, background .12s}
.opt small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:400}
.opt.on{border-color:var(--rose);background:#FDF1F5;box-shadow:0 2px 10px rgba(201,88,122,.12)}
.opt.evt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.orline{text-align:center;color:var(--muted);font-size:12.5px;margin:10px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.mixlab{font-size:13px;font-weight:700;color:var(--rose);margin-bottom:6px;letter-spacing:.02em}
#ob .foot{padding:14px 22px calc(20px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;flex:none;background:var(--paper)}
#ob .foot .btn{flex:1}
.skip{color:var(--muted);text-decoration:underline;font-size:13.5px;white-space:nowrap}
/* ---------- header ---------- */
header.app{padding:18px 20px 12px;background:linear-gradient(150deg,var(--blush) 0%,#FBEFF0 55%,var(--apricot) 100%);border-bottom:1px solid var(--line)}
header.app .names{font-family:'Gloock',serif;font-size:21px}
header.app .sub{font-size:12.5px;color:var(--muted)}
/* ---------- tabbar ---------- */
#tabbar{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;padding:9px 0 7px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabbar button.on{color:var(--rose);font-weight:700}
#tabbar .ico{font-size:19px;line-height:1}
/* ---------- shared bits ---------- */
.sect{margin:18px 16px 8px;display:flex;justify-content:space-between;align-items:baseline}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--grad)}
.stat3{display:flex;gap:10px;margin:0 16px 12px}
.stat3 .card{flex:1;margin:0;text-align:center;padding:12px 6px}
.stat3 b{font-size:17px;display:block}
.stat3 span{font-size:11px;color:var(--muted)}
.acc{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 16px 10px;overflow:hidden}
.acc>button.head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font-size:14.5px;font-weight:700;text-align:left}
.acc .items{padding:0 16px 8px;display:none}
.acc.open .items{display:block}
.itemrow{padding:10px 0;border-top:1px solid var(--line)}
.itemrow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.itemrow .nm{font-size:14px;font-weight:700}
.itemrow .note{font-size:12px;color:var(--muted);margin-top:2px}
.itemrow .fields{display:flex;gap:8px;margin-top:8px}
.itemrow .fields label{flex:1;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.itemrow .fields input{padding:7px 9px;font-size:13.5px;margin-top:2px}
.findme{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--purple);background:var(--purple-bg);border-radius:18px;padding:6px 12px}
.lockline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted);background:#FAF4F1;border:1px dashed var(--line);border-radius:10px;padding:8px 11px;width:100%;text-align:left}
.togg{width:40px;height:24px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.togg.on{background:var(--green)}
.togg i{position:absolute;top:2.5px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.togg.on i{left:18px}
.task{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:none}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--blush-deep);flex:none;margin-top:1px;font-size:13px;color:#fff;display:flex;align-items:center;justify-content:center}
.task.done .tick{background:var(--green);border-color:var(--green)}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.task .tx{font-size:14px}
.task .meta{font-size:11.5px;color:var(--muted)}
.grow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.grow:first-child{border-top:none}
.gname{font-size:14px;font-weight:700}
.gmeta{font-size:11.5px;color:var(--muted)}
.rsvp{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;flex:none}
.rsvp.yes{background:var(--green-bg);color:var(--green)} .rsvp.no{background:var(--red-bg);color:var(--red)} .rsvp.pending{background:#F1EAE7;color:var(--muted)}
.rs{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rs:first-child{border-top:none}
.rs .time input{width:74px;text-align:center;padding:6px;font-size:13px}
.rs .what{flex:1}
.rs .what .nm{font-size:14px;font-weight:700}
.tbl{background:#fff;border:1px solid var(--line);border-radius:16px;margin:0 16px 10px;padding:13px 16px}
.tbl .head{display:flex;justify-content:space-between;align-items:baseline}
.seat{display:inline-block;background:var(--blush);border-radius:14px;padding:4px 11px;font-size:12.5px;margin:6px 6px 0 0}
.sheetwrap{position:fixed;inset:0;background:rgba(45,28,36,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:22px 22px 30px}
.sheet h2{margin-bottom:6px}
.paylist{margin:14px 0}
.paylist div{display:flex;gap:10px;padding:7px 0;font-size:14px;align-items:flex-start}
.paylist .pi{color:var(--rose);font-weight:700}
.price{font-family:'Gloock',serif;font-size:32px;text-align:center;margin:8px 0 2px}
.warn{background:var(--amber-bg);border:1px solid #EBD9B4;border-radius:12px;padding:11px 14px;font-size:13px;margin:0 16px 10px}
.info{background:var(--purple-bg);border:1px solid #DCC8E8;border-radius:12px;padding:11px 14px;font-size:13px;margin:0 16px 10px}
.empty{text-align:center;color:var(--muted);padding:34px 30px;font-size:14px}
.reveal{padding:20px 26px}
.reveal .big{font-family:'Gloock',serif;font-size:30px;margin:10px 0 4px}
.revstat{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0}
.revstat div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px}
.revstat b{display:block;font-size:19px}
.printonly{display:none}
@media print{
  body *{visibility:hidden} .printarea,.printarea *{visibility:visible}
  .printarea{position:absolute;top:0;left:0;width:100%}
  #tabbar{display:none}
}
/* ---------- v20 feel: hero ---------- */
.hero{padding:30px 22px 6px;text-align:center}
.hero .eyebrow{font-size:12px;letter-spacing:.28em;color:#B08894;text-transform:uppercase;margin-bottom:10px}
.hero .couple{font-family:'Gloock',serif;font-size:34px;line-height:1.1;color:#3A2530}
.hero .amp{color:var(--rose);font-family:'Nothing',cursive;font-size:26px;padding:0 4px}
.hero .when{font-family:'Gloock',serif;font-style:italic;font-size:15.5px;color:#7A5F6B;margin-top:10px}
.hero .flourish{width:120px;height:2px;margin:14px auto;background:linear-gradient(90deg,transparent,var(--blush-deep),transparent)}
.hero .where{font-size:12px;letter-spacing:.16em;color:#A08792;text-transform:uppercase;line-height:1.9}
/* stat cards */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 16px 14px}
.statgrid .sc{background:#fff;border-radius:20px;padding:18px 10px 16px;text-align:center;border:1px solid var(--line);border-top:4px solid var(--gold);box-shadow:0 2px 8px rgba(180,120,140,.07)}
.statgrid .sc .em{font-size:26px;margin-bottom:8px}
.statgrid .sc .lb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.statgrid .sc .val{font-size:24px;font-weight:700}
.statgrid .sc .sub2{font-size:12px;color:var(--muted);margin-top:4px}
/* gradient bar */
.gbar{height:22px;border-radius:12px;background:linear-gradient(90deg,#9DC3A2,#E8D48A,#DE9AAB);position:relative;margin:14px 0 8px}
.gbar .mark{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:#8A6FA8;opacity:.75}
.gbar-labs{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
/* donut */
.donutwrap{display:flex;flex-direction:column;align-items:center}
.dlegend{width:100%;margin-top:8px}
.dlegend .dl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.dlegend .dl:first-child{border-top:none}
.dlegend .dot{width:14px;height:14px;border-radius:50%;flex:none}
.dlegend .amt{margin-left:auto;font-weight:700}
.dlegend .pc{width:44px;text-align:right;color:var(--muted);font-size:12px}
/* section panels */
.secpanel{border-radius:22px;margin:0 14px 16px;padding:16px 16px 6px;border:1px solid rgba(0,0,0,.03)}
.secpanel .shead{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.secpanel .shead .em{font-size:19px}
.secpanel .shead .nm{font-family:'Gloock',serif;font-size:19px}
.secpanel .shead .tot{margin-left:auto;font-weight:700;font-size:16px}
.v20item{padding:14px 0;border-top:1.5px dashed rgba(0,0,0,.08);display:flex;gap:13px}
.v20item:first-of-type{border-top:none}
.tickc{width:38px;height:38px;border-radius:50%;flex:none;background:#9BC0A6;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;margin-top:2px;box-shadow:inset 0 -2px 4px rgba(0,0,0,.08)}
.tickc.off{background:#E4DCD8;color:#B7ACA6}
.v20item .bd{flex:1;min-width:0}
.v20item .nm{font-size:15.5px;font-weight:700}
.v20item .ds{font-size:13px;color:var(--muted);margin-top:2px}
.v20item .sup{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A08792;margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.v20item .sup .pill{background:#DFEDE2;color:#4A7A58;border-radius:12px;padding:2px 9px;font-weight:700;letter-spacing:.08em;font-size:10px}
.v20item .sup .lockpill{background:var(--purple-bg);color:var(--purple);border-radius:12px;padding:2px 9px;font-weight:700;letter-spacing:.08em;font-size:10px}
.costwrap{display:flex;align-items:center;gap:9px;margin-top:9px}
.costwrap .curs{color:var(--muted);font-size:15px}
.costwrap input{background:#fff;border:none;border-radius:16px;box-shadow:0 2px 8px rgba(160,120,135,.13);font-size:19px;font-weight:600;text-align:center;padding:11px 12px;max-width:170px}
.costwrap .was{font-size:12px;color:var(--muted)}
.minifields{display:flex;gap:8px;margin-top:9px}
.minifields label{flex:1;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.minifields input{width:100%;padding:8px 9px;font-size:13px;margin-top:3px;border:1px solid var(--line);border-radius:10px}
/* savebar */
.savebar{position:fixed;left:0;right:0;bottom:56px;max-width:440px;margin:0 auto;z-index:38;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(253,247,244,.92);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.savebar .tot{font-size:19px;font-weight:700}
.savebar .ovr{font-size:12px;font-weight:600}
.savebar .fabplus{margin-left:auto;width:52px;height:52px;border-radius:50%;background:#9BC0A6;color:#fff;font-size:26px;box-shadow:0 4px 14px rgba(115,160,125,.5);flex:none}
.savebar .send{background:var(--grad);color:#fff;font-weight:700;border-radius:26px;padding:13px 18px;flex:none;box-shadow:0 4px 14px rgba(201,88,122,.35)}
/* add sheet v20 style */
.addsheet h2{font-family:'Gloock',serif;font-weight:400;font-size:24px}
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:26px;overflow:hidden;margin:16px 0}
.seg button{flex:1;padding:12px 8px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--grad);color:#fff}
.flab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A7580;margin:14px 0 6px;font-weight:700}
.addsheet input,.addsheet select{border-radius:16px;padding:13px 15px;font-size:15px}
.addsheet input:focus{border-color:var(--blush-deep)}
.addrow{display:flex;gap:10px;margin-top:20px}
.addrow .btn{border-radius:26px}
.addrow .btn.go{background:#9BC0A6;box-shadow:0 4px 14px rgba(115,160,125,.4)}
/* toast */
#toast{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:22px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:.95}
/* sheet slide-up + v20 add-sheet polish */
.sheetwrap{animation:dim .2s ease}
@keyframes dim{from{background:rgba(45,28,36,0)}to{background:rgba(45,28,36,.5)}}
.sheet{animation:rise .28s cubic-bezier(.21,.8,.32,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
.addsheet input#adName,.addsheet input#tdName{border:2px solid var(--blush-deep);box-shadow:0 0 0 4px rgba(235,183,198,.18)}
.qpill{background:#E9F1F8;color:#4F7590;border-radius:12px;padding:2px 9px;font-weight:700;letter-spacing:.08em;font-size:10px;text-transform:uppercase}
.quoterow{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.quoterow:first-child{border-top:none}
.quoterow .bd{flex:1;min-width:0}
.quoterow .who{font-size:14px;font-weight:700}
.quoterow .nt{font-size:12px;color:var(--muted)}
.quoterow .amt{font-weight:700;font-size:15px;white-space:nowrap}
.usebtn{font-size:11.5px;font-weight:700;color:#4A7A58;background:#DFEDE2;border-radius:14px;padding:5px 11px;white-space:nowrap}
.usebtn.on{background:var(--green);color:#fff}
.docrow{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13.5px;border-top:1px solid var(--line)}
.tabdot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px rgba(194,154,91,.8)}
/* ---------- Question Vignettes: one animated moment per question ---------- */
.vig{height:92px;position:relative;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.vig .e{font-size:44px;line-height:1;display:inline-block}
/* names — two hearts find each other */
.vig-names .e:nth-child(1){animation:vheartR 2.8s ease-in-out infinite}
.vig-names .e:nth-child(2){animation:vheartL 2.8s ease-in-out infinite}
@keyframes vheartR{0%,100%{transform:translateX(-16px) rotate(-10deg)}50%{transform:translateX(3px) rotate(5deg) scale(1.15)}}
@keyframes vheartL{0%,100%{transform:translateX(16px) rotate(10deg)}50%{transform:translateX(-3px) rotate(-5deg) scale(1.15)}}
/* gate — the rings */
.vig-gate .ring{width:42px;height:42px;border:5px solid var(--gold);border-radius:50%;animation:vringA 3s ease-in-out infinite}
.vig-gate .ring+.ring{margin-left:-14px;border-color:#D9B36C;animation:vringB 3s ease-in-out infinite}
.vig-gate .sp{position:absolute;top:12px;right:calc(50% - 44px);font-size:18px;animation:vtwinkle 2s ease-in-out infinite}
@keyframes vringA{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(6deg) translateY(-5px)}}
@keyframes vringB{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-6deg) translateY(-5px)}}
/* religion — candlelight */
.vig-religion .e{animation:vglow 2.4s ease-in-out infinite}
@keyframes vglow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 5px #F3D9A4)}50%{transform:scale(1.07);filter:drop-shadow(0 0 16px #F3C97E)}}
/* branch — dove over the steeple */
.vig-branch .e{animation:vbob 3.2s ease-in-out infinite}
.vig-branch .dove{position:absolute;top:8px;font-size:22px;animation:vfly 4.5s ease-in-out infinite}
@keyframes vbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes vfly{0%{transform:translateX(-70px);opacity:0}25%,70%{opacity:1}50%{transform:translateX(0) translateY(-8px)}100%{transform:translateX(70px);opacity:0}}
/* mix — two hearts in orbit */
.vig-mix .orb{position:relative;width:80px;height:80px}
.vig-mix .oa,.vig-mix .ob{position:absolute;top:50%;left:50%;font-size:26px;margin:-13px}
.vig-mix .oa{animation:vorbA 4s linear infinite}
.vig-mix .ob{animation:vorbB 4s linear infinite}
@keyframes vorbA{from{transform:rotate(0deg) translateX(24px)}to{transform:rotate(360deg) translateX(24px)}}
@keyframes vorbB{from{transform:rotate(180deg) translateX(24px)}to{transform:rotate(540deg) translateX(24px)}}
/* variant — bunting */
.vig-variant .flag{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--rose);margin:0 3px;animation:vflag 1.9s ease-in-out infinite;transform-origin:top center}
.vig-variant .flag:nth-child(2n){border-top-color:var(--gold)}
.vig-variant .flag:nth-child(3n){border-top-color:#9BC0A6}
.vig-variant .flag:nth-child(2){animation-delay:.15s}.vig-variant .flag:nth-child(3){animation-delay:.3s}
.vig-variant .flag:nth-child(4){animation-delay:.45s}.vig-variant .flag:nth-child(5){animation-delay:.6s}
.vig-variant .flag:nth-child(6){animation-delay:.75s}
@keyframes vflag{0%,100%{transform:skewX(0deg)}50%{transform:skewX(10deg) translateY(3px)}}
/* country — the world + the pin */
.vig-country .e{animation:vspin 9s linear infinite}
.vig-country .pin{position:absolute;top:2px;font-size:24px;animation:vpin 1.6s ease-in-out infinite}
@keyframes vspin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes vpin{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
/* home — hearts from the chimney */
.vig-home .hh{position:absolute;font-size:14px;opacity:0;animation:vrise 2.8s linear infinite}
.vig-home .hh:nth-child(3){animation-delay:.9s;font-size:11px}
.vig-home .hh:nth-child(4){animation-delay:1.8s;font-size:17px}
@keyframes vrise{0%{transform:translate(14px,6px) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translate(26px,-44px) scale(1.1);opacity:0}}
/* date — the heart lands on the day */
.vig-date .pop{position:absolute;top:8px;font-size:22px;animation:vpop 2.3s ease-in-out infinite}
@keyframes vpop{0%,25%{transform:scale(0);opacity:0}45%,70%{transform:scale(1.15);opacity:1}90%,100%{transform:scale(0);opacity:0}}
/* guests — the toast */
.vig-guests .e:nth-child(1){transform-origin:bottom right;animation:vclinkL 2s ease-in-out infinite}
.vig-guests .e:nth-child(2){transform-origin:bottom left;animation:vclinkR 2s ease-in-out infinite}
.vig-guests .sp{position:absolute;top:14px;font-size:16px;animation:vtwinkle 2s ease-in-out infinite;animation-delay:.5s}
@keyframes vclinkL{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(6deg)}}
@keyframes vclinkR{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-6deg)}}
@keyframes vtwinkle{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
/* budget — gold into the heart box */
.vig-budget{flex-direction:column;gap:0}
.vig-budget .coin{position:absolute;top:0;font-size:19px;animation:vcoin 2.1s ease-in infinite}
.vig-budget .coin:nth-child(2){animation-delay:.7s;margin-left:-18px}
.vig-budget .coin:nth-child(3){animation-delay:1.4s;margin-left:18px}
.vig-budget .e{margin-top:26px}
@keyframes vcoin{0%{transform:translateY(-6px) rotate(0);opacity:0}25%{opacity:1}85%{opacity:1}100%{transform:translateY(38px) rotate(180deg);opacity:0}}
/* ceremony — the floral arch */
.vig-cer .f{font-size:26px;display:inline-block;animation:vsway 2.6s ease-in-out infinite}
.vig-cer .f:nth-child(1){transform:translateY(12px)}
.vig-cer .f:nth-child(2){font-size:32px;animation-delay:.3s}
.vig-cer .f:nth-child(3){transform:translateY(12px);animation-delay:.6s}
@keyframes vsway{0%,100%{rotate:-7deg}50%{rotate:7deg}}
/* reception — disco */
.vig-rec .e{animation:vspin 6s linear infinite}
.vig-rec .dot{position:absolute;width:7px;height:7px;border-radius:50%;top:50%;left:50%}
.vig-rec .dot:nth-child(2){background:var(--rose);animation:vorbA 3s linear infinite}
.vig-rec .dot:nth-child(3){background:var(--gold);animation:vorbB 3.6s linear infinite}
.vig-rec .dot:nth-child(4){background:#8A5A9E;animation:vorbA 4.4s linear infinite reverse}
/* events — confetti */
.vig-events .c{position:absolute;width:9px;height:12px;border-radius:2px;top:44%;left:50%;opacity:0}
.vig-events .c:nth-child(1){background:var(--rose);animation:vconf 2.4s ease-out infinite}
.vig-events .c:nth-child(2){background:var(--gold);animation:vconf2 2.4s ease-out infinite;animation-delay:.15s}
.vig-events .c:nth-child(3){background:#9BC0A6;animation:vconf3 2.4s ease-out infinite;animation-delay:.3s}
.vig-events .c:nth-child(4){background:#8A5A9E;animation:vconf4 2.4s ease-out infinite;animation-delay:.45s}
.vig-events .c:nth-child(5){background:var(--blush-deep);animation:vconf5 2.4s ease-out infinite;animation-delay:.6s}
.vig-events .e{animation:vbob 2.4s ease-in-out infinite}
@keyframes vconf{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-46px,-52px) rotate(220deg);opacity:0}}
@keyframes vconf2{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(40px,-58px) rotate(-200deg);opacity:0}}
@keyframes vconf3{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(-22px,-64px) rotate(160deg);opacity:0}}
@keyframes vconf4{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(24px,-46px) rotate(-160deg);opacity:0}}
@keyframes vconf5{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(52px,-36px) rotate(120deg);opacity:0}}
/* priorities — three stars */
.vig-prio .e{font-size:30px;animation:vstar 2.2s ease-in-out infinite}
.vig-prio .e:nth-child(2){font-size:40px;animation-delay:.35s}
.vig-prio .e:nth-child(3){animation-delay:.7s}
@keyframes vstar{0%,100%{transform:scale(.85);opacity:.55}50%{transform:scale(1.15);opacity:1}}
/* style — the swatch fan */
.vig-style .sw{width:30px;height:46px;border-radius:8px;margin:0 -8px;box-shadow:0 2px 6px rgba(0,0,0,.12);animation:vfan 3s ease-in-out infinite;transform-origin:bottom center}
.vig-style .sw:nth-child(1){background:var(--rose)}
.vig-style .sw:nth-child(2){background:var(--gold);animation-delay:.15s}
.vig-style .sw:nth-child(3){background:#9BC0A6;animation-delay:.3s}
.vig-style .sw:nth-child(4){background:#8A5A9E;animation-delay:.45s}
@keyframes vfan{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg) translateY(-4px)}}
/* partner — the love letter between phones */
.vig-partner .e{font-size:36px}
.vig-partner .lv{font-size:24px;animation:vshuttle 2.6s ease-in-out infinite}
@keyframes vshuttle{0%,100%{transform:translateX(-26px) translateY(0)}25%{transform:translateX(0) translateY(-12px)}50%{transform:translateX(26px) translateY(0)}75%{transform:translateX(0) translateY(-12px)}}
@media (prefers-reduced-motion: reduce){.vig *{animation:none !important}}
</style>
</head>

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

            } else {

              bytes.push(b & 0xff);
            }
          } else {

          }
        }
      }
      return bytes;
    };

function buildPlan(){
  const p = pack(), a = S.ans;
  const enabled = new Set(a.eventsOn || p.events.filter(e=>e.default!==false).map(e=>e.id));
  const events = p.events.filter(e=>enabled.has(e.id)).map(e=>({...e, name: localEventName(e)}));
  const items = p.items.filter(i=>!i.event || enabled.has(i.event)).map(i=>({
    id:i.id, name:i.name, section:i.section, event:i.event, note:i.note, essential:!!i.essential,
    unit:i.unit, supplierCategory:i.supplierCategory, religious:!!i.religiousRequirement,
    share:i.shareOfBudget||0, on:!!i.essential, custom:false,
    agreed:null, paid:0, dep:null
  }));
  if(a.venueDIY){
    const have = new Set(items.map(i=>i.id));
    DIY_ITEMS.forEach(d=>{ if(!have.has(d.id)) items.push({...d, religious:false, on:true, custom:false, agreed:null, paid:0, dep:null}); });
  }
  allocate(items);
  const wd = a.dateISO ? new Date(a.dateISO) : null;
  const srcTimeline = a.venueDIY ? p.timeline.concat(DIY_TASKS) : p.timeline;
  const timeline = srcTimeline.map((t,ix)=>({id:"t"+ix, task:t.task, mb:t.monthsBefore, critical:!!t.critical, done:false,
    when: wd ? monthLabel(addMonths(wd, -t.monthsBefore)) : t.monthsBefore+" months before"}));
  timeline.sort((x,y)=>y.mb-x.mb);
  const paperwork = p.paperwork.map((pp,ix)=>({id:"p"+ix, item:pp.item, who:pp.who||"", note:pp.note||"", done:false}));
  if(a.homeCountry && a.country && a.homeCountry!==a.country){
    const churchBased = p.faithGroup==="Christian";
    if(churchBased && a.ceremony==="Our own church, back home"){
      paperwork.push({id:"p-dest", item:"You're marrying at home and celebrating abroad — no ceremony is needed overseas. Take your marriage certificate in case a venue or blessing asks for it", who:"Both", note:"One marriage, one "+(p.terms.ceremony||"ceremony")+" — the party abroad is just the party.", done:false});
    } else {
      if(churchBased){
        paperwork.push({id:"p-parish", item:"Ask your parish at home to start the marrying-abroad paperwork — the pre-marriage file and permissions passed through the diocese to the church where you'll marry", who:"Both", note:"Allow six months — this chain moves at church speed.", done:false});
      }
      paperwork.push({id:"p-dest", item:"Check how a marriage in "+countryOf(a.country)[1]+" is recognised at home, and what notice/documents your home country requires", who:"Both", note:"You live in "+countryOf(a.homeCountry)[1]+" and are marrying abroad — start this early.", done:false});
    }
  }
  S.plan = {events, items, timeline, paperwork};
  if(!S.runsheet.length) buildRunsheet();
}
function allocate(items){
  const a = S.ans, total = S.budgetTotal||0;
  const boost = {}; (a.priorities||[]).forEach(pr=>{ boost[PRIO_SECTION[pr]] = 1.22; });
  let sum = 0;
  items.forEach(i=>{ if(i.on){ i.w = i.share * (boost[i.section]||0.96); sum += i.w; } });
  items.forEach(i=>{ i.alloc = (i.on && sum>0 && total>0) ? Math.round(i.w/sum*total) : 0; });
}

function estimateBudget(){

/* ---------- landing ---------- */
function renderLanding(){
  const petals = Array.from({length:14},(_,i)=>{
    const l = (i*7.3+3)%100, d = (i*1.7)%9, dur = 9+(i*2.3)%8, s = 0.6+((i*13)%10)/14;
    return `<span class="petal" style="left:${l}%;animation-delay:-${d}s;animation-duration:${dur}s;transform:scale(${s})"></span>`;
  }).join("");
  const sparks = Array.from({length:10},(_,i)=>{
    const l=(i*11+5)%100, t=(i*17+8)%90, d=(i*0.9)%4;
    return `<span class="spark" style="left:${l}%;top:${t}%;animation-delay:${d}s"></span>`;
  }).join("");
  document.getElementById("app").innerHTML = `
  <div id="landing">${petals}${sparks}
    <div class="land-inner">
      <div style="font-size:12px;letter-spacing:.3em;color:#B08894;text-transform:uppercase;margin-bottom:14px">My Big Day</div>

    {id:"guests", t:"How many hearts in the room?", s:"A range is fine — or give me your exact number, superstar.", type:"guests"},

      s:(cSet==="church" && a.homeCountry && a.country && a.homeCountry!==a.country)? "Marrying abroad, darling — so there are two proper routes, and I know both.":"", type:"pick",
      show:()=>a.packId!=="civil",

        {v:"Our own church, back home", l:"Our own church, back home",

        {v:"A church where we're marrying", l:"A church in "+countryOf(a.country)[1],
         d:"Your home parish sends the paperwork ahead through the diocese — it moves at church speed, so start early."},
        {v:"Chapel at the venue", l:"Chapel at the venue", d:"Ask early whether it's consecrated and who may officiate."},
        {v:"Not sure yet", l:"Not sure yet"}
      ] : CEREMONY_OPTS[cSet].map(v=>({v, l:v})), get:()=>a.ceremony, set:v=>a.ceremony=v, skip:true},
    {id:"reception", t:"Do you know where the party's happening?", s:"The reception, darling — the dancing, the dinner, the lot.", type:"reception", skip:true},
    {id:"events", t:"Which celebrations are we throwing?", s:"I've ticked the classics — switch off anything that isn't you two.", type:"events"},

      opts:PRIORITIES, get:()=>a.priorities||[], max:3, set:v=>a.priorities=v, skip:true},
    {id:"style", t:"Give me the vibe.", s:"One word each way — which wedding are we throwing?", type:"pick", opts:STYLES.map(v=>({v,l:v,d:STYLE_DESCS[v]})), get:()=>a.style, set:v=>a.style=v, skip:true},
    {id:"partner", t:"Planning as a duo?", s:"Invite "+ (a.n2? esc(a.n2):"your partner") +" so you're both looking at the same fabulous plan.", type:"partner"}
  ];
  return steps.filter(st=>!st.show || st.show());
}

        (a.leanLast && (a.receptionLeans||[]).includes(a.leanLast) && LEAN_DESCS[a.leanLast] ? `<div class="small" style="margin-top:10px;background:#FDF1F5;border-radius:12px;padding:10px 13px">${LEAN_DESCS[a.leanLast]}</div>` : "") : "");

    const row = e=>`

}
function obAdvance(id){
  const a = S.ans;
  if(id==="names"){ a.n1 = document.getElementById("n1").value.trim(); a.n2 = document.getElementById("n2").value.trim(); }
  if(id==="guests"){ a.guests = a.guestsExact? parseInt(a.guestsExact,10) : guestRanges()[a.guestRange].mid; }
  if(id==="budget"){
    const br = budgetRanges();
    const v = a.budgetExact? parseInt(a.budgetExact,10) : (a.budgetRange!=null? br.ranges[a.budgetRange].mid : 0);
    if(v>0){ S.budgetTotal = v; S.budgetEstimated = false; } S.cur = br.cur;
  }
  if(id==="reception"){
    const leans = (a.receptionLeans||[]).map(v=> v==="Other"? (a.receptionLeanOther||"").trim() : v).filter(Boolean);
    a.reception = a.receptionMode==="known"? (a.receptionOther||"Venue booked") : a.receptionMode==="help"? ("Help me choose"+(leans.length? " · leaning "+leans.join(" + ") : "")) : "";
    a.venueDIY = a.receptionMode==="help" && (a.receptionLeans||[]).some(v=>DIY_LEANS.has(v)); }
  if(id==="country"){ S.cur = countryOf(a.country||"GB")[2]; }
  obNext();
}
function obNext(){ obIx++; save(); renderOB(); }
function obBack(){ if(obIx>0){ obIx--; renderOB(); } }
function obPick(stepId, v){
  const st = obSteps().find(s=>s.id===stepId);
  st.set(v); save(); renderOB();
}
function obMix(k, v){ if(!v) return; S.ans[k]=v; if(k==="packId" && S.ans.packId2===v) S.ans.packId2=null; save(); renderOB(); }
function obCountry(stepId, v){ const st = obSteps().find(s=>s.id===stepId); st.set(v); save(); }
function obGuestRange(ix){ S.ans.guestRange = ix; S.ans.guestsExact = null; save(); renderOB(); }
function obGuestExact(v){ S.ans.guestsExact = v; S.ans.guestRange = null; save(); manualSync(v); }
function obBudgetRange(ix){ S.ans.budgetRange = ix; S.ans.budgetExact = null; S.ans.budgetMode = null; save(); renderOB(); }
function obBudgetExact(v){ S.ans.budgetExact = v; S.ans.budgetRange = null; S.ans.budgetMode = null; save(); manualSync(true); }
function obBudgetEstimate(){ S.ans.budgetMode = "estimate"; S.ans.budgetRange = null; S.ans.budgetExact = null; save(); renderOB(); }
function manualSync(v){ /* update button state without re-render (keeps keyboard focus) */
  document.querySelectorAll("#ob .opt.on").forEach(el=>el.classList.remove("on"));
  const b = document.querySelector("#ob .foot .btn"); if(b) b.disabled = !v;
}
function obReception(v){ S.ans.receptionMode = v; save(); renderOB();
  if(v==="known"){ setTimeout(()=>{ const el=document.getElementById("rother"); el&&el.focus(); },50); } }
function obReceptionLean(v){
  const a = S.ans; a.receptionLeans = a.receptionLeans || (a.receptionLean? [a.receptionLean] : []);
  const ix = a.receptionLeans.indexOf(v);
  if(ix>=0){ a.receptionLeans.splice(ix,1); if(a.leanLast===v) a.leanLast=null; }
  else { a.receptionLeans.push(v); a.leanLast=v; }
  save(); renderOB(); }
function obEvent(id){ const a=S.ans; const on = new Set(a.eventsOn||[]); on.has(id)?on.delete(id):on.add(id); a.eventsOn=[...on]; save(); renderOB(); }
function obEvent2(id){ const a=S.ans; const on = new Set(a.events2On||[]); on.has(id)?on.delete(id):on.add(id); a.events2On=[...on]; save(); renderOB(); }
function obMulti(stepId, o){
  const st = obSteps().find(s=>s.id===stepId); const cur = [...st.get()];
  const ix = cur.indexOf(o); if(ix>=0) cur.splice(ix,1); else if(cur.length < (st.max||99)) cur.push(o);
  st.set(cur); save(); renderOB();
}
function finishOB(){
  if(!S.ans.packId){ obIx = 1; renderOB(); return; }
  if(S.ans.packId==="civil" && !S.ans.ceremony) S.ans.ceremony = S.ans.variant || "Civil ceremony";
  if(S.ans.budgetMode==="estimate" && !S.budgetTotal){
    S.budgetTotal = estimateBudget(); S.budgetEstimated = true;
    S.cur = countryOf(S.ans.country||"GB")[2];
  }
  buildPlan();
  seedCeremony();
  S.onboarded = true; save();
  renderReveal();
}

      return `<div style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin:4px 0 14px;text-align:left">
        <div style="font-family:'Nothing',cursive;color:var(--rose);font-size:17px">${S.budgetEstimated? "built just for you…":"your plan at a glance…"}</div>
        <div style="font-family:'Gloock',serif;font-size:19px;margin-bottom:8px">${esc(pkgName)}</div>
        ${top.map(([s,v])=>`<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0"><span>${esc(s)}</span><b>${fmt(v)}</b></div>`).join("")}
        <div style="display:flex;justify-content:space-between;font-size:14px;padding:8px 0 0;border-top:1.5px solid var(--line);margin-top:6px"><span><b>${fmt(S.budgetTotal)}</b> all in${g? ` · ${fmt(Math.round(S.budgetTotal/g))} a head`:""}</span>${S.budgetEstimated? `<span class="badge b-amber">sample</span>`:""}</div>
        ${S.budgetEstimated? `<div class="small" style="margin-top:8px">You said you didn't know — so I built this from your ${g? g+" guests, ":""}your tradition and ${esc(countryOf(S.ans.country||"GB")[1])} pricing. React to it, don't obey it.</div>`:""}
      </div>`; })() : ""}
    <p style="font-size:14.5px;color:var(--muted);margin-bottom:26px">Look what we've made already — your traditions, your country, your numbers. Every figure is a starting point, and now we make it magnificent.</p>
    <button class="btn glam" onclick="S.tab='home';save();render()">Show me my wedding</button>
    </div>
  </div></div>`;
}
</script>
<script>/* ---------- main app (v20 feel) ---------- */
const SEC_META = {
 "Ceremony":       ["🕊️","#F6ECF1","#8E5A74"],
 "Reception":      ["🥂","#FBE9EC","#9C5A6C"],
 "Attire":         ["👗","#F4ECFA","#7A5580"],
 "Flowers & Styling":["🌸","#FDF1E3","#A66A3C"],
 "Photos & Film":  ["📸","#E9F1F8","#4F7590"],
 "Music & Entertainment":["🎶","#EFEAF8","#6E5A90"],
 "Stationery":     ["💌","#FBF1D8","#8F7431"],
 "Transport":      ["🚗","#E8F1EC","#5A7F66"],
 "Rings & Gifts":  ["💍","#FAEAE4","#A45A44"],
 "Beauty":         ["💄","#FDECEF","#B4485A"],
 "Extras":         ["✨","#EFF6F7","#3F6E78"],
 "Our Own Additions":["🌟","#EAF5F6","#3F6E78"]
};
const MINE = "Our Own Additions";
function secMeta(s){ return SEC_META[s]||["✨","#F3EEEA","#6E5A64"]; }
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }

function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove("show"), 2200);
}

const ORD = ["","first","second","third","fourth","fifth","sixth","seventh","eighth","ninth","tenth","eleventh","twelfth","thirteenth","fourteenth","fifteenth","sixteenth","seventeenth","eighteenth","nineteenth","twentieth","twenty-first","twenty-second","twenty-third","twenty-fourth","twenty-fifth","twenty-sixth","twenty-seventh","twenty-eighth","twenty-ninth","thirtieth","thirty-first"];
const TENW = {0:"",1:"one",2:"two",3:"three",4:"four",5:"five",6:"six",7:"seven",8:"eight",9:"nine",10:"ten",11:"eleven",12:"twelve",13:"thirteen",14:"fourteen",15:"fifteen",16:"sixteen",17:"seventeen",18:"eighteen",19:"nineteen",20:"twenty",30:"thirty",40:"forty",50:"fifty",60:"sixty",70:"seventy",80:"eighty",90:"ninety"};
function tensWords(n){ if(TENW[n]!=null) return TENW[n]; const t=Math.floor(n/10)*10; return TENW[t]+"-"+TENW[n-t]; }
function dateInWords(){
  if(!S.ans.dateISO) return "";
  const d = new Date(S.ans.dateISO);
  const wd = d.toLocaleDateString("en-GB",{weekday:"long"});
  const mo = d.toLocaleDateString("en-GB",{month:"long"});
  const y = d.getFullYear();
  const yw = y>=2000&&y<2100? "two thousand"+(y%100? " and "+tensWords(y%100):"") : String(y);
  return `${wd}, the ${ORD[d.getDate()]} of ${mo}, ${yw}`;
}
function planned(){ return S.plan.items.filter(i=>i.on).reduce((s,i)=>s+(i.agreed??i.alloc??0),0); }

function render(){
  if(!S.onboarded){ renderOB(); return; }
  if(!S.plan) buildPlan();
  const t = S.tab;
  const nm = [S.ans.n1,S.ans.n2].filter(Boolean).join(" & ") || "Our wedding";
  const days = S.ans.dateISO ? Math.ceil((new Date(S.ans.dateISO) - new Date())/86400000) : null;
  const header = t==="home" ? "" : `<header class="app">
        <div class="names">${esc(nm)}</div>
        <div class="sub">${esc(dispName())}${pack2()? " + "+esc(pack2().shortName):""}${days!=null? " · "+(days>0? days+" days to go" : days===0? "It's today!" : "Married!") : ""}${S.unlocked?"":" · Free plan"}</div>
      </header>`;
  document.getElementById("app").innerHTML = `
    <div id="phone">
      ${header}
      <main id="main">${VIEWS[t]? VIEWS[t]() : VIEWS.home()}</main>
      ${t==="budget"? savebar() : ""}
      <nav id="tabbar">
        ${[["home","🏠","Home"],["budget","💷","Budget"],["guests","👥","Guests"],["list","✓","List"],["album","📸","Album"],["more","⋯","More"]].map(([k,i,l])=>
          `<button class="${t===k?"on":""}" style="position:relative" onclick="S.tab='${k}';save();render()"><span class="ico">${i}</span>${l}${k==="album"?'<span class="tabdot"></span>':''}</button>`).join("")}
      </nav>
    </div><div id="sheets"></div>`;
}

const VIEWS = {};

/* ----- HOME ----- */
VIEWS.home = function(){
  const pl = S.plan;
  const plan = planned();
  const paid = pl.items.filter(i=>i.on).reduce((s,i)=>s+(i.paid||0),0);
  const g = guestCount();
  const over = S.budgetTotal? plan - S.budgetTotal : 0;
  const nextTasks = pl.timeline.filter(t=>!t.done).slice(0,3);
  const dues = upcomingPayments().slice(0,3);
  const warns = pack().gotchas.slice(0,2);
  const whereBits = [S.ans.receptionMode==="known"? S.ans.receptionOther : "", S.ans.country? countryOf(S.ans.country)[1] : "", g? g+" of your favourite people":""].filter(Boolean);
  const dw = dateInWords();
  return `
  <div class="hero">
    <div class="eyebrow">Our Wedding</div>
    <div class="couple">${esc(S.ans.n1||"You")}<span class="amp">&</span>${esc(S.ans.n2||"Your love")}</div>
    ${dw? `<div class="when">${esc(dw)}</div>`:""}
    <div class="flourish"></div>
    ${whereBits.length? `<div class="where">${whereBits.map(esc).join(" &nbsp;·&nbsp; ")}</div>`:""}
  </div>
  <div class="statgrid">
    <div class="sc" style="border-top-color:#9BC0A6" onclick="askBudget()">
      <div class="em">💫</div><div class="lb">${S.budgetEstimated?"Sample budget":"Our budget"}</div>
      <div class="val" style="color:#5A7F66">${S.budgetTotal? fmt(S.budgetTotal):"Set it"}</div>
      ${S.budgetEstimated? `<div class="sub2">tap to make it yours</div>`:""}
    </div>
    <div class="sc" style="border-top-color:#DE9AAB">
      <div class="em">🌷</div><div class="lb">Planning to spend</div>
      <div class="val" style="color:#9C5A6C">${fmt(plan)}</div>
    </div>
    <div class="sc" style="border-top-color:${over>0?"#E0B368":"#9BC0A6"}">
      <div class="em">${over>0?"🎀":"🌿"}</div><div class="lb">${!S.budgetTotal? "Paid so far" : over>0? "A little over":"Room to play"}</div>
      <div class="val" style="color:${over>0?"#A66A3C":"#5A7F66"}">${!S.budgetTotal? fmt(paid) : fmt(Math.abs(over))}</div>
    </div>
    <div class="sc" style="border-top-color:#B4A0D4">
      <div class="em">🥂</div><div class="lb">Each guest</div>
      <div class="val" style="color:#6E5A90">${g? fmt(Math.round(plan/g)):"—"}</div>
      ${g? `<div class="sub2">${g} people</div>`:""}
    </div>
  </div>
  ${S.budgetTotal? (()=>{ const max = Math.max(plan, S.budgetTotal)*1.06;
    return `<div class="card"><h2 style="font-size:19px">How we're doing</h2>
    <div class="small" style="margin-top:2px">The soft line is your budget. Everything moves as the numbers move.</div>
    <div class="gbar"><span class="mark" style="left:${Math.min(98,Math.round(S.budgetTotal/max*100))}%"></span></div>
    <div class="gbar-labs"><span>${fmt(plan)} planned</span><span>${fmt(S.budgetTotal)} budget</span></div></div>`; })() : ""}
  ${plan>0? donutCard() : ""}
  ${dues.length? `<div class="card"><h3>Payments coming up</h3>${dues.map(d=>`<div class="row"><span style="font-size:13.5px">${esc(d.name)}<div class="small">${esc(d.label)} · due ${esc(d.due)}</div></span><span class="money">${fmt(d.amt)}</span></div>`).join("")}</div>`:""}
  <div class="card"><h3>Next up</h3>
    ${nextTasks.length? nextTasks.map(t=>`<div class="task ${t.done?"done":""}" onclick="tickTask('${t.id}')"><div class="tick">${t.done?"✓":""}</div><div><div class="tx">${esc(t.task)}</div><div class="meta">${esc(t.when)}${t.critical? " · critical":""}</div></div></div>`).join("") : `<div class="small">All caught up, superstar.</div>`}
    <button style="color:var(--rose);font-weight:600;margin-top:8px" onclick="S.tab='list';save();render()">Full checklist ›</button></div>
  ${warns.map(w=>`<div class="warn"><b>Worth knowing:</b> ${esc(w)}</div>`).join("")}
  <div class="card" style="background:linear-gradient(140deg,#FDF4F6,#fff)"><h3>📸 Wedding-day photo album</h3>
    <div class="small" style="margin:4px 0 10px">Guests scan a QR code and every photo lands in your album — then the best become a printed book.</div>
    <button class="btn sec" onclick="openPhotos()">Open the album tab</button></div>`;
};
function donutCard(){
  const bySec = {};
  S.plan.items.filter(i=>i.on).forEach(i=>{ bySec[i.section]=(bySec[i.section]||0)+(i.agreed??i.alloc??0); });
  const data = Object.entries(bySec).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const total = data.reduce((s,[,v])=>s+v,0); if(!total) return "";
  const R=62, C=2*Math.PI*R; let off=0;
  const segs = data.map(([sec,v])=>{ const dash=v/total*C;
    const el=`<circle r="${R}" cx="90" cy="90" fill="none" stroke="${secMeta(sec)[2]}" stroke-opacity=".55" stroke-width="34" stroke-dasharray="${dash.toFixed(2)} ${(C-dash).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 90 90)"/>`;
    off+=dash; return el; }).join("");
  return `<div class="card"><h2 style="font-size:19px">Where it's all going</h2>
  <div class="small" style="margin:2px 0 6px">${data.length} pieces make the whole day. Tap any to jump straight to it.</div>
  <div class="donutwrap">
    <svg viewBox="0 0 180 180" style="width:210px">${segs}
      <text x="90" y="87" text-anchor="middle" style="font-size:19px;font-weight:700;fill:#33262B">${fmt(total)}</text>
      <text x="90" y="105" text-anchor="middle" style="font-size:8.5px;letter-spacing:.2em;fill:#84717A">IN TOTAL</text></svg>
    <div class="dlegend">${data.map(([sec,v])=>`<div class="dl" onclick="jumpSec('${esc(sec)}')"><span class="dot" style="background:${secMeta(sec)[2]};opacity:.6"></span><span>${esc(sec)}</span><span class="amt" style="color:${secMeta(sec)[2]}">${fmt(v)}</span><span class="pc">${Math.round(v/total*100)}%</span></div>`).join("")}</div>
  </div></div>`;
}
function jumpSec(sec){ S.tab="budget"; save(); render();
  setTimeout(()=>{ const el=document.getElementById("sec-"+sec.replace(/[^a-z]+/gi,"-")); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); },80); }

function upcomingPayments(){
  const out = [];
  S.plan.items.forEach(i=>{
    if(!i.on) return;
    if(i.dep && i.dep.amt && !i.dep.paid) out.push({name:i.name, label:"deposit", amt:i.dep.amt, due:i.dep.due||"no date", dueISO:i.dep.due||"9999"});
    if(i.agreed && i.balDue && (i.paid||0) < i.agreed) out.push({name:i.name, label:"balance", amt:i.agreed-(i.paid||0), due:i.balDue, dueISO:i.balDue});
  });
  return out.sort((a,b)=> a.dueISO<b.dueISO? -1:1);
}
function askBudget(){
  const v = prompt("Total budget ("+(CURSYM[S.cur]||"£")+"):", S.budgetTotal||"");
  if(v===null) return; const n = parseInt(String(v).replace(/[^\d]/g,""),10);
  if(n>0){ S.budgetTotal = n; S.budgetEstimated = false; reallocate(); render(); toast("Budget set — "+fmt(n)); }
}
function tickTask(id){ const t = S.plan.timeline.find(x=>x.id===id); if(t){ t.done=!t.done; save(); render(); } }

/* ----- BUDGET ----- */
function savebar(){
  const plan = planned();
  const over = S.budgetTotal? plan - S.budgetTotal : 0;
  return `<div class="savebar">
    <div><div class="tot">${fmt(plan)}</div>
      <div class="ovr" style="color:${over>0?"#A66A3C":"#5A7F66"}">${S.budgetTotal? (over>0? fmt(over)+" over budget" : fmt(-over)+" under budget") : "no budget set yet"}</div></div>
    <button class="fabplus" onclick="openAddSheet()">+</button>
    <button class="send" onclick="openExport()">${S.unlocked?"":"🔒 "}Share</button>
  </div>`;
}
VIEWS.budget = function(){
  const pl = S.plan, secs = {};
  pl.items.forEach(i=>{ (secs[i.section] = secs[i.section]||[]).push(i); });
  return `
  <div style="padding:20px 22px 4px">
    <h2 style="font-size:23px">Every lovely thing</h2>
    <div class="small" style="margin-top:4px">Tap any number and type. Tap the circle to take something out — tap again to put it back.${S.budgetEstimated? " These figures are your sample — react to them, don't obey them.":""}</div>
  </div>
  ${Object.entries(secs).map(([sec,items])=>{
    const [em,tint,deep] = secMeta(sec);
    const sOn = items.filter(i=>i.on);
    const sTot = sOn.reduce((s,i)=>s+(i.agreed??i.alloc??0),0);
    return `<div class="secpanel" id="sec-${sec.replace(/[^a-z]+/gi,"-")}" style="background:${tint}">
      <div class="shead"><span class="em">${em}</span><span class="nm">${esc(sec)}</span><span class="tot" style="color:${deep}">${fmt(sTot)}</span></div>
      ${items.map(i=>v20item(i,deep)).join("")}
    </div>`;
  }).join("")}
  <div style="height:70px"></div>`;
};
function v20item(i,deep){
  const dep = i.dep||{};
  const cat = i.supplierCategory||"";
  return `<div class="v20item" id="ir-${i.id}">
    <button class="tickc ${i.on?"":"off"}" onclick="toggleItem('${i.id}')">✓</button>
    <div class="bd">
      <div class="nm">${esc(i.name)}${i.custom?` <button style="color:var(--red);font-size:12px" onclick="deleteCustom('${i.id}')">remove</button>`:""}</div>
      ${i.note?`<div class="ds">${esc(i.note)}</div>`:""}
      ${i.on? `
      <div class="sup">${cat? esc(cat):""}${i.religious?`<span class="pill">tradition</span>`:""}<button class="qpill" onclick="openQuotes('${i.id}')">${(i.quotes||[]).length? (i.quotes.length===1?"1 quote":i.quotes.length+" quotes")+((i.docs||[]).length?" · 📎"+(i.docs.length):"")+" ›" : "+ quote"}</button>${cat? `<button class="lockpill" onclick="findMe('${esc(cat)}')">${S.unlocked?"":"🔒 "}find me ${esc(article(cat))} ›</button>`:""}</div>
      <div class="costwrap"><span class="curs">${CURSYM[S.cur]||"£"}</span>
        <input type="number" inputmode="numeric" value="${i.agreed??""}" placeholder="${i.alloc||"0"}" onchange="setItem('${i.id}','agreed',this.value)">
        ${i.alloc && i.agreed!=null && i.agreed!==i.alloc? `<span class="was">suggested ${fmt(i.alloc)}</span>` : i.alloc? `<span class="was">suggested</span>`:""}
      </div>
      <div class="minifields">
        <label>Paid so far<input type="number" inputmode="numeric" value="${i.paid||""}" onchange="setItem('${i.id}','paid',this.value)"></label>
        ${S.unlocked? `<label>Deposit<input type="number" inputmode="numeric" value="${dep.amt||""}" onchange="setDep('${i.id}','amt',this.value)"></label>
        <label>Deposit due<input type="date" value="${dep.due||""}" onchange="setDep('${i.id}','due',this.value)"></label>`:""}
      </div>
      ${S.unlocked? `<div class="minifields"><label>Balance due<input type="date" value="${i.balDue||""}" onchange="setItem('${i.id}','balDue',this.value)"></label>
        ${dep.amt? `<label style="display:flex;align-items:flex-end"><button class="chip ${dep.paid?"on":""}" style="margin:0" onclick="setDepPaid('${i.id}')">${dep.paid?"✓ Deposit paid":"Deposit paid?"}</button></label>`:"<label></label>"}</div>`
      : `<button class="lockline" onclick="openPaywall('Deposits, due dates & payment reminders')">🔒 Deposits, due dates & payment reminders — with the unlock</button>`}
      `:""}
    </div>
  </div>`;
}
function article(cat){ const c = cat.toLowerCase(); return (/^[aeiou]/.test(c)? "an ":"a ")+c; }
function toggleItem(id){ const i = S.plan.items.find(x=>x.id===id); i.on=!i.on; reallocate(); render();
  toast(i.on? "Back in — "+i.name : "Taken out — "+i.name); }
function setItem(id,k,v){ const i = S.plan.items.find(x=>x.id===id);
  i[k] = (k==="balDue")? v : (v===""? null : Math.max(0,parseInt(v,10)||0)); save(); render(); }
function setDep(id,k,v){ const i = S.plan.items.find(x=>x.id===id); i.dep = i.dep||{};
  i.dep[k] = (k==="due")? v : (v===""? null : Math.max(0,parseInt(v,10)||0)); save(); render(); }
function setDepPaid(id){ const i = S.plan.items.find(x=>x.id===id); i.dep.paid=!i.dep.paid;
  if(i.dep.paid) i.paid = (i.paid||0) + (i.dep.amt||0); save(); render(); }
function deleteCustom(id){ const i = S.plan.items.find(x=>x.id===id); if(!i||!i.custom) return;
  S.plan.items = S.plan.items.filter(x=>x.id!==id); save(); render(); toast("Removed — "+i.name); }

/* ----- ADD SHEET (v20 style) ----- */
let addType = "buy";
function openAddSheet(){
  addType = "buy";
  renderAddSheet();
}
function renderAddSheet(){
  const secs = Object.keys(SEC_META).filter(s=>s!==MINE);
  sheet(`<div class="addsheet">
    <h2>Add something of your own</h2>
    <div class="small" style="margin-top:4px">Something to pay for, or something we need to chase.</div>
    <div class="seg">
      <button class="${addType==="buy"?"on":""}" onclick="setAddType('buy')">🛍️ Something to buy</button>
      <button class="${addType==="do"?"on":""}" onclick="setAddType('do')">📋 Something to do</button>
    </div>
    ${addType==="buy"? `
    <div class="flab">What is it?</div>
    <input id="adName" placeholder="Sparklers for the send-off">
    <div class="flab">How much, roughly?</div>
    <input id="adCost" type="number" inputmode="numeric" placeholder="250">
    <div class="flab">Who's it with? (optional)</div>
    <input id="adWho" placeholder="Still looking">
    <div class="flab">Which part of the day?</div>
    <select id="adGrp">${secs.map(s=>`<option>${s}</option>`).join("")}<option value="${MINE}" selected>Somewhere else</option></select>
    ` : `
    <div class="flab">What needs doing?</div>
    <input id="tdName" placeholder="Ask the florist about arch flowers">
    <div class="flab">Whose court is it in?</div>
    <select id="tdWho"><option>Us</option><option>Venue</option><option>Suppliers</option><option>Family</option><option>${esc(cap(term("officiant")))}</option></select>
    <div class="flab">Any notes? (optional)</div>
    <input id="tdDesc" placeholder="">
    `}
    <div class="addrow">
      <button class="btn sec" onclick="closeSheet()">Not now</button>
      <button class="btn go" onclick="doAdd()">Add it</button>
    </div>
  </div>`);
  setTimeout(()=>{ const el = document.getElementById(addType==="buy"?"adName":"tdName"); el&&el.focus(); },200);
}
function setAddType(t){ addType = t; renderAddSheet(); }
function doAdd(){
  if(addType==="do"){
    const nm = (document.getElementById("tdName").value||"").trim();
    if(!nm){ toast("Give it a name first"); return; }
    S.customTodos = S.customTodos||[];
    if(S.customTodos.some(c=>c.name===nm)){ toast("That's already on the list"); return; }
    S.customTodos.push({id:uid(), name:nm, desc:(document.getElementById("tdDesc").value||"").trim(),
      who:(document.getElementById("tdWho")||{}).value||"Us", done:false});
    closeSheet(); save(); toast("Added to the list");
    S.tab="list"; render();
    return;
  }
  const customCount = S.plan.items.filter(i=>i.custom).length;
  if(!S.unlocked && customCount >= FREE_CUSTOM_CAP){ closeSheet(); openPaywall("Unlimited custom items"); return; }
  const nm = (document.getElementById("adName").value||"").trim();
  if(!nm){ toast("Give it a name first"); return; }
  if(S.plan.items.some(i=>i.name.toLowerCase()===nm.toLowerCase())){ toast("There's already one called that"); return; }
  const cost = Math.max(0, parseInt(document.getElementById("adCost").value,10)||0);
  const who = (document.getElementById("adWho").value||"").trim();
  const grp = document.getElementById("adGrp").value;
  S.plan.items.push({id:"c"+uid(), name:nm, section:grp, event:"", note: who? "With "+who+".":"", essential:false,
    unit:"fixed", supplierCategory:"", religious:false, share:0, on:true, custom:true,
    agreed: cost||null, paid:0, dep:null, alloc:0});
  closeSheet(); save(); render(); toast("Added — "+nm);
  setTimeout(()=>jumpSecStay(grp), 150);
}
function jumpSecStay(sec){ const el=document.getElementById("sec-"+sec.replace(/[^a-z]+/gi,"-")); el&&el.scrollIntoView({behavior:"smooth",block:"start"}); }

/* ----- GUESTS ----- */
VIEWS.guests = function(){
  const g = S.guests;
  const yes = g.filter(x=>x.rsvp==="yes"), no = g.filter(x=>x.rsvp==="no");
  const heads = g.reduce((n,x)=> n + (x.rsvp!=="no"? 1+(x.plus||0):0), 0);
  const diet = {}; g.forEach(x=>{ if(x.diet && x.rsvp!=="no") diet[x.diet]=(diet[x.diet]||0)+1+(x.plus||0); });
  return `
  <div class="stat3" style="margin-top:14px">
    <div class="card"><b>${heads}</b><span>expected heads</span></div>
    <div class="card"><b>${yes.length}</b><span>said yes</span></div>
    <div class="card"><b>${g.length-yes.length-no.length}</b><span>awaiting</span></div>
  </div>
  ${Object.keys(diet).length? `<div class="card"><h3>Dietary for the caterer</h3><div style="margin-top:6px">${Object.entries(diet).map(([k,v])=>`<span class="chip">${esc(k)} × ${v}</span>`).join("")}</div></div>`:""}
  <div class="card">
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="btn sec" style="padding:10px" onclick="addGuest()">+ Add guest</button>
      <button class="btn sec" style="padding:10px" onclick="openImport()">Paste a list</button>
    </div>
    <div class="small">Import from your phone contacts arrives with the app-store version.</div>
  </div>
  <div class="card">${g.length? g.map(x=>`
    <div class="grow">
      <span><span class="gname">${esc(x.name)}</span>${x.plus?` <span class="small">+${x.plus}</span>`:""}
        <div class="gmeta">${esc(x.side===1?(S.ans.n1||"Side A"):x.side===2?(S.ans.n2||"Side B"):"Shared")}${x.diet? " · "+esc(x.diet):""}</div></span>
      <span style="display:flex;gap:6px;align-items:center">
        <button class="rsvp ${x.rsvp}" onclick="cycleRSVP('${x.id}')">${x.rsvp==="yes"?"Yes":x.rsvp==="no"?"No":"?"}</button>
        <button class="small" onclick="editGuest('${x.id}')">edit</button></span>
    </div>`).join("") : `<div class="empty">No guests yet, darling. Add them one by one, or paste your whole list at once.</div>`}</div>`;
};
function addGuest(){
  const name = prompt("Guest name:"); if(!name) return;
  S.guests.push({id:uid(), name:name.trim(), side:0, rsvp:"pending", diet:"", plus:0});
  save(); render(); toast("Added — "+name.trim());
}
function editGuest(id){
  const x = S.guests.find(g=>g.id===id); if(!x) return;
  const diet = prompt("Dietary needs for "+x.name+" (blank for none):", x.diet||""); if(diet===null) return;
  const plus = prompt("Plus-ones with "+x.name+"? (0-5):", x.plus||0);
  const side = prompt("Whose side? 1 = "+(S.ans.n1||"partner 1")+", 2 = "+(S.ans.n2||"partner 2")+", 0 = shared:", x.side);
  x.diet = diet.trim(); x.plus = Math.min(5,Math.max(0,parseInt(plus,10)||0)); x.side = [0,1,2].includes(parseInt(side,10))? parseInt(side,10):0;
  save(); render();
}
function cycleRSVP(id){ const x = S.guests.find(g=>g.id===id);
  x.rsvp = x.rsvp==="pending"?"yes":x.rsvp==="yes"?"no":"pending"; save(); render(); }
function openImport(){
  sheet(`<div class="addsheet"><h2>Paste your guest list</h2>
  <p class="small" style="margin:6px 0 10px">One guest per line. Add a comma and any dietary need — e.g. <i>Maria Georgiou, vegetarian</i></p>
  <textarea id="imp" rows="8" placeholder="Andreas Nicola&#10;Maria Georgiou, vegetarian&#10;..."></textarea>
  <div class="addrow"><button class="btn sec" onclick="closeSheet()">Cancel</button>
  <button class="btn go" onclick="doImport()">Add guests</button></div></div>`);
}
function doImport(){
  const raw = document.getElementById("imp").value;
  let n=0;
  raw.split(/\n/).forEach(line=>{
    const [name, diet] = line.split(",").map(s=>s&&s.trim());
    if(name){ S.guests.push({id:uid(), name, side:0, rsvp:"pending", diet:diet||"", plus:0}); n++; }
  });
  closeSheet(); save(); render(); if(n) toast(n+" guests added");
}

  const total = tl.length + pw.length + ct.length;

  <div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between"><h3>Progress</h3><span class="small">${done} of ${total}</span></div>
    <div class="bar"><i style="width:${Math.round(done/total*100)||0}%"></i></div></div>

    ${[["all","Everything"],["tasks","Tasks"],["paper","Paperwork"]].map(([k,l])=>`<button class="chip ${f===k?"on":""}" onclick="S.listFilter='${k}';save();render()">${l}</button>`).join("")}

      <div><div class="tx">${esc(c.name)}</div><div class="meta">${esc(c.who||"Us")}${c.desc?" · "+esc(c.desc):""}</div></div></div>`).join("")}</div>`:""}

    <div class="sect"><h3>${esc(when)}</h3><span class="small">${ts.filter(t=>t.done).length}/${ts.length}</span></div>

      <div><div class="tx">${esc(t.task)}</div>${t.critical?`<div class="meta">critical</div>`:""}</div></div>`).join("")}</div>`).join("") : ""}

function tickCustom(id){ const c = (S.customTodos||[]).find(x=>x.id===id); if(c){ c.done=!c.done; save(); render(); } }

  </div>

  <div class="card">
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
      ${S.photos.map((p,ix)=>`<img src="${p}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px" onclick="if(confirm('Remove this photo?')){S.photos.splice(${ix},1);save();render();}">`).join("")}
      <label style="display:flex;align-items:center;justify-content:center;aspect-ratio:1;border:1.5px dashed var(--line);border-radius:8px;font-size:22px;color:var(--muted);cursor:pointer">+<input type="file" accept="image/*" multiple style="display:none" onchange="addPhotos(this.files)"></label>
    </div>
  </div>
  <div class="card" style="background:linear-gradient(140deg,#FDF4F6,#fff)"><h3>📖 Your photo book</h3>
    <div class="small" style="margin:4px 0 10px">After the day, choose your favourites and we lay them out as a printed book, delivered to your door. Coming after launch.</div>
    <button class="btn sec" onclick="toast('On the list — your album will be ready for it.')">Join the waiting list</button></div>`;
};
function addPhotos(files){
  const room = S.unlocked? 99 : FREE_CUSTOM_CAP - S.photos.length;
  if(room<=0){ openPaywall("Unlimited photos"); return; }
  [...files].slice(0,room).forEach(f=>{
    const img = new Image(); const rd = new FileReader();
    rd.onload = e=>{ img.onload = ()=>{
      const c = document.createElement("canvas"); const k = Math.min(1, 480/Math.max(img.width,img.height));
      c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      S.photos.push(c.toDataURL("image/jpeg",0.7)); save(); render();
    }; img.src = e.target.result; };
    rd.readAsDataURL(f);
  });
}
function makeQR(text){
  try{ const q = qrcode(0,"M"); q.addData(text); q.make();
    return q.createSvgTag({cellSize:4, margin:2}); }
  catch(e){ return `<div class="small">[QR: ${esc(text)}]</div>`; }
}

  sheet(`<div class="addsheet">

    <div class="small" style="margin-top:2px">Collect quotes, pick your winner, keep the paperwork — all in one place.</div>

    ${qs.length? qs.map(q=>`<div class="quoterow">
      <div class="bd"><div class="who">${esc(q.who)}</div>${q.note?`<div class="nt">${esc(q.note)}</div>`:""}</div>
      <div style="text-align:right"><div class="amt">${fmt(q.amt)}</div>
        <button class="usebtn ${q.chosen?"on":""}" onclick="useQuote('${i.id}','${q.id}')">${q.chosen?"✓ Using":"Use this"}</button>

    <div class="flab" style="margin-top:14px">Add a quote</div>
    <input id="qWho" placeholder="Who's it from?">
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="qAmt" type="number" inputmode="numeric" placeholder="Amount" style="flex:1">
      <button class="btn go" style="flex:none;width:auto;padding:12px 18px;border-radius:16px;background:#9BC0A6;color:#fff;font-weight:700" onclick="addQuote('${i.id}')">Add</button>
    </div>
    <div class="flab" style="margin-top:16px">Documents${docs.length? " ("+docs.length+")":""}</div>
    ${docs.map(d=>`<div class="docrow">📎 <span style="flex:1">${esc(d.name)}</span>
      ${d.img?`<button style="color:var(--rose);font-weight:600" onclick="viewDoc('${i.id}','${d.id}')">view</button>`:""}
      <button style="color:var(--red)" onclick="delDoc('${i.id}','${d.id}')">✕</button></div>`).join("")}
    <label class="btn sec" style="margin-top:10px;display:block;text-align:center">${S.unlocked? "📷 Scan a quote or invoice" : `🔒 Scan a quote or invoice — with the unlock`}
      ${S.unlocked? `<input type="file" accept="image/*,.pdf" style="display:none" onchange="scanFile('${i.id}', this.files)">`:""}</label>
    ${S.unlocked? "" : `<div class="small center" style="margin-top:6px" onclick="openPaywall('Scan quotes & invoices')">Upload a photo of any quote, invoice or receipt and it files itself into the budget, the payments and the list.</div>`}
    <button class="btn sec" style="margin-top:14px" onclick="closeSheet();render()">Done</button>
  </div>`);
  if(!S.unlocked){ const lab = document.querySelector('.addsheet label.btn');
    lab && lab.addEventListener('click', ()=>openPaywall('Scan quotes & invoices')); }
}
function addQuote(id){
  const i = S.plan.items.find(x=>x.id===id);
  const who = (document.getElementById("qWho").value||"").trim();
  const amt = Math.max(0, parseInt(document.getElementById("qAmt").value,10)||0);
  if(!who && !amt){ toast("Give me a name or a number, darling"); return; }
  i.quotes = i.quotes||[];
  i.quotes.push({id:uid(), who:who||"Unnamed quote", amt, note:"", chosen:false});
  save(); openQuotes(id); toast("Quote in — "+(who||fmt(amt)));
}
function useQuote(id,qid){
  const i = S.plan.items.find(x=>x.id===id);
  (i.quotes||[]).forEach(q=>{ q.chosen = q.id===qid; if(q.chosen){ i.agreed = q.amt; } });
  save(); openQuotes(id); toast("Agreed price set — "+fmt(i.agreed));
}
function delQuote(id,qid){
  const i = S.plan.items.find(x=>x.id===id);
  i.quotes = (i.quotes||[]).filter(q=>q.id!==qid);
  save(); openQuotes(id);
}
function delDoc(id,did){
  const i = S.plan.items.find(x=>x.id===id);
  i.docs = (i.docs||[]).filter(d=>d.id!==did);
  save(); openQuotes(id);
}
function viewDoc(id,did){
  const i = S.plan.items.find(x=>x.id===id);
  const d = (i.docs||[]).find(x=>x.id===did);
  if(!d) return;
  if(d.sample || !d.img){ toast("Sample document — scan your own to replace it"); return; }
  sheet(`<img src="${d.img}" style="width:100%;border-radius:14px"><button class="btn sec" style="margin-top:12px" onclick="openQuotes('${id}')">Back</button>`);
}
let _scanTmp = null;
function scanFile(id, files){
  const f = files && files[0]; if(!f) return;
  const digits = (f.name.match(/\d{2,6}/)||[])[0];
  const finish = async (img)=>{ _scanTmp = {name:f.name, img};
    let ext = null;
    if(img && S.cloud){
      toast("Reading it for you, darling…");
      ext = await aiScan(id, img.split(",")[1], "image/jpeg");
    }
    scanConfirm(id, ext? (ext.amount||"") : (digits? parseInt(digits,10):""), ext); };
  if(/^image\//.test(f.type)){
    const rd = new FileReader(); const im = new Image();
    rd.onload = e=>{ im.onload = ()=>{
      const c = document.createElement("canvas"); const k = Math.min(1, 900/Math.max(im.width,im.height));
      c.width = im.width*k; c.height = im.height*k;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      finish(c.toDataURL("image/jpeg",0.72)); }; im.src = e.target.result; };
    rd.readAsDataURL(f);
  } else finish(null);
}
function scanConfirm(id, guessAmt, ext){
  const i = S.plan.items.find(x=>x.id===id);
  const typeMap = {"quote":"quote","deposit-invoice":"dep","balance-invoice":"bal","receipt":"rec"};
  const selType = ext && typeMap[ext.type] || "quote";
  sheet(`<div class="addsheet">
    <h2 style="font-size:21px">${ext? "Read it — check my work" : "Filed — now tell me what it is"}</h2>
    <div class="small" style="margin-top:2px">${ext? "I've read the document and filled everything in — glance over it and I'll file the numbers where they belong."+(ext.summary? " It looks like: <i>"+esc(ext.summary)+"</i>":"") : "I've kept the document with <b>"+esc(i.name)+"</b>. Confirm the details and I'll put the numbers where they belong."+(S.cloud? "" : " Turn on cloud sync and I'll read documents for you automatically.")}</div>
    <div class="flab" style="margin-top:14px">Who's it from?</div>
    <input id="scWho" placeholder="The supplier" value="${ext&&ext.supplier? esc(ext.supplier):""}">
    <div class="flab">Amount</div>
    <input id="scAmt" type="number" inputmode="numeric" value="${guessAmt||""}" placeholder="0">
    <div class="flab">What is it?</div>
    <select id="scType">${[["quote","A quote"],["dep","Deposit invoice"],["bal","Balance invoice"],["rec","Receipt — already paid"]].map(([v,l])=>`<option value="${v}" ${v===selType?"selected":""}>${l}</option>`).join("")}</select>
    <div class="flab">Due date (if any)</div>
    <input id="scDue" type="date" value="${ext&&ext.dueDate? esc(ext.dueDate):""}">
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px" onclick="this.querySelector('input').checked=!this.querySelector('input').checked;event.stopPropagation()">
      <input type="checkbox" id="scRem" checked style="width:auto" onclick="event.stopPropagation()"><span style="font-size:13.5px">Pop a reminder on the list before it's due</span></div>
    <div class="addrow">
      <button class="btn sec" onclick="openQuotes('${id}')">Cancel</button>
      <button class="btn go" onclick="saveScan('${id}')">File it</button>
    </div>
  </div>`);
}
function saveScan(id){
  const i = S.plan.items.find(x=>x.id===id);
  const who = (document.getElementById("scWho").value||"").trim() || "Supplier";
  const amt = Math.max(0, parseInt(document.getElementById("scAmt").value,10)||0);
  const type = document.getElementById("scType").value;
  const due = document.getElementById("scDue").value;
  const rem = document.getElementById("scRem").checked;
  i.docs = i.docs||[];
  i.docs.push({id:uid(), name:_scanTmp? _scanTmp.name : "document", img:_scanTmp? _scanTmp.img : null});
  if(type==="quote" && amt){ i.quotes = i.quotes||[]; i.quotes.push({id:uid(), who, amt, note:"From a scanned quote", chosen:false}); }
  if(type==="dep"){ i.dep = {amt:amt||null, due:due||null, paid:false}; }
  if(type==="bal"){ if(amt) i.agreed = amt; if(due) i.balDue = due; }
  if(type==="rec" && amt){ i.paid = (i.paid||0) + amt; }
  if(rem && due){ S.customTodos = S.customTodos||[];
    S.customTodos.push({id:uid(), name:"Pay "+who+(amt?" — "+fmt(amt):""), who:"Us", desc:"due "+due+" · "+i.name, done:false}); }
  _scanTmp = null;
  save(); openQuotes(id); toast("Filed — everything's where it belongs");
}
