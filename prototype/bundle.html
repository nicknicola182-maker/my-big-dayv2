rather than posted, by the couple, their parents or the koumbaroi, with a visit and a coffee at each house. In Cypriot villages the whole community counted as invited by "},{id:"krevati",name:"Making the bed (to krevati)",when:"One to seven days before",optional:!0,default:!0,description:"Friends and unmarried female relatives make up the couple's marital bed together, usually three times, while the women sing. Guests then throw rice for roots, koufeta for sweetness and money for prosperity onto the bed, and a baby is rolled"},{id:"resi",name:"Cooking the resi",when:"Two to three days before",optional:!0,default:!1,description:"A Cypriot custom, strongest in the Paphos and Limassol districts. Wheat is pounded with wooden flails, then cooked slowly for hours with lamb or goat to make resi, the dish served to the whole village at the wedding. It is a communal job sp"},{id:"bachelor",name:"Stag and hen celebrations",when:"One to eight weeks before",optional:!0,default:!0,description:"A modern addition rather than a traditional one, and in Greece and Cyprus it is usually a night out rather than a weekend away. It does not replace the older customs of the eve and the dressing, which still happen."},{id:"paramoni",name:"The eve (i paramoni)",when:"The night before",optional:!0,default:!0,description:"Each family hosts at home the night before, with food, wine and live music. In Cyprus this is the first of the three nights of a full traditional wedding and can run until the early hours. In much of the diaspora it has shrunk to a family d"},{id:"stolisma",name:"The dressing (to stolisma / ta allamata)",when:"Wedding morning",optional:!0,default:!0,description:"The bride and groom are dressed at their parents' homes in front of family and friends, with violi and laouto players in the room. The groom is shaved by the koumbaros; the bride is dressed by the koumbara and her friends. In Cyprus, where "},{id:"civil-registration",name:"Civil ceremony or registrar attendance",when:"Same day or shortly before",optional:!0,default:!1,description:"Whether you need this depends entirely on the country. In Greece, Cyprus, the United States, Canada and Australia the priest can register the marriage and no separate ceremony is needed. In England and Wales the church must be a registered "},{id:"ceremony",name:"The Service of Betrothal and the Service of Crowning",when:"Wedding day",optional:!1,default:!0,description:"Two services celebrated back to back, historically separate. The betrothal blesses and exchanges the rings; the crowning places the stefana on your heads, joins your right hands, reads the wedding at Cana, gives you the common cup and leads"},{id:"chairetisma",name:"The congratulations line (to chairetisma)",when:"Straight after the service",optional:!0,default:!0,description:"The couple, their parents and the koumbaroi stand in line and every guest passes to congratulate them. In Cyprus this is a distinct part of the day with its own much larger guest list: people who were not at the church and will not stay for"},{id:"reception",name:"The reception",when:"Wedding evening",optional:!1,default:!0,description:"Dinner, the first dance, the money dance and then Greek dancing until very late. The order is looser than at a Western reception: speeches are short or absent, and the dancing starts early and does not stop. The couple's dance is followed b"},{id:"antigamos",name:"The day after (o antigamos)",when:"The day after",optional:!0,default:!1,description:"A Cypriot custom. The families gather again the next day, often at the couple's or the parents' house, to eat the leftovers, count the money given and thank the people who worked on the wedding. In some villages it is called ta pkiata, afte"}],items:[{id:"church-offering",name:"Church offering",section:"Ceremony",event:"ceremony",note:"The donation to the parish for the use of the church. Most parishes publish a figure and it is usually higher if neither of you is a registered member or steward there. In the United States and the Un",essential:!0,share:.012,supplier:"Church",religious:!0},{id:"priest-offering",name:"Offering to the priest",section:"Ceremony",event:"ceremony",note:"A personal envelope for the celebrant, separate from the parish fee and normally handed over on the day. Allow for the preparation meetings as well as the service. If a priest travels to you, or if yo",essential:!0,share:.006,supplier:"Church",religious:!1},{id:"chanter-choir",name:"Chanter and choir",section:"Ceremony",event:"ceremony",note:"The psaltis chants the service. Some parishes include one in the fee, others charge separately, and a full Byzantine choir is a further cost again. Only chanting and, in some jurisdictions, an organ a",essential:!0,share:.005,supplier:"Church",religious:!0},{id:"church-permissions",name:"Certificates and permission to marry",section:"Ceremony",event:"ceremony",note:"The certificate of freedom to marry or celibacy for each of you, and the licence or permission issued by the Metropolis or Archdiocese. These carry small administrative fees and are charged per person",essential:!0,share:.003,supplier:"Church",religious:!0},{id:"civil-registration",name:"Civil registration and notice fees",section:"Ceremony",event:"ceremony",note:"Notice fees, licence fees and, where a registrar has to attend the church, the registrar's attendance fee. In Greece this covers the municipal marriage licence and the newspaper announcement; in Cypru",essential:!0,share:.004,supplier:"Registrar",religious:!1},{id:"stefana",name:"Stefana (wedding crowns)",section:"Ceremony",event:"ceremony",note:"The two crowns joined by a single white ribbon that is never cut. They are traditionally bought and brought by the koumbaros or koumbara, so agree early who is paying rather than buying two sets. Anyt",essential:!0,share:.008,supplier:"Church supplies",religious:!0},{id:"lambades",name:"Lambades (wedding candles)",section:"Ceremony",event:"ceremony",note:"The pair of tall decorated candles that stand either side of you during the service and are lit at the start of the crowning. Also usually provided by the koumbaroi. Some churches cap the height, so c",essential:!0,share:.004,supplier:"Church supplies",religious:!0},{id:"ceremony-tray",name:"Tray, goblet and wine",section:"Ceremony",event:"ceremony",note:"The dhiskos, the silver tray that carries the rings, the crowns and the koufeta to the altar, plus the goblet and the sweet wine for the common cup. Nama is normal in Greece and the diaspora, koumanda",essential:!0,share:.003,supplier:"Church supplies",religious:!0},{id:"koufeta-rice",name:"Koufeta, rice and petals for the church",section:"Ceremony",event:"ceremony",note:"Sugared almonds for the tray and to hand round after the service, and rice or petals for guests to throw. Check the rules first. Many parishes, especially in the United States and the United Kingdom, ",essential:!0,share:.003,supplier:"Church supplies",religious:!1},{id:"stefanothiki",name:"Stefanothiki (crown case)",section:"Ceremony",event:"ceremony",note:"The glazed case the stefana are kept in afterwards, traditionally hung on the bedroom wall above the bed. Bought after the wedding as often as before it, and sometimes the koumbaroi's gift.",essential:!1,share:.003,supplier:"Church supplies",religious:!1},{id:"church-flowers",name:"Church flowers and aisle decoration",section:"Flowers & Styling",event:"ceremony",note:"Arrangements for the entrance, the aisle and the table where the crowns and the Gospel sit. Orthodox churches are already highly decorated, so most couples do far less here than at a Western church we",essential:!0,share:.025,supplier:"Florist",religious:!1},{id:"venue-hire",name:"Reception venue hire",section:"Reception",event:"reception",note:"Cypriot and Greek weddings need a venue that can take a very large number of people standing for the chairetisma as well as seated for dinner, which rules out most conventional wedding venues. Village",essential:!0,share:.065,supplier:"Venue",religious:!1},{id:"catering",name:"Catering",section:"Reception",event:"reception",note:"The largest single line by a wide margin, and the one most affected by the guest count. Expect meze rather than a plated three-course meal in Greece and Cyprus: souvla, kleftiko, halloumi, koupepia, s",essential:!0,share:.24,supplier:"Caterer",religious:!1},{id:"drinks",name:"Drinks",section:"Reception",event:"reception",note:"Wine, beer, spirits and zivania or tsipouro. Open bar is the expectation at Greek and Cypriot weddings rather than a nice extra. Check corkage carefully: bringing your own wine and spirits is common a",essential:!0,share:.07,supplier:"Caterer",religious:!1},{id:"service-charge",name:"Service charge, corkage and staffing",section:"Reception",event:"reception",note:"Waiting staff, bar staff, corkage and cake-cutting fees. At a wedding of several hundred these add up to a meaningful line of their own and are frequently quoted separately from the per-head price.",essential:!0,share:.012,supplier:"Caterer",religious:!1},{id:"wedding-cake",name:"Wedding cake",section:"Reception",event:"reception",note:"Usually a tiered cake cut late in the evening. Greek and Cypriot receptions also put out trays of sweets alongside it, so the cake itself does not need to feed everyone.",essential:!0,share:.014,supplier:"Cake maker",religious:!1},{id:"traditional-dish",name:"Resi or traditional wedding dish",section:"Reception",event:"reception",note:"Resi in Cyprus, gamopilafo in Crete: a wheat or rice dish cooked in lamb or goat stock and served to everyone. If you want it made the traditional way rather than by the venue, it needs to be commissi",essential:!1,share:.008,supplier:"Caterer",religious:!1},{id:"late-food",name:"Late-night food",section:"Reception",event:"reception",note:"Greek and Cypriot receptions run past two in the morning and a second wave of food, usually souvla or soup, is normal rather than optional.",essential:!1,share:.01,supplier:"Caterer",religious:!1},{id:"reception-styling",name:"Table centrepieces and reception styling",section:"Flowers & Styling",event:"reception",note:"Centrepieces, linen, chair covers and any styling of the room. Because the guest count is high, this is priced per table and scales fast: cutting one flower from each centrepiece across a hundred tabl",essential:!0,share:.03,supplier:"Florist",religious:!1},{id:"bouquets",name:"Bouquets and buttonholes",section:"Flowers & Styling",event:"ceremony",note:"The bride's bouquet, which the groom traditionally hands to her at the church door rather than her carrying it in, plus buttonholes for the groom, the koumbaroi, the fathers and often a corsage for ea",essential:!0,share:.008,supplier:"Florist",religious:!1},{id:"band",name:"Live band",section:"Music & Entertainment",event:"reception",note:"A Greek band with bouzouki is the centre of the evening, not background music. Bands are usually booked for a set number of hours with overtime rates, and Greek and Cypriot receptions almost always ru",essential:!0,share:.055,supplier:"Band",religious:!1},{id:"dj",name:"DJ",section:"Music & Entertainment",event:"reception",note:"Often booked alongside the band rather than instead of it, to cover the breaks and to take the later part of the night.",essential:!1,share:.018,supplier:"DJ",religious:!1},{id:"violarides",name:"Traditional musicians for the dressing",section:"Music & Entertainment",event:"stolisma",note:"The violi and laouto players who come to the house for the stolisma or allamata, sing the traditional wedding songs and call each relative forward in turn. In Cyprus these are the violarides and the c",essential:!1,share:.01,supplier:"Band",religious:!1},{id:"dance-troupe",name:"Traditional dance troupe",section:"Music & Entertainment",event:"reception",note:"A folk dance group to open the dancing, common at larger Cypriot and Cretan weddings and at diaspora weddings where guests may not know the steps.",essential:!1,share:.006,supplier:"Entertainment",religious:!1},{id:"plates-flowers",name:"Flowers and plates for throwing",section:"Music & Entertainment",event:"reception",note:"Trays of flowers for guests to throw over the dancers, and plaster plates if your venue permits smashing. Many venues in Greece and Cyprus now allow flowers only. Check before you buy, and buy plaster",essential:!1,share:.004,supplier:"Entertainment",religious:!1},{id:"av-lighting",name:"Lighting, sound and staging",section:"Music & Entertainment",event:"reception",note:"Uplighting, a dance floor and a PA that can cover a very large room. Often bundled with the band or the venue, but worth pricing separately at scale.",essential:!1,share:.018,supplier:"AV hire",religious:!1},{id:"photographer",name:"Photographer",section:"Photos & Film",event:"",note:"Most Greek and Cypriot couples book from the stolisma in the morning through to the first dance, which is a long day. Ask whether the photographer has worked in an Orthodox church before: the priest c",essential:!0,share:.06,supplier:"Photographer",religious:!1},{id:"videographer",name:"Videographer",section:"Photos & Film",event:"",note:"Same constraints as the photographer. The Dance of Isaiah and the crowning are the two moments couples most regret losing, and both are short.",essential:!0,share:.04,supplier:"Videographer",religious:!1},{id:"album",name:"Album, prints and parents' copies",section:"Photos & Film",event:"",note:"Almost always bought after the wedding and almost always underestimated. Both sets of parents and the koumbaroi will expect an album.",essential:!1,share:.007,supplier:"Photographer",religious:!1},{id:"gown",name:"Bridal gown",section:"Attire",event:"",note:"Allow for the fact the dress is worn from the morning dressing at home right through to a very late night of dancing, and that money may be pinned to it. Shoulders are traditionally covered in church,",essential:!0,share:.052,supplier:"Bridal shop",religious:!1},{id:"bridal-accessories",name:"Veil, shoes, jewellery and wrap",section:"Attire",event:"",note:"The groom traditionally buys the bride's shoes, and the koumbaros puts coins inside them for luck. Unmarried friends write their names on the sole; whoever's name has worn away by the end of the night",essential:!0,share:.012,supplier:"Bridal shop",religious:!1},{id:"groom-outfit",name:"Groom's outfit",section:"Attire",event:"",note:"Suit, shirt, shoes and accessories. Note that the groom is dressed in front of an audience at the stolisma, so anything fiddly is worth practising.",essential:!0,share:.02,supplier:"Menswear",religious:!1},{id:"party-attire",name:"Koumbaroi and bridal party outfits",section:"Attire",event:"",note:"Who pays varies. In Greece and Cyprus attendants normally pay for themselves; in the American and Australian diaspora the couple more often contributes.",essential:!1,share:.01,supplier:"Bridal shop",religious:!1},{id:"hair-makeup",name:"Hair and make-up",section:"Beauty",event:"stolisma",note:"Booked to the house for the morning dressing rather than to a salon, because the stolisma happens at home with a room full of people watching. Price the trial and the travel separately.",essential:!0,share:.016,supplier:"Hair and make-up",religious:!1},{id:"family-beauty",name:"Hair and make-up for mothers and attendants",section:"Beauty",event:"stolisma",note:"At Greek and Cypriot weddings both mothers, the koumbara, the sisters and often the grandmothers are all done at the house on the morning. It is a bigger booking than couples expect and needs a team r",essential:!1,share:.01,supplier:"Hair and make-up",religious:!1},{id:"groom-shave",name:"Barber for the groom's shave",section:"Beauty",event:"stolisma",note:"The traditional shave is performed by the koumbaros, but most grooms now have a barber standing by to make it look right, with the koumbaros taking the first symbolic stroke.",essential:!1,share:.003,supplier:"Barber",religious:!1},{id:"invitations",name:"Invitations",section:"Stationery",event:"invitations",note:"Print more than you think. Cypriot lists in particular run far past the seated numbers because the chairetisma is separately and much more widely invited, and invitations are delivered by hand so extr",essential:!0,share:.016,supplier:"Stationer",religious:!1},{id:"bomboniere",name:"Bomboniera (favours)",section:"Stationery",event:"reception",note:"The small tulle or box favour holding koufeta, given to every guest. The number of almonds is always odd, usually five or seven, because the couple's life cannot be divided. One per household is norma",essential:!0,share:.02,supplier:"Stationer",religious:!1},{id:"wedding-cars",name:"Wedding cars",section:"Transport",event:"ceremony",note:"The bride travels from her parents' house to the church, and the couple from the church to the reception. In villages a short walking procession behind the musicians replaces the car altogether.",essential:!0,share:.012,supplier:"Car hire",religious:!1},{id:"guest-transport",name:"Guest transport",section:"Transport",event:"reception",note:"Coaches between the church and the reception, which is worth costing properly when the church is in a village and the reception is not. Also parking, which is the single most common complaint at large",essential:!1,share:.008,supplier:"Coach hire",religious:!1},{id:"rings",name:"Wedding rings",section:"Rings & Gifts",event:"ceremony",note:"Plain gold bands are the tradition, often the same rings worn on the left hand since the engagement and moved to the right hand by the priest during the betrothal. Greek and Cypriot couples wear the w",essential:!0,share:.025,supplier:"Jeweller",religious:!1},{id:"koumbaroi-gift",name:"Gifts for the koumbaroi",section:"Rings & Gifts",event:"",note:"The koumbaros and koumbara take on a lifelong role and traditionally pay for the stefana, the lambades and the tray themselves, so the gift is meaningful rather than token. An icon is the conventional",essential:!0,share:.007,supplier:"Gifts",religious:!1},{id:"family-gifts",name:"Gifts for parents and attendants",section:"Rings & Gifts",event:"",note:"For both sets of parents, the attendants and anyone who hosted the krevati or the stolisma.",essential:!1,share:.007,supplier:"Gifts",religious:!1},{id:"planner",name:"Wedding planner or coordinator",section:"Extras",event:"",note:"Worth pricing seriously at Greek and Cypriot scale. A day coordinator who can run a three-hour congratulations line, keep the food moving for six hundred people and manage a band that plays past two i",essential:!1,share:.027,supplier:"Planner",religious:!1},{id:"translations",name:"Document translation and apostilles",section:"Extras",event:"",note:"Needed when a baptismal certificate, birth certificate or divorce decree comes from another country. Greece requires certified translations into Greek by an approved translator; Cyprus accepts Greek o",essential:!1,share:.004,supplier:"Translation",religious:!1}],timeline:[{mb:15,task:"Speak to your parish priest before you book anything else, and ask which dates the church cannot marry you on",critical:!0},{mb:14,task:"Check the fasting seasons against your shortlist: Great Lent and Holy Week, the Dormition fast in the first half of August, the Nativity fast, and the fixed days of 5 and 6 January, 29 August and 14 September",critical:!0},{mb:14,task:"If either of you was married before, start the ecclesiastical divorce now, because it is separate from the civil divorce and takes months",critical:!0},{mb:13,task:"Confirm the church is free and get the date written into the parish diary before you book a venue",critical:!0},{mb:12,task:"Agree who the koumbaros or koumbara will be and confirm they are an Orthodox Christian in good standing, since only an Orthodox sponsor may exchange the rings and the crowns",critical:!0},{mb:12,task:"Book the reception venue, checking its standing capacity as well as its seated capacity",critical:!0},{mb:11,task:"Draw up the two guest lists you actually need: the church and dinner list, and the much larger congratulations list",critical:!0},{mb:11,task:"Book the band, the photographer and the videographer, which go first at popular dates",critical:!1},{mb:10,task:"Order or arrange the stefana and lambades with the koumbaroi, and agree who is paying for what",critical:!1},{mb:9,task:"Start the paperwork: baptismal certificates for both of you, and certificates of freedom to marry or celibacy from your parish",critical:!0},{mb:8,task:"If one of you is not Orthodox, confirm with the priest that the baptism is accepted and complete any declaration about raising children in the Orthodox faith",critical:!0},{mb:8,task:"Book the caterer and confirm the per-head price, the minimum numbers and what happens if numbers rise",critical:!1},{mb:7,task:"Book the violarides or traditional musicians for the morning dressing if you are having one",critical:!1},{mb:6,task:"Begin the meetings with your priest and ask him to walk you through the service, including where you stand and what the koumbaros does",critical:!0},{mb:6,task:"Order the invitations, allowing generously for the congratulations list and for hand delivery",critical:!1},{mb:5,task:"In Cyprus, book the thalassaemia screening appointments for both of you and collect the certificates",critical:!0},{mb:4,task:"Submit your documents to the priest so he can apply to the Metropolis or Archdiocese for permission to marry",critical:!0},{mb:4,task:"Confirm the church's rules on photography, flowers, aisle runners, rice and confetti in writing",critical:!1},{mb:3,task:"Start delivering the invitations in person, family by family",critical:!1},{mb:3,task:"Give notice of marriage to the civil authority: the register office in the United Kingdom, the municipality in Greece, the Notice of Intended Marriage in Australia, the county clerk in the United States",critical:!0},{mb:3,task:"In England and Wales, confirm whether the church is registered for marriages and book the registrar if one must attend",critical:!0},{mb:2,task:"In Greece, publish the marriage announcement in a daily newspaper and collect the marriage licence from the parish or Metropolis",critical:!0},{mb:2,task:"Confirm the ecclesiastical permission has come back from the Metropolis and check its expiry date against your wedding date",critical:!0},{mb:2,task:"Book hair, make-up and the barber to come to the houses on the morning, for the mothers and attendants as well as the couple",critical:!1},{mb:1,task:"Buy the koufeta, the wine for the common cup and the rice or petals, within the church's rules",critical:!1},{mb:1,task:"Pay the church balance and put the priest's and chanter's envelopes together",critical:!1},{mb:1,task:"Fix the date of the krevati with the friends who will make the bed, and the eve gathering with both families",critical:!1},{mb:1,task:"Confirm running times with the band and agree the overtime rate in writing",critical:!1},{mb:0,task:"Hold the stolisma and the eve gathering, and give the koumbaroi the stefana, lambades and tray to bring to the church",critical:!1},{mb:0,task:"In the days after the wedding, register the marriage: within 40 days at the lixiarcheio in Greece, within 45 days with the Registrar in Cyprus",critical:!0}],paperwork:[{item:"Orthodox baptismal certificate",who:"The Orthodox party, and often both",note:"Proof of baptism in the name of the Father, Son and Holy Spirit. If you were baptised abroad, request it early: a parish in Greece or Cyprus can take weeks or months to send one, and a certified translation may then be n"},{item:"Baptismal certificate for a non-Orthodox partner",who:"The non-Orthodox party",note:"The Church will marry an Orthodox Christian to a baptised Christian of a Trinitarian church, and the certificate is how that is checked. Roman Catholic, Anglican, Lutheran, Methodist, Presbyterian, Armenian, Coptic and s"},{item:"Certificate of freedom to marry or celibacy (pistopoiitiko agamias)",who:"Both",note:"Issued by your own parish, usually on the word of two witnesses who are not close relatives, confirming you have not married before. It expires, commonly after six months, so do not get it too early."},{item:"Permission or licence to marry from the Metropolis or Archdiocese",who:"Both",note:"The priest applies on your behalf once your certificates are in. There is a fee and a processing time of anything from a week to a month or more. Nothing else in the church process can be finalised without it."},{item:"Civil marriage licence or notice of marriage",who:"Both",note:"Varies entirely by country. Greece: a marriage licence from the municipality of your residence plus a marriage announcement published in a daily newspaper. Cyprus: freedom certificates and a notification. United States: "},{item:"Thalassaemia screening certificate",who:"Both, in Cyprus",note:"The Church of Cyprus has required a premarital thalassaemia certificate since 1983 as part of the island's screening programme. It confirms you have been tested and counselled; it does not prevent you marrying."},{item:"Ecclesiastical divorce decree",who:"Either party previously married in the Orthodox Church",note:"Separate from and additional to the civil divorce, and issued by the Metropolis. It usually has to be final at least a month before the new wedding, and it commonly takes far longer to obtain than couples expect."},{item:"Civil divorce decree",who:"Either party previously married",note:"The final decree, not the provisional one."},{item:"Death certificate of a former spouse",who:"Either party widowed",note:""},{item:"Declaration that children will be baptised and raised Orthodox",who:"The non-Orthodox party, in most jurisdictions",note:"Required in the Australian and American archdioceses and normal elsewhere. Conversion of the non-Orthodox partner is not required, and marrying in the church does not by itself make them a member."},{item:"Certificate of good standing for the koumbaros or koumbara",who:"The sponsor",note:"If the sponsor belongs to a different parish, their own priest must confirm in writing that they are an Orthodox Christian in good standing. A sponsor whose own marriage was never blessed by the Church, or who divorced w"},{item:"Certificate of membership or stewardship",who:"Both, in the United States and Australia",note:"Parishes commonly check that at least one of you is a registered member, and the church fee is often materially higher if neither of you is."},{item:"Passport or birth certificate",who:"Both",note:""},{item:"Certified translations and apostilles",who:"Either party with foreign documents",note:"Greece requires translation into Greek by an approved translator. Cyprus accepts Greek or English. Allow weeks, not days."},{item:"Registration of the marriage after the ceremony",who:"Both",note:"Greece: declare the marriage at the lixiarcheio within 40 days, or pay a fine. Cyprus: a certified copy must reach the Registrar within 45 days. In the United States, Australia and Canada the priest normally submits the "},{item:"Registrar attendance or separate civil ceremony",who:"Both, in England and Wales",note:"An Orthodox church can only marry you legally if the building is registered for marriages and an authorised person or a registrar is present. Some parishes are set up for this, some are not, and where they are not the co"}],customs:[{name:"The koumbaros and koumbara",description:"Not a best man and maid of honour. The koumbaroi are sponsors of the marriage: they exchange the rings three times and the crowns three times during the service, they traditionally buy the stefana, the lambades and the tray, and they are conventionally asked to baptise your first child, which makes "},{name:"The Service of Betrothal",description:"The first of the two services, historically performed at the engagement and now joined to the wedding. The priest blesses the rings, signs them three times over each of your foreheads beginning with the groom, and places them on your right hands. The koumbaros then exchanges them three times between"},{name:"The stefana",description:"Two crowns joined by a single white ribbon, placed on your heads by the priest and exchanged three times by the koumbaros. They mark you as king and queen of your household, and they are also crowns of martyrdom, because a marriage asks both of you to give things up. The ribbon is never cut. Afterwa"},{name:"No vows",description:"There are no vows and no spoken 'I do' in the Orthodox service. Marriage is understood as something God does rather than a contract the couple make, so the priest acts and the couple stand. Guests from other traditions are often surprised by this, and it is worth putting a line in the order of servi"},{name:"The common cup",description:"After the Gospel reading about the wedding at Cana, you drink three times each from one cup of sweet wine. It is not communion. It stands for everything you will share from now on, the difficult as much as the good."},{name:"The Dance of Isaiah",description:"The priest leads you three times around the table holding the Gospel and the cross, with the koumbaros following behind holding the ribbon that joins the crowns. These are your first steps as a married couple, and in many parishes guests throw rice at you as you go. Three hymns are sung, the first b"},{name:"Rice and koufeta",description:"Rice for roots and fertility, koufeta for sweetness. Guests throw rice and petals as you leave the church, and every guest is given a bomboniera holding an odd number of sugared almonds, usually five or seven, because a marriage cannot be divided. The almond is hard, the sugar is sweet: the wish is "},{name:"The dressing (to stolisma / ta allamata)",description:"The bride and groom are dressed at home on the wedding morning in front of family and friends, with violi and laouto players in the room. In Cyprus the clothes are first laid on a chair under a red cloth, incensed three times, and danced with by each relative in turn. Then comes the zosimo: the pare"},{name:"The shaving of the groom",description:"The koumbaros shaves the groom, or at least takes the first stroke, as a public sign of trust. Friends then help him dress, each doing one thing, so that everyone has a part."},{name:"The krevati",description:"Friends and unmarried female relatives make the marital bed, usually three times, then throw rice, koufeta and money onto it and roll a baby across it. The baby's sex is said to predict your first child's. In Cyprus the older form is the paploma, where the quilt is sewn and stuffed by hand with a re"},{name:"The bride's shoes",description:"The groom traditionally buys the bride's shoes and the koumbaros puts coins inside them. Unmarried friends write their names on the sole before the wedding, and whichever name has worn away by the end of the night is the next to marry."},{name:"The nifopsomo",description:"In parts of mainland Greece, a large wedding bread is broken over the bride's head as she leaves her parents' house and shared out among everyone standing there."},{name:"Stepping on the foot",description:"When the epistle reaches the line asking the wife to respect her husband, guests watch the bride's feet: if she steps on the groom's foot first, she will run the house. It is a joke, and everyone in the church is in on it."},{name:"The congratulations line (to chairetisma)",description:"The couple, both sets of parents and the koumbaroi stand in a line and every guest passes to congratulate them. In Cyprus this is the part of the day most people attend, it can last two or three hours, and it is where guests hand over the envelope. Wear shoes you can stand in."},{name:"Money at the wedding",description:"Cash is the wedding gift, not an alternative to one. In Cyprus and much of Greece it is handed over in a named envelope at the congratulations line, and the amount is scaled to closeness, from a small sum for an acquaintance to a substantial one for family. The older form, still done during the coup"},{name:"The zeibekiko",description:"A solo improvised dance, traditionally danced by one man alone to a slow heavy song, most often the groom or the bride's father. Nobody joins in. The people around him kneel in a circle and clap the rhythm, and cutting in is a serious insult. It is the emotional centre of the night rather than a par"},{name:"The dances",description:"The couple dance first, then the parents and the koumbaroi lead in turn, then the floor opens. Expect kalamatianos and syrtos as the open circle dances everyone can join, tsamikos, tsifteteli, and hasapiko or sirtaki. Cyprus adds the sousta; Crete adds pentozali and its own sousta. The lead dancer i"},{name:"Plate smashing",description:"More myth than tradition. Breaking plates was a feature of Athenian nightclub culture from the 1950s onwards rather than an old wedding rite, it was restricted by law under the junta, and in Greece it has largely been replaced by throwing trays of flowers over the dancers. It survives at some Greek-"},{name:"The wedding ring hand",description:"Greek and Cypriot couples wear the wedding ring on the right hand. Plain gold bands are worn on the left from the engagement and the priest moves them to the right during the betrothal service. Much of the diaspora has quietly switched to the left hand, and Romanian Orthodox practice differs again."},{name:"Delivering the invitations by hand",description:"Invitations are taken round in person by the couple, their parents or the koumbaroi, with a visit at each house. In Cypriot villages anyone from either family's village counted as invited without a card at all, and the historic invitation was a ring of sesame bread called a glistarka."},{name:"The antigamos",description:"In Cyprus the families gather again the day after to eat what is left, count the money and thank the people who worked. In some villages it is called ta pkiata, after returning the borrowed plates."},{name:"Avoiding a leap year",description:"There is a persistent folk belief in Greece and Cyprus that marrying in a leap year is unlucky, and marriage rates measurably dip in those years. It is superstition rather than Church teaching, and no priest will refuse you, but older relatives may raise it."}],gotchas:["Set the date with the priest before the venue. Roughly a third of the year is closed to weddings between Great Lent and Holy Week, the Dormition fast in the first half of August, the Nativity fast, and fixed days including 5 and 6 January, 29 August and 14 September.","How much of the Nativity fast is closed varies by jurisdiction. The Greek Orthodox Archdiocese of America and many diaspora parishes restrict 13 to 25 December; the Church of Cyprus and much of Greece treat the whole fast from 15 November as closed. Ask your own priest rather tha","The Church of Cyprus does not marry on Wednesdays or Fridays outside the meat-eating periods, since both are fast days.","The koumbaros or koumbara must be an Orthodox Christian in good standing. A non-Orthodox partner cannot be the koumbaros of their own wedding, and a friend who is Orthodox but whose own marriage was not blessed by the Church, or who divorced without an ecclesiastical divorce, wil","An ecclesiastical divorce is a separate process from a civil divorce and is granted by the Metropolis, not a court. It routinely takes six months or more and the church wedding cannot be scheduled until it is final.","An Orthodox Christian may marry a baptised Christian of a Trinitarian church, but not an unbaptised person. If your partner is not baptised, the only route is baptism first, which needs its own preparation and time.","Certificates expire. Certificates of freedom to marry and the permission from the Metropolis are commonly valid for six months only, so obtaining them a year in advance means doing it twice.","In England and Wales an Orthodox wedding is only legally binding if the church building is registered for marriages and an authorised person or registrar is present. Some parishes are set up for this and some are not. Confirm in writing which applies to yours before you plan arou","In Greece the marriage must be declared at the lixiarcheio within 40 days or you pay a fine, and after 130 days the fine rises. In Cyprus a certified copy must reach the Registrar within 45 days.","Guest numbers are not really within your control at a Cypriot wedding. Because the congratulations line is openly invited and invitations are delivered by hand, several hundred people who never confirmed will come. Plan the standing capacity and the drinks for a number well above","Money given by guests is expected to cover much of the day, but it arrives on the night and most suppliers want paying before it. Cash flow, not total cost, is what catches Cypriot and Greek couples out.","Most parishes ban rice, almonds and confetti inside and outside the church, and some charge a cleaning fine. Ask what is permitted before you buy anything to throw.","Photographers and videographers are tightly constrained inside an Orthodox church. The priest decides where they may stand, several key moments happen with your backs to the congregation, and the post-service session may be capped at half an hour if another wedding follows.","Only chanting and, in some jurisdictions, an organ are allowed inside the church. Recorded music, string quartets and secular processional pieces are not, and 'Here Comes the Bride' is not used.","The service has no vows and cannot be personalised. Readings, hymns and the order are fixed, there are no personal readings or self-written promises, and requests to change it will be declined kindly but firmly.","A second or third marriage is celebrated in an abbreviated penitential form rather than the full service. A fourth is not permitted at all. If it is a first marriage for one of you, most priests will use the full service.","Spiritual kinship is a real impediment. Godparents cannot marry their godchildren or their godchildren's parents, and two people baptised by the same godparent cannot marry each other. First cousins and several in-law relationships are also barred.","Book the band by the hour and agree the overtime rate in writing. Greek and Cypriot receptions habitually run two or three hours past the contracted finish.","Bomboniera are conventionally one per household in Greece and Cyprus and one per person in much of the diaspora. Confirm which you are doing before ordering eight hundred of them.","In Cyprus both of you need a thalassaemia screening certificate before the Church will marry you. It is quick, but it is one more appointment to book and one more certificate to chase."]},hindu:{id:"hindu",name:"Hindu / South Asian",shortName:"Hindu",faithGroup:"Hindu",blurb:"Several days of haldi, mehndi and sangeet building to the vivaah under the mandap: the baraat, the sacred fire, the seven steps, the mangalsutra and sindoor, at a muhurat chosen with your pandit.",typicalGuests:{low:150,typical:300,high:1e3},terms:{officiant:"pandit",ceremonyVenue:"mandap",ceremony:"the vivaah",bestMan:"best man",maidOfHonour:"maid of honour",reception:"reception",firstDance:"first dance",witnesses:"witnesses"},events:[{id:"roka",name:"Roka and engagement (sagai / nischitartham)",when:"Three to eighteen months before",optional:!0,default:!0,description:"The formal agreement between the two families, and often the first party of the wedding. In North India the roka 'stops' the match and is followed by a ring ceremony (sagai or mangni); in the south the equivalent is the nischitartham or nic"},{id:"ganesh-puja",name:"Ganesh puja and opening rituals",when:"One to seven days before",optional:!0,default:!0,description:"Most families open the wedding period with a puja to Ganesha, the remover of obstacles, held at home with close family. Regional forms sit alongside it: the graha shanti in Marathi and Gujarati families, the mandap or mandvo ceremony raisin"},{id:"haldi",name:"Haldi (pithi / gaye holud)",when:"One or two days before, or the wedding morning",optional:!0,default:!0,description:"Family and friends apply a paste of turmeric, oil and water to the bride's and groom's skin to bless them and ward off ill fortune. Called pithi in Gujarati families and gaye holud in Bengali ones, it is playful and messy: everyone wears cl"},{id:"mehndi",name:"Mehndi",when:"One or two days before",optional:!0,default:!0,description:"Henna is applied to the bride's hands and feet in intricate designs, with the groom's name or initials often hidden in the pattern for him to find later. Female relatives and friends have simpler designs done at the same time, with music an"},{id:"sangeet",name:"Sangeet",when:"One or two nights before",optional:!0,default:!0,description:"A night of music and dancing, with choreographed performances by cousins and friends alongside open dancing. Originally a North Indian and Punjabi ladies' singing night, it has become a pan-Indian and diaspora fixture and is often the bigge"},{id:"baraat",name:"Baraat, milni and welcome",when:"Wedding day, before the ceremony",optional:!0,default:!0,description:"The groom arrives in procession with his family and friends dancing around him, traditionally on a white horse and led by dhol drummers. At the entrance the milni greets the two families pair by pair, and the bride's mother welcomes the gro"},{id:"ceremony",name:"The wedding ceremony (vivaah)",when:"Wedding day, at the muhurat",optional:!1,default:!0,description:"Held under the mandap and centred on the sacred fire, with the pandit chanting in Sanskrit. Core elements shared across most regions: the varmala exchange of garlands, kanyadaan, the fire offering (vivaha homa), the joining of hands, the ci"},{id:"vidaai",name:"Vidaai (farewell)",when:"Straight after the ceremony or end of the day",optional:!0,default:!0,description:"The bride's formal farewell to her family as she leaves with the groom. In many North Indian families she throws handfuls of rice back over her head towards her parents' home as thanks for raising her. It is short and openly emotional, and "},{id:"reception",name:"Reception",when:"Wedding evening or the day after",optional:!0,default:!0,description:"The large party: entrances, speeches, dinner and dancing. Traditionally hosted by the groom's family to introduce the bride to their community, and sometimes held in a different city for that reason, though many couples now hold a single co"},{id:"griha-pravesh",name:"Griha pravesh (welcoming home)",when:"After the wedding",optional:!0,default:!1,description:"The bride is welcomed into the groom's family home for the first time as a wife, classically tipping over a vessel of rice at the threshold with her right foot and entering right foot first. A small family ritual rather than a hosted event,"},{id:"civil-marriage",name:"Civil marriage or registrar attendance",when:"Before or after the religious ceremony, where required",optional:!0,default:!1,description:"Whether the religious ceremony is legally recognised depends on the country. In India the Hindu ceremony itself creates the marriage, which is then registered. In England and Wales the venue must be registered for marriages with an authoris"}],items:[{id:"pandit-fee",name:"Pandit's fee (dakshina)",section:"Ceremony",event:"ceremony",note:"The offering to the priest for conducting the ceremony, usually discussed openly in advance and handed over as dakshina on the day. Many families also book the same pandit for the Ganesh puja and othe",essential:!0,share:.008,supplier:"Pandit",religious:!0},{id:"muhurat-consultation",name:"Muhurat and horoscope consultation",section:"Ceremony",event:"",note:"The sitting with a pandit or astrologer to fix the muhurat, the auspicious date and exact time for the ceremony, worked out from the panchang (Hindu almanac) and often from the couple's birth details.",essential:!0,share:.002,supplier:"Pandit",religious:!1},{id:"ceremony-venue",name:"Ceremony venue hire",section:"Ceremony",event:"ceremony",note:"A temple hall, banquet hall, marriage hall (kalyana mandapam in the south) or outdoor space that can hold the mandap and the guest count. Two things rule venues out fast: whether they permit an open f",essential:!0,share:.055,supplier:"Venue",religious:!1},{id:"mandap",name:"Mandap hire and decoration",section:"Flowers & Styling",event:"ceremony",note:"The four-pillared canopy under which the ceremony happens, its pillars often read as the four parents or the four aims of life. Usually hired as a decorated structure with seating for the couple, both",essential:!0,share:.045,supplier:"Mandap and decor",religious:!0},{id:"havan-samagri",name:"Puja items and havan samagri",section:"Ceremony",event:"ceremony",note:"Everything the rituals consume: the samagri (herbs and woods) and ghee for the fire, coconuts, rice, kumkum, turmeric, betel leaves, the kalash, flowers and the parched rice for the offerings. Your pa",essential:!0,share:.005,supplier:"Pandit",religious:!0},{id:"varmala-garlands",name:"Varmala garlands",section:"Flowers & Styling",event:"ceremony",note:"The two fresh flower garlands the couple exchange at the start of the ceremony. They are handled, lifted and photographed constantly, so they are made heavier and fresher than ordinary garlands; in th",essential:!0,share:.003,supplier:"Florist",religious:!0},{id:"civil-registration",name:"Civil registration and licence fees",section:"Ceremony",event:"civil-marriage",note:"Varies entirely by country: the marriage licence in the United States and Canada, notice of marriage for each of you in England and Wales plus any registrar attendance fee, the Notice of Intended Marr",essential:!0,share:.003,supplier:"Registrar",religious:!1},{id:"reception-venue",name:"Reception venue hire",section:"Reception",event:"reception",note:"Needs genuine capacity for a large seated dinner plus a stage and dance floor, and ideally tolerance for a late finish. If the ceremony and reception are in one venue, check the turnaround time to str",essential:!0,share:.07,supplier:"Venue",religious:!1},{id:"catering-wedding-day",name:"Wedding day catering",section:"Reception",event:"reception",note:"The biggest line in the budget. Menus are regional: North Indian, Gujarati thali service, South Indian meals traditionally served on banana leaves, Indo-Caribbean, or a mix when the families differ. B",essential:!0,share:.22,supplier:"Caterer",religious:!1},{id:"catering-pre-events",name:"Catering for haldi, mehndi and sangeet",section:"Reception",event:"",note:"The pre-wedding events all feed people too, and across three or four gatherings this quietly becomes one of the larger lines. Home-cooked food and chaat stations are common for haldi and mehndi; the s",essential:!0,share:.05,supplier:"Caterer",religious:!1},{id:"drinks",name:"Drinks",section:"Reception",event:"reception",note:"Practice varies more here than anywhere else. Alcohol is never served at the ceremony, temple venues ban it from the premises entirely, and some families are dry throughout; others run a full bar at t",essential:!0,share:.028,supplier:"Caterer",religious:!1},{id:"service-staffing",name:"Service charge and staffing",section:"Reception",event:"reception",note:"Waiting and bar staff, buffet and live-station staffing, and cleanup, often quoted separately from the per-head food price. Live counters (dosa, chaat, tandoor) each carry their own staffing cost.",essential:!0,share:.01,supplier:"Caterer",religious:!1},{id:"wedding-cake",name:"Wedding cake",section:"Reception",event:"reception",note:"Not a Hindu tradition, but a common diaspora addition for the reception. If your families are strictly vegetarian, order an eggless cake; most Indian bakers do this as standard.",essential:!1,share:.005,supplier:"Cake maker",religious:!1},{id:"mithai-favours",name:"Mithai and favours",section:"Stationery",event:"",note:"Boxes of Indian sweets given to guests, and larger trays exchanged between the families across the week. Many families also send sweets out with the invitations to close relatives. Order per household",essential:!0,share:.01,supplier:"Caterer",religious:!1},{id:"bridal-outfit",name:"Bridal lehenga or sari",section:"Attire",event:"ceremony",note:"Red and deep jewel tones are traditional for the ceremony in much of India, though regional dress differs beautifully: a lehenga or red sari in the north, a Kanjeevaram silk sari in Tamil families, a ",essential:!0,share:.045,supplier:"Bridal wear",religious:!1},{id:"bridal-additional-outfits",name:"Bride's outfits for the other events",section:"Attire",event:"",note:"A separate look for the mehndi, sangeet and reception is now standard: typically lighter lehengas or suits for the pre-events and a gown or second lehenga for the reception. This multiplies quickly, a",essential:!1,share:.02,supplier:"Bridal wear",religious:!1},{id:"groom-sherwani",name:"Groom's sherwani or ceremony outfit",section:"Attire",event:"ceremony",note:"A sherwani with a safa (turban) and often a kalgi brooch in the north; a kurta with dhoti, or a veshti with angavastram, in southern and eastern traditions where the groom may also be bare-chested wit",essential:!0,share:.015,supplier:"Menswear",religious:!1},{id:"groom-additional-outfits",name:"Groom's outfits for the other events",section:"Attire",event:"",note:"Kurtas for the haldi and mehndi, something sharper for the sangeet, a suit or second sherwani for the reception. Simpler and cheaper than the bride's set, but still several outfits.",essential:!1,share:.007,supplier:"Menswear",religious:!1},{id:"family-outfits",name:"Outfits for parents and close family",section:"Attire",event:"",note:"Both sets of parents and siblings are on show all week and in every photograph, and in many families the couple or parents fund matched outfits for the immediate family, particularly for the wedding d",essential:!1,share:.012,supplier:"Bridal wear",religious:!1},{id:"safa-turbans",name:"Safas for the baraat",section:"Attire",event:"baraat",note:"In many North Indian and Rajasthani-style weddings, male guests on the groom's side wear matching turbans for the baraat, hired in bulk with a tier ready to tie them on the day.",essential:!1,share:.003,supplier:"Menswear",religious:!1},{id:"mangalsutra",name:"Mangalsutra or thali",section:"Rings & Gifts",event:"ceremony",note:"The necklace the groom ties or fastens on the bride at the heart of the ceremony: black beads and gold in most of India, the thali or mangalyam on a turmeric-rubbed thread tied with three knots in Tam",essential:!0,share:.008,supplier:"Jeweller",religious:!0},{id:"gold-jewellery",name:"Bridal gold and jewellery",section:"Rings & Gifts",event:"",note:"Usually the second-largest line after catering. The bridal set for the ceremony, pieces for the other events, and gold given by both families, traditionally regarded as the bride's own property (strid",essential:!0,share:.08,supplier:"Jeweller",religious:!1},{id:"rings",name:"Engagement and wedding rings",section:"Rings & Gifts",event:"roka",note:"Ring exchange belongs to the engagement (sagai) rather than the wedding ceremony itself, which centres on the mangalsutra instead. Many couples add a Western-style ring exchange at the ceremony or rec",essential:!0,share:.01,supplier:"Jeweller",religious:!1},{id:"family-gifts",name:"Gifts between the families (shagun)",section:"Rings & Gifts",event:"",note:"Trays of saris, suit lengths, dried fruit, sweets and shagun envelopes flow between the two families at the roka, the wedding and after. The scale varies enormously by family and region; what matters ",essential:!1,share:.015,supplier:"Gifts",religious:!1},{id:"sangeet-entertainment",name:"Sangeet DJ, sound and staging",section:"Music & Entertainment",event:"sangeet",note:"The sangeet needs a proper sound system, microphones for performances, a stage or clear floor and someone to run the playlist between acts. A DJ who knows Bollywood, bhangra and your regional music wi",essential:!0,share:.015,supplier:"DJ",religious:!1},{id:"choreographer",name:"Sangeet choreographer",section:"Music & Entertainment",event:"sangeet",note:"Hired to drill the family dance performances in the weeks before. Common wherever the sangeet is a big production; rehearsals over video call with relatives abroad are now routine.",essential:!1,share:.004,supplier:"Entertainment",religious:!1},{id:"dhol-baraat",name:"Dhol players for the baraat",section:"Music & Entertainment",event:"baraat",note:"Live dhol drummers lead the baraat and set its energy; a brass band (baaja) is the fuller traditional form in India. Book for a set duration and agree the route, because a baraat with good dhol player",essential:!1,share:.006,supplier:"Band",religious:!1},{id:"ceremony-musicians",name:"Ceremony musicians (shehnai or nadaswaram)",section:"Music & Entertainment",event:"ceremony",note:"The shehnai is the classic auspicious sound of a North Indian wedding; in Tamil and Telugu weddings the nadaswaram and thavil drums are close to essential, with the getti melam crescendo masking any i",essential:!1,share:.004,supplier:"Band",religious:!1},{id:"reception-music",name:"Reception DJ or band",section:"Music & Entertainment",event:"reception",note:"Usually a DJ with an emcee who can manage entrances, speeches and an open floor across generations and possibly languages. Live Bollywood bands and fusion acts are popular where budgets allow.",essential:!0,share:.02,supplier:"DJ",religious:!1},{id:"av-lighting",name:"Lighting, sound and staging",section:"Music & Entertainment",event:"",note:"Uplighting, stage wash for the mandap and sangeet performances, projection for photo montages, and a PA that reaches the back of a big room. Often spread across several events, so price it as a packag",essential:!1,share:.012,supplier:"AV hire",religious:!1},{id:"photographer",name:"Photographer",section:"Photos & Film",event:"",note:"A multi-day booking covering haldi, mehndi, sangeet, the ceremony and reception, usually with a second shooter so the bride's and groom's preparations are both covered. Choose someone who knows Hindu ",essential:!0,share:.05,supplier:"Photographer",religious:!1},{id:"videographer",name:"Videographer",section:"Photos & Film",event:"",note:"Same multi-day scope as the photographer, and same need for ceremony experience. Highlight films and same-day edits shown at the reception are popular; livestreaming for relatives abroad has become a ",essential:!0,share:.035,supplier:"Videographer",religious:!1},{id:"album",name:"Albums and parents' copies",section:"Photos & Film",event:"",note:"Both sets of parents will expect an album. Ordered after the wedding and routinely underestimated.",essential:!1,share:.005,supplier:"Photographer",religious:!1},{id:"bridal-hmua",name:"Bridal hair and make-up",section:"Beauty",event:"",note:"A multi-event booking: distinct looks for mehndi, sangeet, the ceremony and reception, with the wedding-day look built around the outfit, jewellery and possibly a dupatta set over the hair. If the muh",essential:!0,share:.012,supplier:"Hair and make-up",religious:!1},{id:"mehndi-artist",name:"Mehndi artist",section:"Beauty",event:"mehndi",note:"Bridal mehndi covering hands to forearms and feet takes three to eight hours, so it happens a day or two before the wedding and the artist is booked for the full session. Additional artists are usuall",essential:!0,share:.006,supplier:"Mehndi artist",religious:!1},{id:"family-beauty",name:"Hair and make-up for mothers and close family",section:"Beauty",event:"",note:"Both mothers, sisters and often grandmothers book professional hair and make-up for the wedding day and reception, plus sari draping, which is a genuine skill worth paying for. It needs a team, not on",essential:!1,share:.006,supplier:"Hair and make-up",religious:!1},{id:"invitations",name:"Invitations",section:"Stationery",event:"",note:"Traditionally opened with an invocation to Ganesha and naming both sets of parents and grandparents as hosts, with separate inserts per event since the guest lists differ. Elders often hand-deliver th",essential:!0,share:.008,supplier:"Stationer",religious:!1},{id:"baraat-transport",name:"Baraat horse or car",section:"Transport",event:"baraat",note:"The decorated white horse (ghodi) is traditional in the north; a vintage or luxury car is the common substitute, and some grooms arrive by other means entirely. Horse hire comes with handler, welfare ",essential:!1,share:.005,supplier:"Car hire",religious:!1},{id:"guest-transport",name:"Wedding cars and guest transport",section:"Transport",event:"",note:"The couple's cars across multiple days and venues, plus coaches for guests where the ceremony and reception are apart. The vidaai car is decorated for the couple's departure. With events across severa",essential:!0,share:.008,supplier:"Car hire",religious:!1},{id:"florals-styling",name:"Florals and venue styling",section:"Flowers & Styling",event:"",note:"Beyond the mandap: entrance and stage decor, table centrepieces, marigold garlands and strings which are the signature flower of Indian weddings, and themed decor for the mehndi and sangeet. Across fo",essential:!0,share:.03,supplier:"Florist",religious:!1},{id:"planner",name:"Wedding planner or coordinator",section:"Extras",event:"",note:"Coordinating five events, two families, a pandit, a muhurat-fixed timeline and several hundred guests is a serious logistics job. A planner who has run Hindu weddings, and ideally your region's style ",essential:!1,share:.025,supplier:"Planner",religious:!1},{id:"guest-accommodation",name:"Accommodation for out-of-town family",section:"Extras",event:"",note:"Hindu weddings pull family across countries, and hosts traditionally help house close relatives for the whole event span, not one night. Negotiate a hotel block early and decide which rooms the famili",essential:!1,share:.02,supplier:"Hotel",religious:!1}],timeline:[{mb:14,task:"Sit down with your pandit or astrologer and fix the muhurat before you book anything else, since the auspicious date and time anchor every other booking",critical:!0},{mb:14,task:"Ask which periods are closed for weddings in your community's calendar, such as Chaturmas, adhik maas and periods when Venus or Jupiter is combust, so you know which months are simply unavailable",critical:!0},{mb:13,task:"Agree between the two families who is hosting and paying for what, event by event, before the big bookings are made",critical:!0},{mb:13,task:"Book the ceremony and reception venues, confirming in writing that they allow an open flame for the havan and can open at the hour your muhurat requires",critical:!0},{mb:12,task:"Book the pandit for the wedding date and the supporting pujas, since good pandits are booked out on the same auspicious dates as the venues",critical:!0},{mb:12,task:"Draw up guest lists per event with both families, since the ceremony, sangeet and reception lists usually differ",critical:!0},{mb:11,task:"Book the photographer and videographer for the full multi-day span, not just the wedding day",critical:!1},{mb:10,task:"Book a caterer experienced in Indian and fully vegetarian cooking, and agree the approach to eggs, Jain and vegan requirements and alcohol with both families",critical:!0},{mb:10,task:"Book the mandap and decor company and connect them directly with the venue about the fire",critical:!1},{mb:9,task:"Start outfit shopping for the couple, allowing for a buying trip to India or long lead times on made-to-order lehengas and sherwanis",critical:!1},{mb:9,task:"Begin jewellery purchases, spreading the gold buying over the months rather than one late purchase",critical:!1},{mb:8,task:"Book the sangeet DJ, dhol players, ceremony musicians and, if you want one, the choreographer",critical:!1},{mb:8,task:"Book the mehndi artist and the hair and make-up artist for all events, confirming they can start before dawn if the muhurat is early",critical:!1},{mb:7,task:"Reserve hotel blocks for out-of-town family across the full event span",critical:!1},{mb:6,task:"Order invitations with separate event inserts, and send save-the-dates to overseas guests who need visas and flights",critical:!1},{mb:6,task:"Fix the schedule of pre-wedding events with both families, including who hosts the haldi, mehndi and sangeet and where",critical:!1},{mb:5,task:"Check the legal position where you are marrying: whether the pandit can solemnise legally, whether the venue is registered, and whether you need a separate civil ceremony",critical:!0},{mb:4,task:"Walk through the ceremony with your pandit: which rituals are included, how long it will run, who performs the kanyadaan and the other family roles, and whether he will explain the rituals in English as he goes",critical:!0},{mb:4,task:"Collect the samagri list from the pandit and agree who is sourcing the puja items",critical:!1},{mb:3,task:"Give legal notice where required: notice of marriage in the United Kingdom, the Notice of Intended Marriage in Australia, the marriage licence application window in the United States or Canada",critical:!0},{mb:3,task:"Plan the baraat route with the venue and check whether a street procession or horse needs council or police permission",critical:!1},{mb:3,task:"Hold the menu tasting and fix the final menus per event",critical:!1},{mb:2,task:"Confirm the exact muhurat timing with the pandit and build the wedding day run sheet backwards from it",critical:!0},{mb:2,task:"Start sangeet rehearsals and confirm the performance running order",critical:!1},{mb:1,task:"Chase RSVPs per event, set the seating plan and order the mithai boxes per household",critical:!1},{mb:1,task:"Confirm every vendor against the run sheet, and order the fresh garlands and florals for delivery on the day",critical:!1},{mb:1,task:"Write a short ceremony program explaining the rituals for guests who have not attended a Hindu wedding before",critical:!1},{mb:0,task:"Hold the Ganesh puja, haldi, mehndi and sangeet on the planned days, keeping the bridal mehndi session clear of other commitments",critical:!1},{mb:0,task:"After the wedding, register the marriage and obtain the certificate: with the state registrar in India, or confirm the licence or schedule has been returned where the pandit solemnised legally",critical:!0}],paperwork:[{item:"Civil marriage licence or notice of marriage",who:"Both",note:"Varies by country. United States and Canada: a licence from the county or province, which the pandit signs if authorised. Australia: a Notice of Intended Marriage at least one calendar month before. England and Wales: no"},{item:"Confirmation the pandit can legally solemnise",who:"The couple",note:"In the United States, Canada and Australia many pandits are authorised or registered officiants, but not all are, and some cities require officiant registration. If yours is not, plan a short civil ceremony and let the r"},{item:"Separate civil ceremony where the religious one has no legal effect",who:"Both",note:"In England and Wales a Hindu ceremony in an unregistered venue, including most hotels and marquees, has no legal effect on its own. Many couples marry at a register office before the wedding week, or book a registrar int"},{item:"Marriage registration in India",who:"Both, if marrying in India",note:"The ceremony itself creates the marriage under the Hindu Marriage Act, but the Supreme Court has directed that marriages be registered, state rules set the procedure, and the certificate is what banks, passport offices a"},{item:"Proof of age and identity",who:"Both",note:"Birth certificate or passport. In India the legal minimum ages are 21 for the groom and 18 for the bride under the Hindu Marriage Act."},{item:"Divorce decree absolute",who:"Either party previously married",note:"The final decree, for both the civil authorities and the pandit, who will usually ask."},{item:"Death certificate of a former spouse",who:"Either party widowed",note:""},{item:"Special Marriage Act route for interfaith couples in India",who:"Couples where one partner is not Hindu, Sikh, Jain or Buddhist",note:"The Hindu Marriage Act covers marriages where both partners are Hindu, Sikh, Jain or Buddhist. An interfaith couple in India marries under the Special Marriage Act instead, which requires 30 days' public notice at the ma"},{item:"Temple booking and religious requirements",who:"Both, if marrying at a temple",note:"Temples have their own forms and rules: advance booking, sometimes proof or declaration that both partners are Hindu or of dharmic faiths, and strict premises rules on food and alcohol. Ask early rather than assuming."},{item:"The pandit's samagri list",who:"The couple and both families",note:"Not legal paperwork, but treat it like it: the itemised list of puja materials the ceremony needs, issued by the pandit. Losing track of it, or of who is bringing what, is a classic wedding-morning scramble."},{item:"Apostilles and certified translations",who:"Either party with foreign documents",note:"Needed when documents cross borders: a couple marrying in India with foreign birth or divorce certificates, or a couple abroad registering an Indian marriage certificate for immigration. Allow weeks, not days."},{item:"Marriage certificate for immigration",who:"Couples living across borders",note:"Spousal visa applications scrutinise the marriage certificate and evidence of the ceremony. If your wedding is in India and your life is elsewhere, register promptly and keep photographs, the invitation and the certifica"}],customs:[{name:"The muhurat",description:"The auspicious date and exact time for the ceremony, calculated by a pandit or astrologer from the panchang, the Hindu almanac, using the lunar day, the nakshatra and the ascendant, and often the couple's birth charts. The key ritual moment is timed to it precisely, whatever hour it falls at. It is "},{name:"Kundali matching",description:"In many families the couple's birth charts are compared (gun milan) before the engagement is fixed, scoring compatibility across a set of factors. How seriously it is taken varies from decisive to ceremonial; remedies exist within the tradition for almost every flagged mismatch, which tells you how "},{name:"The mandap",description:"The four-pillared canopy the ceremony happens under, a temporary sacred space built wherever the wedding is. The four pillars are widely read as the four parents whose care brought the couple to this day, or the four aims of life. The couple, their parents and the pandit sit within it around the fir"},{name:"Agni, the sacred fire",description:"The fire at the centre of the ceremony is the divine witness to the marriage. Offerings of ghee and herbs are made into it through the vivaha homa, and the vows and circuits all happen before it. This is why a Hindu ceremony cannot simply relocate into any venue: the fire, even a modest contained on"},{name:"The baraat and milni",description:"The groom's noisy, joyful procession to the venue, traditionally on a white horse with dhol drummers, family dancing around him. At the door the milni introduces the two families pair by pair with garlands and embraces. Strongest in North Indian and diaspora practice; most South Indian weddings welc"},{name:"Varmala (jaimala)",description:"The couple exchange fresh flower garlands as first acceptance of each other, usually to loud cheering, with each side sometimes lifting their candidate to make the other's reach comically difficult. In Bengali weddings this is mala badal, done after the subho drishti, the bride and groom's ritual fi"},{name:"Kanyadaan",description:"The bride's parents formally give their daughter's hand into the groom's, among the most emotional moments of the ceremony and traditionally counted a great act of merit for the parents. Some modern couples rework or soften it, preferring language of blessing over giving; pandits differ on how flexi"},{name:"Panigrahana and gathbandhan",description:"The groom takes the bride's hand before the fire, accepting responsibility for the life they will build, and their garments are knotted together, the gathbandhan, so they move as one for the rituals that follow. In Gujarati and Punjabi families the joining of hands is called hast milap."},{name:"Mangal pheras",description:"The couple walk in circuits around the sacred fire, garments tied, while mantras are chanted. Most North Indian traditions take seven circuits; Gujarati weddings take four, standing for dharma, artha, kama and moksha, the four aims of life. Who leads which circuits, and whether the bride's brother p"},{name:"Saptapadi, the seven steps",description:"The couple take seven steps together before the fire, each step a stated vow: nourishment, strength, prosperity, happiness, children, the seasons of life, and lifelong friendship, with wording varying by tradition. In several communities this, not the pheras, is the decisive act; Indian law agrees, "},{name:"Mangalsutra and thali",description:"The groom fastens the marriage necklace on the bride at the ritual high point: black beads and gold in most of India, guarding the marriage against ill fortune; in Tamil and Telugu weddings the thali or mangalyam is tied with three knots to a crescendo of drumming, with the third knot often tied by "},{name:"Sindoor",description:"The groom applies vermilion powder into the parting of the bride's hair, the visible mark of a married woman in much of India. In Bengali weddings the sindoor daan is the emotional peak of the ceremony, with the bride's face traditionally shielded by a new sari held over her head as it is applied."},{name:"Regional ceremony forms",description:"The core is shared; the staging differs. Tamil weddings hold the muhurtham in the morning with the oonjal swing ceremony and, in Brahmin families, the kashi yatra, where the groom feigns leaving for a life of study until the bride's father wins him back. Telugu weddings paste cumin and jaggery (jeel"},{name:"Haldi",description:"Turmeric paste applied to the couple by relatives in turn, for glow, blessing and protection before the wedding. Known as pithi in Gujarati families, gaye holud in Bengali ones where the turmeric touched to the groom is carried to the bride, and paired in the south with the mangala snanam purifying "},{name:"Mehndi",description:"The bride's hands and feet are covered in henna, with the groom's name or initials hidden in the design. Folklore says the darker the stain, the deeper the love, or the better the mother-in-law. The lawn of aunties having their own hands done is as much the point as the bridal application."},{name:"Sangeet",description:"The night of performances: choreographed dances by cousins and friends, songs teasing both families, and open dancing after. It grew from the North Indian ladies' sangeet of folk songs at home into the biggest production of many modern weddings, and it is where the two families genuinely mix before "},{name:"Joota chupai",description:"The bride's sisters and cousins steal the groom's shoes when he removes them to enter the mandap, and ransom them back with theatrical negotiation as the ceremony ends. A beloved North Indian and Punjabi game; the groom's side is honour-bound to attempt rescue, and the price is agreed with much perf"},{name:"Vidaai",description:"The bride's farewell to her family, leaving as part of a new household. In many North Indian families she throws handfuls of rice back over her head towards her parents' home in thanks for all they gave her, and there is rarely a dry eye. Modern couples who go home together that night still often ke"},{name:"Griha pravesh",description:"The bride's welcome into the groom's family home: an aarti at the door, then she tips a vessel of rice over the threshold with her right foot, abundance entering with her, and steps in right foot first. In some families she presses her hands in kumkum or steps in a red solution to leave footprints o"},{name:"Aashirvad, the blessings of elders",description:"Throughout the wedding the couple touch the feet of parents, grandparents and elder relatives, who bless them in return. It punctuates every event, and elders expect it; a couple who move through the room touching feet after the ceremony are doing the rounds every Hindu wedding requires."},{name:"Gold as blessing",description:"Gold given at a wedding is blessing, security and inheritance at once, and bridal gold is traditionally regarded as the bride's own property, her stridhan. Families often buy pieces over years for a child's wedding, and time purchases to auspicious days. The weight of gold at South Indian weddings i"},{name:"The vegetarian feast",description:"Food at the ceremony is normally fully vegetarian, cooked without beef ever and often without eggs, onion or garlic depending on the community, and many families keep the entire wedding vegetarian. This is a religious matter of purity around a sacred rite, not a menu preference, and guests broadly e"}],gotchas:["Set the muhurat before you book anything. The auspicious time can land at dawn, late evening or in the middle of the night, and the ceremony's key moment must hit it, so venue access hours, the hair and make-up start time and the whole run sheet hang off a time you do not control","Muhurat dates cluster. The panchang gives everyone the same auspicious dates, so in India venues, pandits, photographers and even flight prices spike on them, and diaspora vendors serving the community feel the same crunch. Book earlier than a Western wedding of the same size wou","Whole stretches of the calendar have no wedding dates at all: Chaturmas in many communities, adhik maas, and periods when Venus or Jupiter is combust. If your dream month falls in one, no pandit will move it, so check the year's calendar with your pandit before falling in love wi","The havan means a real fire indoors. Many Western venues refuse open flames or handle them badly; you need written permission, a fire-safe mandap setup, and smoke detectors that will not empty the building mid-ceremony. Experienced mandap companies manage this with the venue, whi","A Hindu ceremony in England and Wales usually has no legal effect on its own, because most hotels and marquees are not registered for marriage. Couples who skip the civil step are legally unmarried, which surfaces years later in property, inheritance and visa problems. Decide the","In India, registration alone does not make a marriage: courts have held that a registered marriage without the actual ceremonies is not valid, and equally that the certificate, not the wedding album, is what officials accept as proof. You need both the rites and the registration.","The ceremony runs ninety minutes to three hours and guests treat it accordingly: coming and going, chatting at the back, watching the key moments. Guests from other backgrounds will not know this is normal. A printed program, or a pandit or emcee who explains as it goes, transfor","Vegetarian catering is a competence, not a menu toggle. A venue's in-house caterer who 'can do Indian' is the most common catering disappointment; most families bring in an Indian caterer or choose venues that allow one. Check whether eggs count as vegetarian for your families, a","If any event is at a temple, the premises rules are absolute: vegetarian only, no alcohol, often including the car park, and modest dress. Do not plan a champagne toast anywhere near the temple hall.","Alcohol expectations differ between families more than almost anything else. One side may assume an open bar at the sangeet, the other may be dry on religious grounds. Settle it between the parents early, event by event, before contracts are signed.","The baraat always runs late. Dhol players, dancing relatives and a horse do not move to schedule, so build thirty to sixty minutes of slack between the baraat's start and the muhurat, and tell the photographer where it will pause. Street processions and horses may also need counc","Guest counts behave differently: parents hold real invitation power, invitations go to households not individuals, and the reception list often exceeds the ceremony list. Expect the list to grow after you 'finalise' it, and cater with a buffer rather than an exact count.","Outfit lead times are long. Made-to-order lehengas and sherwanis from India need months, plus shipping, customs and alteration rounds, and a buying trip to India is itself a scheduling event. Order early and plan fittings close to the wedding, since heavy outfits need final adjus","Bridal mehndi takes three to eight hours and the stain needs a day to deepen, which locks the bride's diary a day or two before the wedding. Nothing else that needs her hands, including final errands, can share that day.","Gold prices move. Families budgeting jewellery as one late purchase get caught by a rising market; buying over months spreads the risk. Insure the jewellery for the events themselves, when large amounts are worn, carried and set down in busy venues.","Traditionally the bride's family hosted the wedding and the groom's the reception, but modern couples split costs every possible way. The split is the single most common source of inter-family friction, so agree it explicitly, event by event, at the start.","Pandits get booked like venues, on the same clustered dates. In the diaspora especially, book the pandit when you book the venue, confirm the language mix, whether he will explain rituals in English, and exactly which rituals your ceremony will include, since a full ceremony and ","The decisive ritual moments, the mangalsutra, the sindoor, the seventh step, each last seconds and happen low to the ground surrounded by seated family. A photographer who has never shot a Hindu wedding will miss them. Ask to see full Hindu wedding galleries, not portfolio highli"]},jewish:{id:"jewish",name:"Jewish",shortName:"Jewish",faithGroup:"Jewish",blurb:"Signing the ketubah, the bedeken, standing together under the chuppah for the sheva brachot and the breaking of the glass, then the hora — with the aufruf before and, in traditional communities, a week of festive meals after.",typicalGuests:{low:80,typical:180,high:500},terms:{officiant:"rabbi",ceremonyVenue:"chuppah venue",ceremony:"the chuppah",bestMan:"best man",maidOfHonour:"maid of honour",reception:"reception",firstDance:"hora",witnesses:"eidim"},events:[{id:"engagement",name:"Engagement party (vort or tenaim)",when:"Six to eighteen months before",optional:!0,default:!1,description:"In many Orthodox communities the engagement is marked with a vort, a gathering with short speeches, or a tenaim ceremony where the two families formally agree to the match and the mothers break a plate. Many families now sign the tenaim on "},{id:"henna",name:"Henna night",when:"In the week before",optional:!0,default:!1,description:"A pre-wedding celebration from Sephardi and Mizrahi communities, especially those with roots in Morocco, Yemen, Iraq, Iran and elsewhere in the Middle East and North Africa. Henna paste is applied to the hands of the couple and guests, the "},{id:"aufruf",name:"Aufruf and Shabbat kallah",when:"The Shabbat before, or the one before that",optional:!0,default:!0,description:"The groom, or in egalitarian communities the couple together, is called up to the Torah in synagogue and the congregation sings and throws soft sweets. The family usually sponsors the kiddush afterwards. In communities where the couple do n"},{id:"mikveh",name:"Mikveh immersion",when:"In the days before",optional:!0,default:!0,description:"The bride immerses in the mikveh, the ritual bath, in the days before the wedding, with a preparation appointment and an attendant present. In traditional practice this is required rather than optional, and the wedding date is often set wit"},{id:"civil-ceremony",name:"Civil
