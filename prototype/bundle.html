 ceremony or registration",when:"Before or on the wedding day, depending on country",optional:!0,default:!1,description:"Whether you need a separate civil step depends on the country. In England and Wales the religious ceremony can be legally binding after civil preliminaries, with the synagogue's secretary for marriages registering it. In the United States, "},{id:"tisch",name:"Kabbalat panim and the tisch",when:"Wedding day, before the ceremony",optional:!0,default:!0,description:"Two receptions before the ceremony. At the kabbalat panim the bride is greeted and blessed by guests; at the groom's tisch there is singing, a word of Torah that friends traditionally interrupt, and the signing of the ketubah in front of th"},{id:"ceremony",name:"The chuppah",when:"Wedding day",optional:!1,default:!0,description:"The ceremony under the wedding canopy joins what were historically two separate ceremonies. Kiddushin, the betrothal: a blessing over wine and the giving of the ring with the words 'Harei at mekudeshet li' before two witnesses. Then the ket"},{id:"yichud",name:"Yichud",when:"Straight after the ceremony",optional:!0,default:!0,description:"The couple withdraw to a private room for a short time alone, with the door watched by two witnesses in Orthodox practice. If they have been fasting they break the fast together here. It is a required part of the marriage in Ashkenazi Ortho"},{id:"reception",name:"The reception (seudat mitzvah)",when:"Wedding day",optional:!1,default:!0,description:"The wedding meal is a seudat mitzvah, a religious celebration in its own right, and gladdening the couple is considered a mitzvah for every guest. Expect the hora early rather than late, with the couple lifted on chairs, and at Orthodox wed"},{id:"sheva-brachot-week",name:"The week of sheva brachot",when:"The seven days after",optional:!0,default:!1,description:"In traditional communities, friends and family host festive meals for the couple on each of the seven nights after the wedding, ending with the seven blessings again. Each meal needs a minyan and, apart from Shabbat, at least one guest who "}],items:[{id:"rabbi-fee",name:"Rabbi's fee",section:"Ceremony",event:"ceremony",note:"The officiant's fee or honorarium, usually covering the preparation meetings as well as the day. If your rabbi is travelling to the venue, cover travel, and accommodation if the wedding runs close to ",essential:!0,share:.015,supplier:"Synagogue",religious:!0},{id:"cantor-fee",name:"Cantor (chazan)",section:"Ceremony",event:"ceremony",note:"Many couples have a cantor sing the blessings under the chuppah, particularly the sheva brachot. Optional if your rabbi sings, or if you are giving the blessings to friends and relatives as honours.",essential:!1,share:.008,supplier:"Synagogue",religious:!1},{id:"synagogue-fee",name:"Synagogue or ceremony venue fee",section:"Ceremony",event:"ceremony",note:"A chuppah can stand anywhere — synagogue, hotel, garden or hall — so this is the fee for wherever the ceremony happens. Synagogues usually charge less for members, and in the United Kingdom the offici",essential:!0,share:.012,supplier:"Synagogue",religious:!1},{id:"marriage-authorisation",name:"Religious marriage authorisation fees",section:"Ceremony",event:"",note:"Orthodox marriages generally need formal authorisation before the wedding: in the United Kingdom from the Office of the Chief Rabbi (or the equivalent body for your community), in Israel by opening a ",essential:!0,share:.003,supplier:"Synagogue",religious:!0},{id:"civil-fees",name:"Civil notice and registration fees",section:"Ceremony",event:"civil-ceremony",note:"The state's fees: notice of marriage at the register office in England and Wales, the marriage licence in the United States and Canada, the Notice of Intended Marriage in Australia, the town-hall cere",essential:!0,share:.003,supplier:"Registrar",religious:!1},{id:"ketubah",name:"Ketubah",section:"Ceremony",event:"ceremony",note:"The marriage document itself, signed before the ceremony and read under the chuppah, is often commissioned as artwork to hang at home for life. Prices run from a printed text to hand-painted calligrap",essential:!0,share:.007,supplier:"Judaica",religious:!0},{id:"ceremony-wine-glass",name:"Kiddush cups, wine and the glass to break",section:"Ceremony",event:"ceremony",note:"Two cups of kosher wine are blessed under the chuppah, one for the betrothal and one for the seven blessings. Families often lend heirloom kiddush cups. You also need the glass to break, wrapped in cl",essential:!0,share:.002,supplier:"Judaica",religious:!0},{id:"kippot",name:"Kippot for guests",section:"Ceremony",event:"ceremony",note:"Personalised kippot (skullcaps) printed with your names and the date, offered in a basket for guests to wear. Order per guest with plenty spare; they double as a favour. Less expected at secular cerem",essential:!1,share:.004,supplier:"Judaica",religious:!1},{id:"mikveh-fee",name:"Mikveh fees",section:"Ceremony",event:"mikveh",note:"The immersion appointment, usually with a preparation room and attendant. Some communities also expect the groom to immerse, often at a men's session. A modest fee, but book it early because the timin",essential:!1,share:.001,supplier:"Mikveh",religious:!1},{id:"aufruf-kiddush",name:"Aufruf kiddush",section:"Ceremony",event:"aufruf",note:"Sponsoring the kiddush, the refreshments after the Shabbat morning service, when the groom or couple is called to the Torah. Ranges from wine and cake to a full lunch. The soft sweets thrown in the sy",essential:!1,share:.006,supplier:"Synagogue",religious:!1},{id:"chuppah-hire",name:"Chuppah hire or build",section:"Flowers & Styling",event:"ceremony",note:"The canopy itself: four poles and a covering, open on all four sides. Florists and venues hire structures from simple to elaborate, but a tallit (prayer shawl) held on four poles by friends is complet",essential:!0,share:.014,supplier:"Florist",religious:!0},{id:"chuppah-flowers",name:"Chuppah and ceremony flowers",section:"Flowers & Styling",event:"ceremony",note:"Dressing the chuppah is the main floral moment of the ceremony, and a flower-covered chuppah is one of the bigger single floral items on the market. Aisle and entrance arrangements are the same as at ",essential:!0,share:.018,supplier:"Florist",religious:!1},{id:"reception-styling",name:"Table centrepieces and reception styling",section:"Flowers & Styling",event:"reception",note:"Centrepieces, linen and room styling, priced per table. If there will be energetic circle dancing, keep the dance floor clear of anything that can be knocked over and ask the florist to weight tall ar",essential:!0,share:.03,supplier:"Florist",religious:!1},{id:"bouquets",name:"Bouquets and buttonholes",section:"Flowers & Styling",event:"ceremony",note:"Bouquet for the bride, buttonholes for the groom, fathers and grandfathers, corsages for the mothers. Standard wedding florals with no particular religious rules attached.",essential:!0,share:.007,supplier:"Florist",religious:!1},{id:"venue-hire",name:"Reception venue hire",section:"Reception",event:"reception",note:"If you need fully kosher catering, the venue question comes first: some venues have kosher kitchens or are on a community's approved list, others must be koshered for the day or allow an outside koshe",essential:!0,share:.105,supplier:"Venue",religious:!1},{id:"catering",name:"Catering",section:"Reception",event:"reception",note:"The largest line. Fully supervised kosher catering costs noticeably more per head than standard catering: a restricted supplier pool, supervision, and koshering or bringing in equipment all add cost. ",essential:!0,share:.26,supplier:"Caterer",religious:!1},{id:"kashrut-supervision",name:"Kashrut supervision (mashgiach)",section:"Reception",event:"reception",note:"Fully kosher events need a mashgiach, the supervisor licensed by a kashrut authority who oversees the kitchen on the day. Sometimes included in the caterer's price, sometimes billed separately, plus t",essential:!1,share:.008,supplier:"Caterer",religious:!1},{id:"drinks",name:"Drinks and kosher wine",section:"Reception",event:"reception",note:"At a supervised event all wine and grape products must be kosher, and many authorities expect mevushal wine when waiting staff are not observant Jews, so agree the wine list with the caterer or superv",essential:!0,share:.06,supplier:"Caterer",religious:!1},{id:"cake",name:"Wedding cake and desserts",section:"Reception",event:"reception",note:"After a kosher meat meal the cake must be parev — made without dairy — which rules out buttercream and many standard recipes, so use a kosher baker or confirm your baker can work parev under supervisi",essential:!0,share:.015,supplier:"Cake maker",religious:!1},{id:"service-staffing",name:"Service charge and staffing",section:"Reception",event:"reception",note:"Waiting and bar staff, corkage and cake-cutting fees. Kosher caterers working in a non-kosher venue often bring their own equipment and extra staff, which shows up here.",essential:!0,share:.012,supplier:"Caterer",religious:!1},{id:"sheva-brachot-hosting",name:"Sheva brachot meals contribution",section:"Reception",event:"sheva-brachot-week",note:"The week of festive meals is traditionally hosted and paid for by friends and family rather than the couple, but many couples contribute to the bigger nights or host the final one. Only relevant if yo",essential:!1,share:.008,supplier:"Caterer",religious:!1},{id:"band",name:"Live band",section:"Music & Entertainment",event:"reception",note:"The band makes or breaks the hora, so book one that knows Jewish weddings: the standard simcha repertoire, when to strike up as you enter from yichud, and how to keep a twenty-minute dance set going. ",essential:!0,share:.055,supplier:"Band",religious:!1},{id:"dj",name:"DJ",section:"Music & Entertainment",event:"reception",note:"Instead of or alongside the band, often taking the later part of the night. Give them the same briefing on the hora set and any Hebrew or Israeli must-plays.",essential:!1,share:.016,supplier:"DJ",religious:!1},{id:"ceremony-music",name:"Ceremony musicians",section:"Music & Entertainment",event:"ceremony",note:"Music for the processional and under the chuppah — a string ensemble, a singer, or the band's acoustic players. Traditional processional pieces exist but there is no fixed liturgy for the walk in, so ",essential:!1,share:.008,supplier:"Band",religious:!1},{id:"shtick",name:"Shtick and dancing props",section:"Music & Entertainment",event:"reception",note:"At traditional weddings guests entertain the couple during the dancing — juggling, signs, masks, jump ropes, costumes — known as shtick. Families often buy a box of props in advance. Inexpensive and h",essential:!1,share:.003,supplier:"Entertainment",religious:!1},{id:"photographer",name:"Photographer",section:"Photos & Film",event:"",note:"Book someone who knows the running order: the ketubah signing, bedeken, glass and hora are fast, one-off moments. If you are not seeing each other before the bedeken there is no 'first look', so portr",essential:!0,share:.055,supplier:"Photographer",religious:!1},{id:"videographer",name:"Videographer",section:"Photos & Film",event:"",note:"The moments couples most regret losing are the bedeken, the sheva brachot being sung, the glass and the first hora set. Brief them on where the witnesses and rabbi will stand so the ring moment is not",essential:!1,share:.035,supplier:"Videographer",religious:!1},{id:"album",name:"Album and prints",section:"Photos & Film",event:"",note:"Usually ordered after the wedding, with copies for both sets of parents. The signed ketubah photographed well is a favourite opening page.",essential:!1,share:.007,supplier:"Photographer",religious:!1},{id:"gown",name:"Wedding dress",section:"Attire",event:"",note:"In Orthodox settings dresses are modest by convention — shoulders and often collarbone covered, sometimes with a detachable topper for the ceremony that comes off for dancing. Elsewhere anything goes.",essential:!0,share:.055,supplier:"Bridal shop",religious:!1},{id:"bridal-accessories",name:"Veil, shoes and accessories",section:"Attire",event:"",note:"The veil matters more than usual because of the bedeken, where the groom lowers it over the bride's face before the ceremony — choose one that can actually be lowered and lifted. Comfortable shoes or ",essential:!0,share:.01,supplier:"Bridal shop",religious:!1},{id:"groom-outfit",name:"Groom's outfit and kittel",section:"Attire",event:"",note:"Suit or, in more formal communities, a dark suit or frock coat. Many Ashkenazi grooms wear a kittel, a simple white robe, over the suit under the chuppah — often borrowed or a family one rather than b",essential:!0,share:.018,supplier:"Menswear",religious:!1},{id:"party-attire",name:"Wedding party outfits",section:"Attire",event:"",note:"Bridesmaids and groomsmen are a modern addition rather than a Jewish requirement; the traditional escorts are the parents, who walk each of you down the aisle. Whether the couple pays for outfits foll",essential:!1,share:.008,supplier:"Bridal shop",religious:!1},{id:"hair-makeup",name:"Hair and make-up",section:"Beauty",event:"",note:"Timed around the kabbalat panim rather than the ceremony, since you are receiving guests and being photographed an hour or more before the chuppah. Book the trial well ahead. If the bride is immersing",essential:!0,share:.016,supplier:"Hair and make-up",religious:!1},{id:"invitations",name:"Invitations",section:"Stationery",event:"",note:"Traditionally printed with the Hebrew date alongside the civil one, and often with Hebrew text on one side or one panel. Both sets of parents are conventionally named as hosts. Check the Hebrew spelli",essential:!0,share:.015,supplier:"Stationer",religious:!1},{id:"benchers-programs",name:"Benchers and order of service",section:"Stationery",event:"reception",note:"Benchers (birkonim) are booklets with Grace after Meals and the sheva brachot, printed with your names and date, one per guest or per couple, taken home as a keepsake. An order-of-service sheet explai",essential:!1,share:.005,supplier:"Stationer",religious:!1},{id:"favours",name:"Favours",section:"Stationery",event:"reception",note:"No fixed Jewish tradition here — kippot and benchers often serve as the favours. Some couples give a donation to charity in guests' names instead, in the spirit of tzedakah.",essential:!1,share:.005,supplier:"Stationer",religious:!1},{id:"wedding-cars",name:"Wedding cars",section:"Transport",event:"ceremony",note:"Standard wedding transport. If any of the wedding events touch Shabbat — an aufruf lunch, a Saturday night ceremony — observant guests will not drive until Shabbat ends, which affects timings more tha",essential:!1,share:.008,supplier:"Car hire",religious:!1},{id:"guest-transport",name:"Guest transport",section:"Transport",event:"reception",note:"Coaches are worth it when the ceremony and reception are apart, or for a Saturday night wedding ending very late. For guests walking to a Shabbat-adjacent event, check the venue is within walking dist",essential:!1,share:.006,supplier:"Coach hire",religious:!1},{id:"rings",name:"Wedding rings",section:"Rings & Gifts",event:"ceremony",note:"The ring given under the chuppah is traditionally a plain metal band with no stones, owned outright by the giver, placed on the right index finger before the witnesses. Engagement rings with stones ar",essential:!0,share:.025,supplier:"Jeweller",religious:!0},{id:"gifts",name:"Gifts for parents, honourees and each other",section:"Rings & Gifts",event:"",note:"Small gifts for those given honours — the sheva brachot reciters, the chuppah holders, the witnesses — plus parents and each other. Judaica such as a kiddush cup or candlesticks is the conventional ch",essential:!1,share:.006,supplier:"Gifts",religious:!1},{id:"planner",name:"Wedding planner or coordinator",section:"Extras",event:"",note:"Useful for any large wedding, and particularly for kosher logistics in a non-kosher venue, Saturday night turnarounds, or an Israel wedding planned from abroad. Choose someone who has actually run the",essential:!1,share:.025,supplier:"Planner",religious:!1},{id:"henna-party",name:"Henna night",section:"Extras",event:"henna",note:"For Sephardi and Mizrahi families: the henna artist, traditional costumes (often hired), sweets, music and a venue or a family home. Scales from an evening at home to a second full event, especially i",essential:!1,share:.01,supplier:"Entertainment",religious:!1},{id:"security",name:"Security",section:"Extras",event:"",note:"Many Jewish communal venues, especially in Europe, use trained security at large events as standard, sometimes arranged through communal security bodies. Some synagogues include it in the venue fee; p",essential:!1,share:.006,supplier:"Security",religious:!1},{id:"tzedakah",name:"Tzedakah (charitable giving)",section:"Extras",event:"",note:"Giving to charity in connection with the wedding is a widespread custom across all streams — a donation on the day, a percentage of the budget, or leftover food to a food charity. Entirely voluntary, ",essential:!1,share:.004,supplier:"Charity",religious:!1}],timeline:[{mb:12,task:"Check dates against the Jewish calendar before booking anything: no weddings on Shabbat or festivals, and most of the Omer and the Three Weeks are closed in traditional practice — ask your rabbi exactly which days your community permits",critical:!0},{mb:12,task:"Choose your officiant and stream early — Orthodox, Conservative/Masorti, Reform/Liberal or a secular celebrant — because it determines the paperwork, the ketubah text, the venue options and, for mixed-faith couples, who will marry you at all",critical:!0},{mb:12,task:"Book the rabbi and the ceremony venue together, and confirm the date is in the synagogue diary",critical:!0},{mb:11,task:"If either of you was previously married in a Jewish ceremony, start the get (religious divorce) now — Orthodox and Conservative rabbis cannot marry you without it, and it takes months",critical:!0},{mb:11,task:"Gather proof of Jewish status for an Orthodox marriage: parents' ketubah, a letter from a recognised rabbi, or conversion certificates — records held abroad can take a long time to obtain",critical:!0},{mb:11,task:"Book the reception venue, checking kosher catering arrangements, dance floor size for the hora, and a private room for yichud",critical:!0},{mb:10,task:"Book the kosher caterer, or agree with the venue how the kitchen will be supervised or koshered — the approved-caterer list for your kashrut authority narrows the field, so move early",critical:!0},{mb:10,task:"Book the band, photographer and videographer, briefing them on the tisch, bedeken, chuppah and hora running order",critical:!1},{mb:9,task:"Apply for religious marriage authorisation: through the Office of the Chief Rabbi in the United Kingdom, your movement's equivalent elsewhere, or by planning the Rabbinate marriage file if marrying in Israel",critical:!0},{mb:8,task:"Order the ketubah, agreeing the exact text with your rabbi before the artist starts — commissioned pieces take weeks to months",critical:!0},{mb:7,task:"Arrange the chuppah: hire one, ask the synagogue about theirs, or plan to use a family tallit on poles held by friends",critical:!1},{mb:7,task:"Begin marriage preparation with your rabbi — most movements expect a few meetings, and Orthodox communities run chatan and kallah classes",critical:!0},{mb:6,task:"Choose the two witnesses (eidim) with your rabbi's guidance — in Orthodox practice they must be religiously observant Jewish men unrelated to either of you or to each other, so do not assume close family can do it",critical:!0},{mb:6,task:"Order invitations with the Hebrew date, and confirm the Hebrew spelling of both your names and your parents' Hebrew names — the same details go on the ketubah",critical:!1},{mb:5,task:"Decide who receives honours: sheva brachot reciters, chuppah pole holders, ketubah reader — traditional weddings have many honours to give, which is a gift to both families",critical:!1},{mb:4,task:"Order kippot and benchers printed with your names and the date",critical:!1},{mb:4,task:"Buy the wedding band — a plain metal ring with no stones for the ceremony, owned by the giver — and a second one if you are doing a double-ring exchange",critical:!1},{mb:3,task:"Complete civil preliminaries: give notice at the register office in England and Wales, lodge the Notice of Intended Marriage in Australia, or diarise the marriage licence window in the United States and Canada",critical:!0},{mb:3,task:"Arrange the aufruf with your synagogue and book the kiddush",critical:!1},{mb:2,task:"Book the mikveh appointment for the days before the wedding, and a men's session for the groom if he is immersing",critical:!1},{mb:2,task:"Finalise the menu with the caterer and kashrut supervisor, remembering a meat meal means a parev dessert and cake",critical:!1},{mb:2,task:"If keeping the week of sheva brachot, line up hosts for each night and warn them about the panim chadashot — each meal needs a guest who was not at the wedding",critical:!1},{mb:1,task:"Walk through the ceremony with your rabbi: the ketubah signing, the bedeken, who walks with whom, circling, the ring declaration and the glass",critical:!0},{mb:1,task:"Confirm timings for a Shabbat-adjacent date: a Saturday night wedding cannot start until Shabbat ends, which in summer is very late — check havdalah time, supplier overtime and venue closing",critical:!0},{mb:1,task:"Arrange the yichud room with the venue, including food and drink to break the wedding-day fast if you are fasting",critical:!1},{mb:0,task:"Bring the ketubah, the ring, the wrapped glass, the kiddush cups and wine, and the kittel if wearing one — give one person the job of having them all at the venue",critical:!0},{mb:0,task:"After the wedding, make sure the marriage is civilly registered: the synagogue's secretary for marriages files it in England and Wales, the officiant returns the licence in North America, and the Rabbinate issues the certificate in Israel — confirm it has actually been done",critical:!0}],paperwork:[{item:"Proof of Jewish status",who:"Both, for Orthodox and Conservative marriages",note:"Typically your parents' ketubah, your own or a parent's synagogue marriage record, or a letter from a recognised rabbi. Orthodox authorities follow matrilineal descent or an Orthodox conversion; Conservative similarly. R"},{item:"Religious marriage authorisation",who:"Both",note:"In the United Kingdom, Orthodox marriages require authorisation from the Office of the Chief Rabbi (or the relevant authority for Sephardi, Federation, Masorti, Reform or Liberal communities), with a document meeting and"},{item:"Civil marriage licence or notice",who:"Both",note:"Varies entirely by country. England and Wales: notice at the register office at least 29 days before (longer for some nationalities). United States and Canada: a state or provincial licence, signed by the rabbi. Australi"},{item:"Ketubah",who:"Both",note:"Signed by the two witnesses just before the ceremony, read under the chuppah, and kept by the couple — traditionally in the wife's keeping, since it records obligations towards her. The text must match your officiant's r"},{item:"Get (religious divorce) from any previous Jewish marriage",who:"Either party previously married",note:"A civil divorce is not sufficient for Orthodox or Conservative remarriage; a get from a recognised beit din is required and can take months. British Reform operates its own beit din and also requires a get; American Refo"},{item:"Conversion certificate",who:"Either party who converted",note:"Recognition varies sharply by movement: Orthodox authorities accept only conversions under recognised Orthodox auspices, while Conservative, Reform and Liberal communities accept their own and often each other's. If you "},{item:"Civil divorce decree or death certificate of a former spouse",who:"Either party previously married or widowed",note:"The final decree, not the provisional one, for the civil authorities — needed alongside, not instead of, the get where a get applies."},{item:"Birth certificates and passports",who:"Both",note:"For the civil preliminaries, and for the Rabbinate in Israel, which may also ask for parents' documents when checking status."},{item:"Tenaim (engagement contract)",who:"Both, optional",note:"A traditional document formalising the engagement, still used in many Orthodox communities and often signed at the wedding itself, marked by the mothers breaking a plate. Not a legal requirement anywhere; most non-Orthod"},{item:"Marriage schedule and registration (England and Wales)",who:"Both",note:"Jewish marriages have a distinct legal route under the Marriage Act: after civil notice, the marriage can be solemnised 'according to the usages of the Jews' at any location, and the synagogue's appointed secretary for m"},{item:"Rabbinate marriage file (Israel)",who:"Both, if marrying in Israel",note:"There is no civil marriage in Israel: a legally recognised Jewish wedding must go through the Chief Rabbinate, which requires proof of Jewish status to Orthodox standards, proof you are unmarried, and details of the kosh"},{item:"Officiant's civil authority to solemnise",who:"The officiant",note:"In the United States, Canada and Australia the rabbi normally acts for the state too, but registration rules vary by state, province and even city, so confirm your rabbi is authorised where you are marrying — especially "},{item:"Kashrut certification for the reception",who:"The couple, via caterer and venue",note:"Where the wedding is under Orthodox auspices, the reception is usually expected to be supervised by a recognised kashrut authority — the United Synagogue requires this in Britain, and the Israeli Rabbinate asks about the"}],customs:[{name:"The ketubah",description:"The Jewish marriage document, some two thousand years old as a form, traditionally written in Aramaic and recording the husband's obligations to his wife. It is signed by two witnesses before the ceremony and read aloud under the chuppah. Conservative ketubot often add the Lieberman clause, agreeing"},{name:"The chuppah",description:"The four-posted canopy, open on all sides, under which the ceremony happens. It stands for the home the couple will build: open like Abraham and Sarah's tent, sheltered above. It can be a florist's structure or a family tallit on four poles held by friends, and Ashkenazi custom favours placing it un"},{name:"Kiddushin and nisuin: the two ceremonies",description:"A Jewish wedding is historically two ceremonies. Kiddushin (also called erusin), the betrothal, is effected when the ring is given and accepted before witnesses; nisuin, the marriage proper, is the seven blessings and the couple's first moments together. For around a thousand years the two have been"},{name:"The ring and the declaration",description:"The ring is a plain band without stones, owned by the giver, placed on the recipient's right index finger with the declaration 'Harei at mekudeshet li b'taba'at zo k'dat Moshe v'Yisrael' — 'By this ring you are consecrated to me according to the law of Moses and Israel' — in front of the two witness"},{name:"The bedeken",description:"Before the ceremony the groom, accompanied by singing and dancing, lowers the veil over the bride's face. The custom recalls Rebecca veiling herself on meeting Isaac, and is often explained as the groom confirming he is marrying the right person — unlike Jacob, who wasn't. Parents commonly bless the"},{name:"Kabbalat panim and the tisch",description:"The pre-ceremony receptions: the bride enthroned among her guests at the kabbalat panim, the groom at his tisch with song, drink and an attempted Torah discourse that friends traditionally drown out. The ketubah is signed here. Many egalitarian couples hold one combined tisch or each hold their own "},{name:"Circling",description:"In Ashkenazi custom the bride circles the groom, traditionally seven times, on arriving under the chuppah — variously explained as building the walls of their new home or a protective circle. Many contemporary couples across all streams circle each other, three times each and one together, or omit i"},{name:"The sheva brachot",description:"The seven blessings sung over wine that form the heart of nisuin, moving from the creation of the world to the joy of this particular couple, ending with the voice of joy and gladness, the voice of the groom and the voice of the bride. Distributing them among honoured relatives, friends and teachers"},{name:"Breaking the glass",description:"At the end of the ceremony a glass, wrapped for safety, is broken underfoot and everyone calls 'Mazal tov!'. The classic explanation is remembering the destruction of the Temple in Jerusalem at the height of joy; others hear it as a reminder of the world's brokenness or of love's fragility. Traditio"},{name:"Yichud",description:"Straight after the chuppah the couple spend a short time completely alone in a private room — in Orthodox practice a formal part of the marriage, with witnesses at the door. It is where a fasting couple break their fast, and for everyone it is a rare quiet moment on a loud day. Standard in Ashkenazi"},{name:"The hora and gladdening the couple",description:"The circle dance to 'Hava Nagila' and the simcha repertoire, with the couple lifted on chairs at the centre, often holding a napkin or handkerchief between them. Making the couple rejoice is counted a mitzvah, which is why guests perform, juggle and hold up signs (shtick) rather than just dancing. A"},{name:"The aufruf",description:"On a Shabbat before the wedding the groom — or the couple together in egalitarian communities — is called up to the Torah, and the congregation sings and throws soft sweets for a sweet life. A kiddush follows. In Sephardi custom the celebratory aliyah traditionally comes on the Shabbat after the wed"},{name:"Mikveh before the wedding",description:"The bride immerses in the ritual bath in the days before the wedding — in traditional practice a requirement, timed carefully, and treated as a private and moving threshold moment. Many grooms immerse too as a custom. Non-Orthodox movements have warmly reclaimed pre-wedding immersion as spiritual pr"},{name:"Fasting on the wedding day",description:"Ashkenazi custom treats the wedding day as a personal Yom Kippur: the couple fast from dawn until they break the fast together after the ceremony, and the groom's tisch and the quiet of the day carry some of that solemnity. Sephardi practice generally does not include fasting, and the fast is waived"},{name:"The kittel",description:"Many Ashkenazi grooms wear a kittel, the simple white robe also worn on Yom Kippur, over their suit under the chuppah — white for purity and a clean slate, and a quiet reminder of mortality at the moment of greatest joy. The bride's white dress is often given the same explanation."},{name:"Not seeing each other beforehand",description:"In traditional Ashkenazi practice the couple do not see each other for the week before the wedding, meeting again only at the bedeken, which gives that moment its charge. Many couples keep just the wedding day itself, or only the hour before; others skip the custom entirely and do a first look for p"},{name:"The week of sheva brachot",description:"For seven days after the wedding, traditional communities feast the couple: a festive meal each evening hosted by different friends or relatives, ending with the seven blessings sung again over wine. Each gathering needs a minyan and, except on Shabbat, panim chadashot — a new face, someone who was "},{name:"Henna night",description:"Sephardi and Mizrahi families, particularly of Moroccan, Yemenite, Iraqi and Persian heritage, hold a henna celebration in the week before the wedding: henna paste pressed into the palms of the couple and guests for blessing and protection, traditional costume, songs and tables of sweets. It has had"},{name:"Breaking a plate at the tenaim",description:"When the tenaim, the engagement conditions, are signed — historically at the engagement, now often on the wedding day — the two mothers break a china plate together. Like the glass at the ceremony's end, an unrepairable break marks an unrepealable commitment. Kept mainly in Orthodox and traditional "},{name:"The mezinke",description:"An Ashkenazi folk custom from the klezmer tradition: when parents marry off their last child, they are seated in the middle of the dance floor, crowned with flowers, and the guests dance around them to the tune 'Di Mezinke Oysgegebn'. A lovely thing to warn your band about in advance if it applies."},{name:"Auspicious and avoided days",description:"Tuesday is traditionally considered a lucky day to marry, because in the creation story God says 'it was good' twice on the third day. Many communities also favour Rosh Chodesh, the new month. These are customs rather than law — unlike Shabbat, festivals and the mourning seasons, which are genuine c"},{name:"Egalitarian and same-sex adaptations",description:"Reform, Liberal, Reconstructionist and, since 2012, Conservative movements offer marriage ceremonies for same-sex couples, adapting the ketubah, the ring declarations and rituals like the bedeken and circling. Many opposite-sex couples in these movements use the same egalitarian forms — double rings"}],gotchas:["Check the Jewish calendar before you fall in love with a date. Shabbat (Friday sundown to Saturday nightfall), festivals and their eves are closed in all traditional practice, and two mourning seasons — roughly a month of the Omer in spring and the Three Weeks in high summer — cl","Omer observance varies widely. Traditional practice keeps around 33 days of the period between Pesach and Shavuot wedding-free, but which days are open — Lag BaOmer, Rosh Chodesh, before or after — differs by community, Ashkenazi and Sephardi custom, and movement. Conservative ru","The Three Weeks (17 Tammuz to Tisha B'Av, usually July into August) fall exactly in peak wedding season. Ashkenazi Orthodox practice holds no weddings for the whole period; Sephardi custom is often stricter only from the start of Av; Conservative authorities permit ceremonies unt","A Saturday night wedding cannot start until Shabbat ends at nightfall, which in northern-hemisphere summer can be after ten o'clock. Saturday night dates work beautifully in winter and are brutal in June — check the havdalah time for your date before booking anything.","Friday weddings must finish with everyone home before Shabbat starts at sundown, which is why observant communities rarely use them outside winter or Israel, where a Friday afternoon chuppah before an early Shabbat-eve dinner is common.","Fully kosher catering restricts your venue as much as your menu. Many venues cannot host a supervised kosher caterer, or charge heavily for koshering the kitchen; communities keep approved lists. Decide between fully supervised kosher and 'kosher-style' before booking the venue, ","A kosher meat meal means no dairy anywhere: no butter on the table, no cream sauces, no cheese course, and a parev wedding cake. Also budget for the mashgiach (supervisor) and remember that all wine and grape juice must be kosher — with mevushal wine expected by many authorities ","The legal status of the religious ceremony varies by country. In England and Wales the chuppah can itself be legally binding after register-office notice, through the synagogue's secretary for marriages, and uniquely can be held anywhere. In the United States, Canada and Australi","In Israel there is no civil marriage. State-recognised Jewish weddings go through the Orthodox Rabbinate only, with proof of Jewish status to Orthodox standards; Reform, Conservative and secular ceremonies in Israel are not state-recognised, and mixed-faith and same-sex couples c","Proof of Jewish status can take longer than any other document. Orthodox authorisation typically wants your parents' ketubah or a letter from a recognised rabbi, and tracing records from another country — or from grandparents who fled one — can take months. Converts should raise ","A civil divorce is not a Jewish divorce. If either of you was previously married in a Jewish ceremony, Orthodox and Conservative rabbis — and the British Reform beit din — require a get before remarriage, and obtaining one can be slow, especially if the former spouse is uncoopera","The witnesses are a halachic requirement, not an honour to hand out freely. In Orthodox practice the two eidim must be observant Jewish men who are not related to either of you or to each other — which usually rules out fathers and brothers. Conservative and Reform communities ar","Interfaith couples should ask the officiating question first, not last. Orthodox and Conservative rabbis will not officiate at a marriage between a Jew and a non-Jew; policies among Reform and Liberal rabbis range from full officiation to blessings with conditions, and in Britain","The ceremony ring should be a plain band with no stones, owned outright by the giver — buying it on credit or borrowing it can technically invalidate the kiddushin in Orthodox eyes. The diamond engagement ring goes back on after the ceremony; it just isn't used under the chuppah.","If you are fasting on the wedding day, plan for it: no drinks at the kabbalat panim for the couple, a first bite in the yichud room, and a schedule that doesn't leave a fasting couple standing for photographs for three hours. Sephardi couples generally don't fast, and on certain ","The ketubah needs everyone's Hebrew names — yours and usually your parents' — with correct spellings, and the document is filled in and signed on the day. Get the names checked by your rabbi weeks early, and appoint someone to bring the ketubah, the ring and the wrapped glass to ","At an Orthodox wedding, tell the band and venue about separate dancing early: two circles need a bigger dance floor than one, and a mechitza needs setting up. Guests unfamiliar with the custom appreciate a line about it in the invitation or order of service.","An aufruf is a Shabbat event, so there is no photography and observant guests will not drive — keep it walkable and unplugged, and don't schedule the photographer.","If you are keeping the week of sheva brachot, the couple's diary is full for seven nights, which surprises couples planning a honeymoon departure the morning after the wedding. Traditional couples often delay the honeymoon a week; others hold one sheva brachot dinner and leave."]},civil:{id:"civil",name:"Civil / Non-religious",shortName:"Civil",faithGroup:"None",blurb:"A wedding shaped entirely by you: a registrar or celebrant, your own vows, readings and music, and no religious framework unless you choose to borrow from one.",typicalGuests:{low:20,typical:90,high:180},terms:{officiant:"registrar or celebrant",ceremonyVenue:"ceremony room",ceremony:"ceremony",bestMan:"best man",maidOfHonour:"maid of honour",reception:"reception",firstDance:"first dance",witnesses:"witnesses"},events:[{id:"engagement-party",name:"Engagement party",when:"Within a few months of the engagement",optional:!0,default:!1,description:"An informal gathering to celebrate the engagement, at home, in a pub or restaurant, or as a bigger party. There is no set form; some couples use it as the moment the two families and friendship groups first mix."},{id:"hen-stag",name:"Hen and stag celebrations",when:"One to three months before",optional:!0,default:!0,description:"Called a bachelorette and bachelor party in the US and a hen and stag do in Britain and Ireland. Increasingly mixed or joint, and anything from one night out to a weekend away. Usually organised and paid for by the wedding party rather than"},{id:"rehearsal-walkthrough",name:"Venue walkthrough or rehearsal",when:"A day or two before, or the week of the wedding",optional:!0,default:!1,description:"Civil weddings rarely have a formal rehearsal; the registrars brief you on the day and interview each of you privately before the ceremony. Celebrant-led couples more often do a short run-through, since the celebrant controls the running or"},{id:"statutory-marriage",name:"Statutory marriage at the register office",when:"Days or weeks before, or the same morning",optional:!0,default:!1,description:"The legal two-step for celebrant-led couples in England and Wales: a short, basic register office ceremony with just the two of you and two witnesses, which makes you legally married, followed by the celebrant ceremony everyone will remembe"},{id:"first-look",name:"First look",when:"Wedding morning, before the ceremony",optional:!0,default:!1,description:"A private, photographed moment where you see each other before the ceremony instead of at the top of the aisle. It calms nerves, and it lets couple portraits happen before guests arrive, freeing up the drinks reception. Entirely a matter of"},{id:"ceremony",name:"The ceremony",when:"The wedding day",optional:!1,default:!0,description:"Typically 20 to 45 minutes. A registrar-led civil ceremony includes the required legal declarations plus any non-religious readings, music and personal vows you have agreed in advance; two witnesses must be present and you sign the marriage"},{id:"drinks-reception",name:"Drinks reception",when:"Straight after the ceremony",optional:!0,default:!0,description:"An hour or two of drinks and canapés while photographs happen and the room is turned around for the meal. At a single-venue wedding this is the natural congratulations moment, since there is no journey between ceremony and reception."},{id:"reception",name:"Wedding breakfast and speeches",when:"Wedding day, afternoon",optional:!1,default:!0,description:"The main meal, still called the wedding breakfast in Britain whatever the hour. Speeches traditionally run father of the bride, then the groom, then the best man, but civil weddings freely reorder this: couples speak together, mothers and m"},{id:"evening-reception",name:"Evening reception",when:"Wedding day, evening",optional:!0,default:!0,description:"The cake cutting, first dance, band or DJ, and evening food. Many British couples invite a second, larger guest list for the evening only, which lets colleagues and the wider circle join without a bigger seated meal."},{id:"day-after-brunch",name:"Day-after gathering",when:"The day after",optional:!0,default:!1,description:"A relaxed brunch, pub lunch or barbecue for close family and guests who travelled. Common when the venue has accommodation or the wedding is a weekend away; not expected otherwise."}],items:[{id:"notice-fees",name:"Notice of marriage fees",section:"Ceremony",event:"",note:"The statutory fee each of you pays to give notice at the register office. In England and Wales it is charged per person and is higher if either of you is referred for immigration checks. Scotland, Nor",essential:!0,share:.003,supplier:"Civil registration",religious:!1},{id:"registrar-ceremony-fee",name:"Registrar and ceremony fee",section:"Ceremony",event:"ceremony",note:"What the registration service charges for the ceremony itself. A register office ceremony room is the cheapest route; registrars attending an approved venue cost noticeably more, and most councils pri",essential:!0,share:.008,supplier:"Civil registration",religious:!1},{id:"celebrant-fee",name:"Celebrant fee",section:"Ceremony",event:"ceremony",note:"For a celebrant-led ceremony: the fee covers meetings, writing a script from scratch around you, editing it with you, the day itself and often a rehearsal. Humanist celebrants (through Humanists UK or",essential:!1,share:.015,supplier:"Celebrant",religious:!1},{id:"statutory-ceremony-fee",name:"Statutory ceremony fee",section:"Ceremony",event:"statutory-marriage",note:"The basic register office ceremony that makes a celebrant-led wedding legally binding in England and Wales. It usually includes the registrars and one marriage certificate. Only needed if your main ce",essential:!1,share:.002,supplier:"Civil registration",religious:!1},{id:"marriage-certificates",name:"Marriage certificate copies",section:"Ceremony",event:"",note:"In England and Wales certificates are no longer handed over on the day: the signed schedule goes back to the register office, the marriage is registered electronically and certificates are posted afte",essential:!0,share:.001,supplier:"Civil registration",religious:!1},{id:"ceremony-room-hire",name:"Ceremony room or space hire",section:"Ceremony",event:"ceremony",note:"Many venues charge separately for the ceremony room or outdoor ceremony area on top of the main venue hire, and register offices charge more for their larger, prettier rooms than for the basic one. If",essential:!1,share:.015,supplier:"Venue",religious:!1},{id:"ceremony-musicians",name:"Ceremony musicians",section:"Ceremony",event:"ceremony",note:"A string quartet, acoustic guitarist, pianist or singer for the entrance, signing and exit. Entirely optional: recorded music through the venue's system is normal and most registration services simply",essential:!1,share:.008,supplier:"Musicians",religious:!1},{id:"unity-ceremony-supplies",name:"Symbolic ceremony supplies",section:"Ceremony",event:"ceremony",note:"The kit for any symbolic act you add: handfasting cords or ribbons, a sand-blending set, a memory or wine box, a quaich, or a tree and soil. All optional, and cheap compared with almost everything els",essential:!1,share:.001,supplier:"Ceremony supplies",religious:!1},{id:"destination-legal-documents",name:"Destination wedding legal documents",section:"Ceremony",event:"",note:"If you marry abroad: a certificate of no impediment where the country asks for one, apostille legalisation, certified translations, and courier fees. Requirements differ sharply by country, and some h",essential:!1,share:.002,supplier:"Civil registration",religious:!1},{id:"reception-venue",name:"Venue hire",section:"Reception",event:"reception",note:"For civil weddings the ceremony and reception are very often under one roof, which is the main structural difference from a church wedding: one venue, no travel, and in England and Wales the venue mus",essential:!0,share:.095,supplier:"Venue",religious:!1},{id:"catering",name:"Wedding meal",section:"Reception",event:"reception",note:"Usually the single largest line. Check what the per-head price actually includes: staffing, linen, cake cutting, corkage and service charge are the usual quiet extras. Dietary requirements are simpler",essential:!0,share:.23,supplier:"Catering",religious:!1},{id:"drinks",name:"Drinks and bar",section:"Reception",event:"reception",note:"Reception drinks, wine with the meal, a toast drink and whatever you put behind the bar. Note one rule that surprises people at approved premises in England and Wales: alcohol cannot be sold or consum",essential:!0,share:.092,supplier:"Catering",religious:!1},{id:"evening-food",name:"Evening food",section:"Reception",event:"evening-reception",note:"The late spread for dancers and evening guests: bacon rolls, pizza, a cheese table, a food truck. If you invite a separate evening guest list, budget this per evening head, not per daytime head.",essential:!1,share:.02,supplier:"Catering",religious:!1},{id:"wedding-cake",name:"Wedding cake",section:"Reception",event:"evening-reception",note:"Cut together as one of the evening's marker moments, often photographed just before the first dance. Some couples replace it with a cheese tower, doughnut wall or dessert table; nothing about a civil ",essential:!0,share:.012,supplier:"Cake",religious:!1},{id:"day-after-food",name:"Day-after gathering",section:"Reception",event:"day-after-brunch",note:"Brunch, a pub lunch or a barbecue for those staying over. Keep it informal and self-serve; after a wedding, nobody wants a second seating plan.",essential:!1,share:.012,supplier:"Catering",religious:!1},{id:"outfit-one",name:"Wedding dress or first outfit",section:"Attire",event:"",note:"No dress code comes with a civil wedding: full gown, jumpsuit, suit or something entirely your own all work. Made-to-order dresses need six months or more plus alterations; off-the-peg and second-hand",essential:!0,share:.05,supplier:"Bridal",religious:!1},{id:"outfit-two",name:"Partner's outfit",section:"Attire",event:"",note:"Bought or hired suit, tuxedo or a second dress. Hiring makes sense if the wedding party is matching; buying makes sense if you will wear it again.",essential:!0,share:.018,supplier:"Menswear",religious:!1},{id:"accessories",name:"Shoes, veil and accessories",section:"Attire",event:"",note:"Shoes, jewellery, and a veil if you want one; plenty of civil brides skip the veil entirely. If your ceremony is outdoors on grass, think about heels before the day does it for you.",essential:!0,share:.008,supplier:"Bridal",religious:!1},{id:"wedding-party-outfits",name:"Wedding party outfits",section:"Attire",event:"",note:"Bridesmaids, groomsmen, flower girls and page boys, if you have them; a civil wedding can just as easily have no wedding party at all. Who pays varies by family. Mismatched-but-coordinating outfits ha",essential:!1,share:.01,supplier:"Bridal",religious:!1},{id:"hair-makeup",name:"Hair and make-up",section:"Beauty",event:"",note:"A trial beforehand plus the wedding morning. Book the trial around the time of your final dress fitting so the whole look comes together at once.",essential:!0,share:.012,supplier:"Beauty",religious:!1},{id:"party-beauty",name:"Wedding party hair and make-up",section:"Beauty",event:"",note:"Priced per head for bridesmaids and mothers. Decide early whether you are treating or they are paying, and confirm numbers before the stylist books a second artist.",essential:!1,share:.006,supplier:"Beauty",religious:!1},{id:"bouquets-buttonholes",name:"Bouquets and buttonholes",section:"Flowers & Styling",event:"",note:"Bouquet, bridesmaids' flowers, buttonholes and corsages for parents. Dried and silk flowers are common at civil weddings and survive the day rather better than they used to.",essential:!0,share:.014,supplier:"Florist",religious:!1},{id:"ceremony-flowers",name:"Ceremony flowers and arch",section:"Flowers & Styling",event:"ceremony",note:"An arch, arrangement or aisle flowers to frame the ceremony spot, which matters more at a civil wedding because the backdrop is whatever you make it rather than a church. Choose pieces that can move: ",essential:!1,share:.015,supplier:"Florist",religious:!1},{id:"reception-flowers",name:"Reception flowers and styling",section:"Flowers & Styling",event:"reception",note:"Centrepieces, top table flowers and general styling. Because a civil wedding usually happens in one venue, one coherent look carries the whole day, which is simpler and often cheaper than dressing two",essential:!0,share:.03,supplier:"Florist",religious:!1},{id:"lighting-dancefloor",name:"Lighting and dance floor",section:"Flowers & Styling",event:"evening-reception",note:"Festoon lights, uplighting or a hired dance floor. Most relevant for marquees, barns and dry-hire spaces; hotels usually come dressed.",essential:!1,share:.01,supplier:"Styling",religious:!1},{id:"signage-decor",name:"Signage and decor extras",section:"Flowers & Styling",event:"",note:"Welcome sign, seating chart display, table names, candles and the odd neon sign. Small individually; keep a single decor list or this category multiplies quietly.",essential:!1,share:.006,supplier:"Styling",religious:!1},{id:"photographer",name:"Photographer",section:"Photos & Film",event:"",note:"Civil ceremonies are generally relaxed about photography, but the registrars or celebrant run the room, so have your photographer introduce themselves before the ceremony and agree where they can stan",essential:!0,share:.068,supplier:"Photography",religious:!1},{id:"videographer",name:"Videographer",section:"Photos & Film",event:"",note:"Highlights film or full-ceremony edit. Personal vows are the thing couples most often wish they had on film, so if the budget only stretches to partial coverage, cover the ceremony and speeches.",essential:!1,share:.035,supplier:"Videography",religious:!1},{id:"photo-booth",name:"Photo booth",section:"Photos & Film",event:"evening-reception",note:"A booth or backdrop with props for the evening. Doubles as a guest book if the booth prints two copies, one for guests and one for an album they sign.",essential:!1,share:.008,supplier:"Photography",religious:!1},{id:"band",name:"Band or main entertainment",section:"Music & Entertainment",event:"evening-reception",note:"A live band for the evening is the classic centrepiece, but civil weddings go every direction: DJ only, a ceilidh caller, an acoustic act that plays daytime and evening. Check the venue's sound limite",essential:!0,share:.058,supplier:"Entertainment",religious:!1},{id:"dj",name:"DJ",section:"Music & Entertainment",event:"evening-reception",note:"Either the main event or the act that takes over between and after band sets. A good DJ takes requests and reads the room; send a short do-not-play list rather than a full playlist.",essential:!1,share:.018,supplier:"Entertainment",religious:!1},{id:"daytime-entertainment",name:"Daytime entertainment",section:"Music & Entertainment",event:"drinks-reception",note:"Lawn games, a magician, a caricaturist or live music for the drinks reception. Most useful when portraits will take you away from guests for a stretch.",essential:!1,share:.006,supplier:"Entertainment",religious:!1},{id:"invitations",name:"Invitations and save the dates",section:"Stationery",event:"",note:"Printed, digital or a mix; many couples now run RSVPs through a free wedding website and print only the main invitation. If you have separate daytime and evening guest lists, you need two versions, an",essential:!0,share:.012,supplier:"Stationery",religious:!1},{id:"on-the-day-stationery",name:"On-the-day stationery",section:"Stationery",event:"reception",note:"Order of the day, place cards, menus and the table plan. A civil order of service is short, one card rather than a booklet, and entirely optional.",essential:!1,share:.006,supplier:"Stationery",religious:!1},{id:"wedding-cars",name:"Wedding cars",section:"Transport",event:"",note:"Transport to the ceremony, and between venues if you have two. At a single-venue wedding many couples skip cars entirely or hire one for the arrival photographs only.",essential:!1,share:.01,supplier:"Transport",religious:!1},{id:"guest-transport",name:"Guest transport",section:"Transport",event:"",note:"A coach or minibus at the end of the night is money well spent when the venue is rural, and some venues in remote spots effectively require it. Less necessary at town-centre venues near taxis and hote",essential:!1,share:.008,supplier:"Transport",religious:!1},{id:"wedding-rings",name:"Wedding rings",section:"Rings & Gifts",event:"ceremony",note:"Exchanged during the ceremony by long custom, though no law in the UK requires rings at all: the marriage is made by the declarations and the signatures. One ring, two rings or none are all fine, and ",essential:!0,share:.03,supplier:"Jewellery",religious:!1},{id:"party-gifts",name:"Gifts for the wedding party and parents",section:"Rings & Gifts",event:"",note:"Thank-yous for attendants, parents, readers and your witnesses. Witnesses are worth remembering here: at a civil wedding they have a genuine legal role, and a small gift acknowledges it.",essential:!1,share:.008,supplier:"Gifts",religious:!1},{id:"favours",name:"Favours",section:"Extras",event:"reception",note:"A small token at each place setting. Entirely optional and one of the first lines couples cut; a charity donation card per table is a common replacement.",essential:!1,share:.006,supplier:"Favours",religious:!1},{id:"wedding-insurance",name:"Wedding insurance",section:"Extras",event:"",note:"Covers supplier failure, cancellation, illness and damage. Buy it when you pay your first deposit, not the month before the wedding, because cover starts from purchase. Some venues and marquee compani",essential:!1,share:.003,supplier:"Insurance",religious:!1},{id:"accommodation",name:"Wedding night accommodation",section:"Extras",event:"",note:"Your room, and possibly rooms for parents or the wedding party. If the venue offers a bedroom block, find out who pays if guests do not fill it; that clause catches people out.",essential:!1,share:.008,supplier:"Accommodation",religious:!1},{id:"planner-coordinator",name:"Planner or on-the-day coordinator",section:"Extras",event:"",note:"A full planner suits complicated or long-distance weddings; an on-the-day coordinator suits couples who have planned everything and want to hand over the running of it. Dry-hire venues without in-hous",essential:!1,share:.02,supplier:"Planning",religious:!1},{id:"confetti",name:"Confetti",section:"Extras",event:"ceremony",note:"The confetti exit is one of the defining photographs of a civil wedding. Most venues insist on dried petals or other biodegradable confetti and ban the paper kind, so check the rule and tell guests, o",essential:!1,share:.001,supplier:"Ceremony supplies",religious:!1}],timeline:[{mb:14,task:"Decide the shape of the day: register office, an approved venue with a registrar, or a celebrant-led ceremony with a separate statutory marriage (England and Wales) or a legally authorised celebrant (Scotland and Northern Ireland)",critical:!0},{mb:14,task:"Agree the overall budget and rough guest numbers with everyone contributing",critical:!1},{mb:13,task:"In England and Wales, check the registration service's availability for your date before you confirm the venue: the registrar and the venue are separate bookings and both must line up",critical:!0},{mb:12,task:"Book the venue, checking it is on the council's approved premises list if a registrar is marrying you there in England or Wales",critical:!0},{mb:12,task:"Book the registrars' attendance with the council, or book your celebrant",critical:!0},{mb:12,task:"Take out wedding insurance as soon as the first deposits are paid",critical:!1},{mb:11,task:"Book the photographer and videographer",critical:!1},{mb:10,task:"Book the band or DJ, checking the venue's sound limiter and finish time first",critical:!1},{mb:10,task:"Start outfit shopping; made-to-order dresses need six months or more plus alterations",critical:!1},{mb:9,task:"Send save the dates, especially if guests are travelling",critical:!1},{mb:8,task:"Book the florist, and the caterer if your venue is dry hire",critical:!1},{mb:8,task:"If marrying abroad, research that country's legal requirements, residency rules and paperwork now, and decide whether to do the legal marriage at home instead",critical:!0},{mb:7,task:"Start shaping the ceremony: choose readings, music and any symbolic elements, and begin the script with your celebrant if you have one",critical:!1},{mb:6,task:"In England and Wales, send your proposed music and readings to the registration service for approval, since religious content is not allowed and decisions vary between districts",critical:!1},{mb:5,task:"Order invitations",critical:!1},{mb:4,task:"Send invitations, making the daytime and evening guest distinction unmissable if you have one",critical:!1},{mb:4,task:"Give notice: in England and Wales at your local register office at least 29 days before the ceremony (valid 12 months); in Scotland submit M10 forms no later than 29 days and no earlier than 3 months before; in Northern Ireland at least 28 days before",critical:!0},{mb:3,task:"Buy the wedding rings, or decide you are not having them",critical:!1},{mb:3,task:"Hair and make-up trial, timed near a dress fitting",critical:!1},{mb:3,task:"Choose your two witnesses and tell them what the role involves",critical:!1},{mb:2,task:"Write your personal vows and share them with your celebrant, or check what additions your registrar allows",critical:!1},{mb:2,task:"Confirm final numbers with the caterer and the running order with the venue",critical:!0},{mb:1,task:"Final venue meeting: confirm registrar or celebrant arrival time, the pre-ceremony interview, and where the signing table goes",critical:!1},{mb:1,task:"If your main ceremony is celebrant-led in England or Wales, confirm the statutory register office booking and the witnesses attending it",critical:!0},{mb:.5,task:"In Scotland, collect the marriage schedule in person from the register office in the seven days before the wedding; in Northern Ireland collect it no more than 14 days before",critical:!0},{mb:.25,task:"Walk through the ceremony space, or hold a short rehearsal if your celebrant offers one",critical:!1}],paperwork:[{item:"Notice of marriage (England and Wales)",who:"Both",note:"Given in person at a register office in the district where you live, after living there for at least the past 7 days. It must be given at least 29 days before the ceremony, the notice is publicly displayed at the registe"},{item:"Documents for giving notice",who:"Both",note:"A valid passport or UK birth certificate, plus proof of address such as a driving licence, utility bill, bank statement or tenancy agreement. If you were born after 1 January 1983 and use a UK birth certificate, you may "},{item:"Evidence a previous marriage or civil partnership has ended",who:"Either party previously married",note:"A decree absolute or final order, or the former partner's death certificate. Divorces granted outside the UK have to be checked by the registration service, which carries a fee and can add time, so raise it at the start "},{item:"Evidence of any name change",who:"Either, if applicable",note:"A deed poll or equivalent, so the names on your documents line up."},{item:"Immigration documents and joint notice",who:"Any partner who is not a British or Irish citizen without settled or pre-settled status",note:"You must give notice together at a designated register office, bring passport photos and evidence of immigration status, and translations of any documents not in English. The standard waiting period can be extended from "},{item:"Marriage schedule (England and Wales)",who:"Both",note:"Since May 2021 you sign a marriage schedule at the ceremony rather than a register book. The registrar takes it away, the marriage is entered in an electronic register, and up to four parents' names (mothers included) ca"},{item:"Marriage certificates",who:"Both",note:"No longer handed over on the day in England and Wales; they are posted after the marriage is registered. Order extra certified copies for passports, banks and name changes."},{item:"M10 marriage notice forms (Scotland)",who:"Both",note:"Each of you submits an M10 to the registrar for the district where the ceremony will be held, no later than 29 days and no earlier than 3 months before. There is no residency requirement in Scotland; couples from anywher"},{item:"Marriage schedule (Scotland)",who:"Both",note:"One of you must collect it in person from the register office in the seven days before the wedding; nobody can collect it for you. It is signed after the ceremony by you both, the celebrant and two witnesses aged 16 or o"},{item:"Marriage notice forms (Northern Ireland)",who:"Both",note:"Submitted to the registrar for the district where the ceremony takes place, at least 28 days before and no more than a year ahead; registration offices recommend around 12 to 14 weeks. The schedule is collected in person"},{item:"Three months notification (Republic of Ireland)",who:"Both",note:"You must notify a civil registrar (HSE) at least three months before the wedding, usually in person, and you receive a Marriage Registration Form that the solemniser needs on the day. Humanist Association of Ireland cele"},{item:"Statutory ceremony booking (England and Wales two-step)",who:"Both, if your main ceremony is celebrant-led",note:"The short register office ceremony that makes the marriage legal. Councils run them on limited days with only your two witnesses attending, so book it when you book the celebrant, not as an afterthought."},{item:"Certificate of no impediment",who:"Both, if marrying abroad and the country requires one",note:"Issued after you give notice at your local register office; only British nationals can get one this way, and other nationals should ask their embassy. Check with the country's authorities how long it stays valid, as this"},{item:"Legalisation and translations for marrying abroad",who:"Both, if marrying abroad",note:"Many countries require your documents to be legalised with an apostille and translated by a certified translator. Allow weeks rather than days, and check whether the translations themselves need legalising."},{item:"Foreign marriage certificate",who:"Both, if you married abroad",note:"A marriage legally performed abroad is recognised in the UK provided it followed local law and you were both free to marry; there is no requirement, and no facility, to register it in the UK afterwards. Keep the original"}],customs:[{name:"Personal vows",description:"Promises you write yourselves, spoken alongside the required legal declarations rather than instead of them. Registrars allow non-religious additions to the set wording; celebrants build the whole ceremony around them. Keep a printed copy each; almost nobody trusts memory on the day."},{name:"The celebrant tells your story",description:"The heart of most celebrant-led and humanist ceremonies: the celebrant recounts how you met and who you are as a couple, gathered from meetings and questionnaires beforehand. It is the part guests most often say they remember."},{name:"First look",description:"Seeing each other privately before the ceremony, usually photographed. A deliberate modern swap for the aisle reveal, chosen for calm nerves and better use of the day; couples who prefer the traditional moment simply skip it."},{name:"Walking in together",description:"Many couples now enter side by side, or each walk in with a parent, or with both parents, rather than one waiting at the front. There is no rule; a civil ceremony lets you stage the entrance any way that feels honest."},{name:"Handfasting",description:"The couple's hands are loosely bound with cords or ribbons while promises are made, a practice with Celtic roots and the likely origin of 'tying the knot'. Used in entirely secular form at many humanist and celebrant ceremonies, sometimes with family members each laying a ribbon."},{name:"Sand blending",description:"Each of you pours coloured sand into one vessel, the layers standing for two lives combined; children from either side are often given their own colour so the whole new family pours together. A modern, secular unity ritual."},{name:"Unity candle",description:"Two side candles used to light one central candle. It has church origins in some countries but is used in a fully secular form at civil and celebrant ceremonies; outdoor couples learn quickly that wind is its natural enemy."},{name:"Ring warming",description:"The rings are passed among guests, or hung where guests can hold them, so everyone briefly holds them and wishes you well before the exchange. Works best at smaller ceremonies where the rings can genuinely travel the room and return in time."},{name:"Wine box or letter ceremony",description:"You seal a bottle and letters to each other in a box during the ceremony, to be opened on a future anniversary. A celebrant-era invention with no religious content, and a favourite for couples who want a ritual object to keep."},{name:"Tree planting",description:"You pot or plant a tree together, sometimes with soil from each family's home. Suits outdoor and garden weddings, and leaves you with something that grows; check the logistics of moving it afterwards."},{name:"The quaich",description:"A two-handled Scottish cup shared as a first drink together, each holding one handle, as a sign of trust. Traditional at Scottish weddings and borrowed well beyond them."},{name:"Readings by guests",description:"Friends and family read poems, prose or song lyrics during the ceremony. At a registrar-led ceremony in England and Wales the readings must be non-religious; celebrant ceremonies have no restrictions at all."},{name:"Confetti exit",description:"Guests shower you with petals or paper shapes as you leave the ceremony or the venue. Most venues now require biodegradable confetti or dried petals, so supply it in cones and tell the photographer where the throw will happen."},{name:"Receiving line",description:"The couple, and traditionally both sets of parents, greet every guest in turn before the meal. Falling out of fashion because it is slow at large weddings; many couples replace it by visiting tables during the meal."},{name:"Speeches",description:"The traditional British order is father of the bride, groom, best man, ending with toasts. Civil weddings rearrange freely: both partners speak, a maid of honour speaks, parents share a toast, or speeches are dropped entirely. Tell speakers a time limit and mean it."},{name:"First dance",description:"The couple open the dancing to a chosen song, often followed by parent dances in families that keep that custom. Couples who dread it choose a short song, invite everyone onto the floor after the first minute, or skip it without ceremony."},{name:"Cutting the cake",description:"The couple make the first cut together, usually photographed, often just before the first dance so the evening moments run in sequence. The old custom of saving a tier has faded along with fruit cake, but nothing stops you."},{name:"Unplugged ceremony",description:"Guests are asked to put phones and cameras away for the ceremony so the photographer's shots are clear of screens and everyone is actually watching. Announced by a sign, the celebrant or the registrar's introduction."},{name:"Something old, something new",description:"The rhyme continues 'something borrowed, something blue', each item worn or carried for luck. A folk custom with no religious content, kept alive because it gives mothers, grandmothers and friends a way into the wedding morning."},{name:"The night before apart",description:"Spending the last night in separate places and not seeing each other until the ceremony. Pure superstition and widely ignored by couples who would rather wake up together; the first look exists partly because this custom loosened."},{name:"Gift lists and honeymoon funds",description:"Couples who already share a home increasingly ask for contributions to the honeymoon or a house fund instead of a traditional gift list, usually via a line on the invitation or wedding website. Cash in cards remains completely normal in many families."}],gotchas:["In England and Wales a celebrant-led or humanist ceremony is not legally binding on its own. You also need a legal marriage before a registrar, usually a short statutory ceremony at the register office. Budget for both and put both in the diary.","The UK Government announced in October 2025 that it intends to give humanist marriages legal recognition in England and Wales, but with further consultation planned the law has not yet changed. Plan on the two-step unless your registration service confirms otherwise.","In Scotland the position is different: Humanist Society Scotland and other authorised belief celebrants have legally married couples since 2005, and in Northern Ireland humanist marriages have been legal since 2018. No separate registrar ceremony is needed there.","The registrar and the venue are separate bookings in England and Wales. Couples book a venue, announce the date, and only then discover no registrar is free. Check ceremony availability with the registration service before you pay a venue deposit.","You give notice in the district where you live, not where you are marrying, and you must have lived there for the previous 7 days. Both of you attend in person. If you live in different districts you each give notice in your own.","Notice in England and Wales is valid for only 12 months, so with a long engagement you cannot give notice when you book; the venue may be booked two years out while the legal clock cannot start until the final year.","If either of you is not a British or Irish citizen and has no settled status, you must give notice together at a designated register office, and the waiting period can be extended from 29 to 70 days for Home Office checks. Do not book a date inside that window.","A civil ceremony in England and Wales must contain nothing religious: no hymns, no scripture, and registrars vet your music and readings in advance. Songs with a passing mention of heaven or angels are treated differently from district to district, so submit your choices early ra","Outdoor ceremonies in England and Wales are legal only within the grounds of approved premises, in an outdoor area the venue has agreed with the registrar, who must consider it seemly and dignified. A beach, a park or your own back garden is not an option unless it is part of lic","A statutory register office ceremony is deliberately minimal: limited days and times, only your two witnesses present, no music, no readings, no personalisation. Treat it as the legal step, not a small wedding, and save the meaning for your main ceremony.","In England and Wales you no longer get a marriage certificate on the day. The schedule is registered electronically and certificates are posted afterwards, so do not book anything that needs proof of marriage, like a passport in a new name, for the days straight after the wedding","Witnesses must be able to see and understand what is happening, and most registration services ask that they be at least 16. Choose them in advance; pulling in a stranger works legally but makes for an odd photograph and an odder story.","At approved premises in England and Wales, alcohol cannot be sold or consumed in the ceremony area in the period immediately before and during the ceremony, so plan the welcome drinks for after the legal part, not before.","Marrying in Scotland has no residency requirement, which is why couples travel there, but the schedule must be collected in person by one of you in the seven days before the wedding and returned within three days after. For a destination-Scotland wedding that means arriving early","For a destination wedding, the country's own rules govern everything: some require weeks of residence, most require legalised and translated documents, and a certificate of no impediment takes time because it follows the notice process at home. Many couples marry legally at home ","A marriage validly performed abroad is already recognised in the UK; you cannot register it here and you cannot legally marry the same person again in the UK to be safe. Buy several certified copies of the certificate and a certified translation before leaving the country, becaus","Humanist celebrants and independent celebrants are not the same thing: humanist celebrants conduct non-religious ceremonies only, while independent celebrants will include religious or spiritual content if you ask. In Scotland and Northern Ireland, also check your celebrant is le","Registrar fees differ by day of the week and by setting: a weekend ceremony at an approved venue costs several times a weekday register office slot. If the budget is tight, a weekday or an off-season date moves this line and usually the venue price too."]}},y=[["AU","Australia","AUD",1.1,1.95],["CA","Canada","CAD",1.05,1.75],["CY","Cyprus","EUR",.72,1.15],["FR","France","EUR",.9,1.15],["DE","Germany","EUR",.85,1.15],["GR","Greece","EUR",.68,1.15],["IN","India","INR",.35,110],["IE","Ireland","EUR",1.05,1.15],["IL","Israel","ILS",1,4.6],["IT","Italy","EUR",.85,1.15],["NL","Netherlands","EUR",.9,1.15],["PT","Portugal","
